image: alpine/latest
packages:
  - sqlite-dev
  - rust
  - cargo
  - openssl-dev
  - build-base
  - curl
  - jq
  - bash
sources:
  - https://git.sr.ht/~taum/sanshain
tasks:
  - build: |
      cd sanshain
      cargo build --release
  - test: |
      cd sanshain
      cargo test
  - itest: |
      cd sanshain
      export INITIAL_ADMIN_PASSWORD=root_password
      cargo build
      cargo run &
      READY=0
      for i in $(seq 1 60); do
        if curl -s http://localhost:3000/health | grep -q "OK"; then
          echo "Service is up!"
          READY=1
          break
        fi
        echo "Waiting for service... ($i)"
        sleep 2
      done
      if [ $READY -eq 0 ]; then
        echo "Service failed to start"
        exit 1
      fi
      ./scripts/itest.sh http://localhost:3000 root_password
