{% if enabled %}
<button hx-post="/fragments/admin/local-users/toggle"
        hx-target="#local-users-container"
        hx-swap="innerHTML"
        class="relative inline-flex h-6 w-11 items-center rounded-full bg-green-500 transition-colors">
    <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-6"></span>
</button>
<span class="text-sm text-green-600 font-medium">Enabled</span>
{% else %}
<button hx-post="/fragments/admin/local-users/toggle"
        hx-target="#local-users-container"
        hx-swap="innerHTML"
        class="relative inline-flex h-6 w-11 items-center rounded-full bg-slate-300 transition-colors">
    <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-1"></span>
</button>
<span class="text-sm text-slate-500">Disabled</span>
{% endif %}
