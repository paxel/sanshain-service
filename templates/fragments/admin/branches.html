{% if branches.is_empty() %}
<p class="text-xs text-slate-400 italic">No branches</p>
{% else %}
{% for b in branches %}
{% let is_protected = protected_patterns.contains(b) %}
<div class="flex justify-between items-center {% if is_protected %}bg-red-50 border-red-200{% else %}bg-white border-slate-100{% endif %} px-3 py-1.5 rounded border fade-in">
    <div class="flex items-center space-x-2">
        {% if is_protected %}<span class="text-red-500 text-xs" title="Protected branch">🛡️</span>{% endif %}
        <span class="text-sm font-mono {% if is_protected %}text-red-700 font-semibold{% else %}text-slate-600{% endif %}">{{ b }}</span>
    </div>
    {% if is_protected %}
    <button hx-delete="/fragments/admin/services/{{ service_name }}/branches/{{ b }}"
            hx-target="#services-list"
            hx-swap="innerHTML"
            hx-confirm="⚠️ WARNING: '{{ b }}' is a PROTECTED branch! Deleting it will remove all its endpoints and data permanently. Are you sure?"
            class="text-red-600 hover:text-red-800 text-xs font-bold">☠️ Nuke</button>
    {% else %}
    <button hx-delete="/fragments/admin/services/{{ service_name }}/branches/{{ b }}"
            hx-target="#services-list"
            hx-swap="innerHTML"
            hx-confirm="Delete branch {{ b }} from {{ service_name }}?"
            class="text-red-400 hover:text-red-600 text-xs">Delete</button>
    {% endif %}
</div>
{% endfor %}
{% endif %}
