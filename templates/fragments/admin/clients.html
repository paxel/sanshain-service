{% if clients.is_empty() %}
<p class="text-sm text-slate-400 italic">No clients registered.</p>
{% else %}
{% for c in clients %}
<div class="bg-slate-50 rounded-lg p-4 fade-in">
    <div class="flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <button hx-get="/fragments/admin/clients/{{ c }}/branches"
                    hx-target="#client-branches-{{ loop.index }}"
                    hx-swap="innerHTML"
                    onclick="let el=document.getElementById('client-branches-{{ loop.index }}'); if(!el.classList.contains('hidden')){el.classList.add('hidden');this.textContent='▶';event.preventDefault();return false;}else{el.classList.remove('hidden');this.textContent='▼';}"
                    class="text-slate-400 hover:text-slate-600 text-sm">▶</button>
            <span class="font-medium text-slate-800">{{ c }}</span>
        </div>
        <button hx-delete="/fragments/admin/clients/{{ c }}"
                hx-target="#clients-list"
                hx-swap="innerHTML"
                hx-confirm="Delete client {{ c }} and all its dependencies?"
                class="text-red-500 hover:text-red-700 text-sm">Delete</button>
    </div>
    <div id="client-branches-{{ loop.index }}" class="mt-3 ml-8 space-y-1 hidden"
         hx-get="/fragments/admin/clients/{{ c }}/branches"
         hx-swap="innerHTML"></div>
</div>
{% endfor %}
{% endif %}
