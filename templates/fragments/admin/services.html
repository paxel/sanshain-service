{% if services.is_empty() %}
<p class="text-sm text-slate-400 italic">No services registered.</p>
{% else %}
{% for svc in services %}
<div class="bg-slate-50 rounded-lg p-4 fade-in">
    <div class="flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <button hx-get="/fragments/admin/services/{{ svc }}/branches"
                    hx-target="#branches-{{ loop.index }}"
                    hx-swap="innerHTML"
                    onclick="let c=document.getElementById('branches-{{ loop.index }}'); if(!c.classList.contains('hidden')){c.classList.add('hidden');this.textContent='▶';event.preventDefault();return false;}else{c.classList.remove('hidden');this.textContent='▼';}"
                    class="text-slate-400 hover:text-slate-600 text-sm">▶</button>
            <span class="font-medium text-slate-800">{{ svc }}</span>
        </div>
        <button hx-delete="/fragments/admin/services/{{ svc }}"
                hx-target="#services-list"
                hx-swap="innerHTML"
                hx-confirm="Delete service {{ svc }} and all its data?"
                class="text-red-500 hover:text-red-700 text-sm">Delete</button>
    </div>
    <div id="branches-{{ loop.index }}" class="hidden mt-3 ml-8 space-y-1"></div>
</div>
{% endfor %}
{% endif %}
