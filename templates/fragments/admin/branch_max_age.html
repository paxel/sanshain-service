<form hx-post="/fragments/admin/branch-max-age"
      hx-target="#branch-max-age-container"
      hx-swap="innerHTML"
      class="flex items-center space-x-3">
    <input type="number" name="days" value="{{ days }}" min="1"
           class="w-24 px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    <span class="text-sm text-slate-500">days</span>
    <button type="submit"
            class="px-3 py-1.5 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700">Save</button>
    <button type="button"
            hx-post="/fragments/admin/branch-cleanup"
            hx-target="#branch-cleanup-result"
            hx-swap="innerHTML"
            class="px-3 py-1.5 bg-slate-600 text-white text-sm rounded-lg hover:bg-slate-700">Run Cleanup</button>
    <span id="branch-cleanup-result" class="text-sm text-slate-500"></span>
</form>
