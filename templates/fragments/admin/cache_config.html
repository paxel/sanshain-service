<form hx-post="/fragments/admin/cache-config"
      hx-target="#cache-config-container"
      hx-swap="innerHTML"
      class="flex items-center space-x-3">
    <input type="number" name="memory_mb" value="{{ memory_mb }}" min="0"
           class="w-24 px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    <span class="text-sm text-slate-500">MB</span>
    <button type="submit"
            class="px-3 py-1.5 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700">Save</button>
    <button type="button"
            hx-post="/fragments/admin/cache-clear"
            hx-target="#cache-clear-result"
            hx-swap="innerHTML"
            class="px-3 py-1.5 bg-slate-600 text-white text-sm rounded-lg hover:bg-slate-700">Clear Cache</button>
    <span id="cache-clear-result" class="text-sm text-slate-500"></span>
</form>
{% if enabled %}
<div class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
    <div class="bg-slate-50 rounded-lg p-3">
        <div class="text-slate-500">Hit Rate</div>
        <div class="font-semibold text-slate-800">{{ hit_rate }}%</div>
    </div>
    <div class="bg-slate-50 rounded-lg p-3">
        <div class="text-slate-500">Entries</div>
        <div class="font-semibold text-slate-800">{{ entry_count }}</div>
    </div>
    <div class="bg-slate-50 rounded-lg p-3">
        <div class="text-slate-500">Memory Used</div>
        <div class="font-semibold text-slate-800">{{ memory_used_mb }} MB</div>
    </div>
    <div class="bg-slate-50 rounded-lg p-3">
        <div class="text-slate-500">Hits / Misses</div>
        <div class="font-semibold text-slate-800">{{ hit_count }} / {{ miss_count }}</div>
    </div>
</div>
{% else %}
<div class="mt-3 text-sm text-slate-500">Cache disabled (set to 0 MB).</div>
{% endif %}
