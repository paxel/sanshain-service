<div class="space-y-4">
    <div class="flex space-x-4">
        <label class="flex items-center space-x-2 cursor-pointer">
            <input type="radio" name="auth-mode" value="local" {% if auth_mode == "local" %}checked{% endif %}
                   onchange="document.getElementById('ldap-config-form').classList.add('hidden')">
            <span class="text-sm text-slate-700">Local</span>
        </label>
        <label class="flex items-center space-x-2 cursor-pointer">
            <input type="radio" name="auth-mode" value="ldap" {% if auth_mode == "ldap" %}checked{% endif %}
                   onchange="document.getElementById('ldap-config-form').classList.remove('hidden')">
            <span class="text-sm text-slate-700">LDAP</span>
        </label>
    </div>
    <div id="ldap-config-form" class="{% if auth_mode != "ldap" %}hidden{% endif %} space-y-3 bg-slate-50 p-4 rounded-lg">
        <div>
            <label class="block text-xs text-slate-500 mb-1">Server URL</label>
            <input type="text" id="ldap-server-url" value="{{ ldap_server_url }}" placeholder="ldap://localhost:389"
                   class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">Bind DN</label>
            <input type="text" id="ldap-bind-dn" value="{{ ldap_bind_dn }}" placeholder="cn=admin,dc=example,dc=com"
                   class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">Bind Password</label>
            <input type="password" id="ldap-bind-password" value="{{ ldap_bind_password }}" placeholder="Leave blank to keep existing"
                   class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">Base DN</label>
            <input type="text" id="ldap-base-dn" value="{{ ldap_base_dn }}" placeholder="dc=example,dc=com"
                   class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">User Filter</label>
            <input type="text" id="ldap-user-filter" value="{{ ldap_user_filter }}" placeholder="(uid={username})"
                   class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-xs text-slate-500 mb-1">Admin Group</label>
            <input type="text" id="ldap-admin-group" value="{{ ldap_admin_group }}" placeholder="cn=admins,dc=example,dc=com"
                   class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <button onclick="testLdapConnection()" class="px-3 py-1.5 bg-slate-600 text-white text-sm rounded-lg hover:bg-slate-700">Test Connection</button>
        <div id="ldap-test-result" class="hidden text-sm px-3 py-2 rounded-lg"></div>
    </div>
    <button onclick="saveAuthConfig()" class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700">Save Authentication Settings</button>
</div>
