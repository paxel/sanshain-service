<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanshain - {% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/common.js"></script>
    {% block head_extra %}{% endblock %}
    <style>
        .fade-in { animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        {% block style_extra %}{% endblock %}
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    {% block body %}{% endblock %}

    <!-- Confirm Modal (shared) -->
    <div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-2">Confirm</h3>
            <p id="confirm-message" class="text-sm text-slate-600 mb-6"></p>
            <div class="flex space-x-3">
                <button id="confirm-yes" class="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition-colors font-medium">Delete</button>
                <button onclick="closeConfirmModal()" class="flex-1 bg-slate-100 text-slate-700 py-2 rounded-lg hover:bg-slate-200 transition-colors font-medium">Cancel</button>
            </div>
        </div>
    </div>

    <footer class="text-center text-sm text-slate-400 py-6 mt-auto">
        <img src="/images/sonne.png" alt="Sanshain" class="mx-auto mb-2 h-8 w-auto opacity-70">
        Sanshain &mdash; OpenAPI Distribution Service
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
