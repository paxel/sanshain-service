services:
  sanshain:
    image: ghcr.io/paxel/sanshain-service:__VERSION__
    ports:
      - "3000:3000"
    volumes:
      - sanshain-data:/data
    environment:
      - DATABASE_URL=sqlite:/data/sanshain.db?mode=rwc
      - RUST_LOG=sanshain_service=info,tower_http=info
    init: true
    restart: unless-stopped

volumes:
  sanshain-data:
