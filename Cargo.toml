[package]
name = "sanshain_service"
version = "1.6.1"
edition = "2024"
license = "Apache-2.0"

[lints.clippy]
# No-panic policy (see AGENTS.md / ai/improvements.md E3). Test code is exempt
# via `allow-*-in-tests` in clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# No-`#[allow]` policy (see AGENTS.md / ai/improvements.md E10). Silencing a lint
# with `#[allow(...)]` is forbidden — fix the lint instead. This denies the
# escape hatch itself so it cannot creep back in.
allow_attributes = "deny"

[features]
# Compiles in-memory test doubles (e.g. `MockRepo`). Enabled automatically for
# integration tests via the self dev-dependency below; never enabled for release builds.
test-support = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["std", "clock"], default-features = false }
sqlx = { version = "0.8", default-features = false, features = [ "runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "json" ] }
openapiv3 = "2.2"
serde_yaml_ng = "0.10"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "trace", "compression-gzip", "decompression-gzip"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
sha2 = "0.11"
askama = "0.15"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
regex = "1"
indexmap = "2"
similar = "3"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
axum-prometheus = "0.10"
metrics-exporter-prometheus = "0.18"
sysinfo = "0.38"
moka = { version = "0.12", features = ["future"] }
thiserror = "2"
opentelemetry = { version = "0.32", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"
opentelemetry-semantic-conventions = "0.32"

[dev-dependencies]
# Self-dependency so `tests/` and benches link the library with `test-support`
# enabled (integration tests are compiled without the `test` cfg of the crate).
sanshain_service = { path = ".", features = ["test-support"] }
flate2 = "1"
criterion = "0.5"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[[bench]]
name = "openapi_bench"
harness = false
