[package]
name = "sanshain_service"
version = "0.9.0"
edition = "2024"
license = "AGPL-3.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["std", "clock"], default-features = false }
sqlx = { version = "0.8", default-features = false, features = [ "runtime-tokio", "tls-rustls", "sqlite", "postgres", "macros", "migrate", "json" ] }
openapiv3 = "2.2"
serde_yaml = "0.9"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "trace", "compression-gzip", "decompression-gzip"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
sha2 = "0.11"
askama = "0.15"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
regex = "1"
indexmap = "2"
similar = "3"
axum-prometheus = "0.10"
metrics-exporter-prometheus = "0.18"
sysinfo = "0.38"

[dev-dependencies]
flate2 = "1"
