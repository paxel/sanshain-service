[package]
name = "sanshain_service"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[lib]
path = "src/main.rs"

[[bin]]
name = "sanshain_service_bin"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-rustls", "sqlite" ] }
openapiv3 = "2.2"
serde_yaml = "0.9"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.6.0-rc.7"
rand = "0.9"
hex = "0.4"
