I thought long and deep.

the branch concept is a mistake. we dont have access to git and making any assumptions about the intentions and versioning makes it a mess.

so restart from scratch Version 2.0

Branches are out.

The producer sends yamls.
the yamls have versions
the service checks the version and the full yaml.
if the version exists and the yaml is different:
  - the user wanted to change the api but forgot to increment the version.
  - reject with proposal for new version numbers depending on changes: and what the next version would be
- the client sends whether this is a feature branch or a protected branch
- the sanshain allows overrides on featurebranches. versions have snapshot
- the version on protected branches is GA and can not be modified without updating the version
- sanshain stores the full api along the splitted by endpoint apis

- consumers define the version they want per sanshain.yaml
- if no GA for that version exists tries the SNAPSHOT
- if both dont exist fails. no fallback

