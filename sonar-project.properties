# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-service
# Analysed by the sonar job of .github/workflows/ci.yml (paxel/gates sonar.yml) on pushes to
# summer and on pull requests; Automatic Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-service
sonar.projectName=Sanshain Service

# Everything in the repository is a source except the tests, as Automatic Analysis
# had it; sources and tests may not overlap, so tests/ is excluded from the sources.
sonar.sources=.
sonar.tests=tests

# Third-party bundles, built output and local leftovers.
sonar.exclusions=tests/**,\
  static/vendor/**,\
  static/css/app.css,\
  target/**,\
  build/**,\
  node_modules/**,\
  site-dist/**,\
  playwright-report/**,\
  test-results/**
sonar.sourceEncoding=UTF-8

# Left out of the duplication check only (still analysed for issues):
# - the SQLite and Postgres repositories: parallel on purpose, every method plain
#   SQL of its dialect, kept in step by the shared repository tests;
# - the migrations: each exists once per dialect, and an applied migration
#   cannot change (sqlx checks its checksum).
sonar.cpd.exclusions=src/infrastructure/sqlite_repository.rs,\
  src/infrastructure/postgres_repository.rs,\
  src/infrastructure/migrations/**

# Coverage: the CI jobs that measure upload their LCOV files, which the sonar job downloads
# into coverage/. Rust from the shared Rust gate (tarpaulin), the site build in scripts/ from
# the shared TypeScript gate (the site tests), the page scripts in static/js/ from the UI
# tests (tests/ui/coverage.js).
sonar.rust.lcov.reportPaths=coverage/rust.lcov
sonar.javascript.lcov.reportPaths=coverage/site.lcov,coverage/ui.lcov

# Findings that stay as they are stand in code-scanning-ignores.toml, each with its reason
# and a date; the sonar job and the release gate fail on every other open finding.
