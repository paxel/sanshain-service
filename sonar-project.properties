# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-service
# Analysed by .github/workflows/sonar.yml after Quality runs on summer; Automatic
# Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-service
sonar.projectName=Sanshain Service

# Everything in the repository is a source except the tests, as Automatic Analysis
# had it; sources and tests may not overlap, so tests/ is excluded from the sources.
sonar.sources=.
sonar.tests=tests

# Third-party bundles, built output and local leftovers.
sonar.exclusions=tests/**,\
  static/vendor/**,\
  static/css/app.css,\
  target/**,\
  build/**,\
  node_modules/**,\
  site-dist/**,\
  playwright-report/**,\
  test-results/**
sonar.sourceEncoding=UTF-8

# Clippy: the workflow writes this report with cargo clippy
# --message-format=json; the analyzer imports it as external issues.
sonar.rust.clippyReport.reportPaths=build/clippy-report.json

# Coverage: Quality's tarpaulin run writes lcov.info, which the workflow
# downloads into build/.
sonar.rust.lcov.reportPaths=build/lcov.info
