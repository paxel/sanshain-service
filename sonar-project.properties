# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-service
# Analysed by .github/workflows/sonar.yml after Quality runs on summer; Automatic
# Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-service
sonar.projectName=Sanshain Service

# Everything in the repository is a source except the tests, as Automatic Analysis
# had it; sources and tests may not overlap, so tests/ is excluded from the sources.
sonar.sources=.
sonar.tests=tests

# Third-party bundles, built output and local leftovers.
sonar.exclusions=tests/**,\
  static/vendor/**,\
  static/css/app.css,\
  target/**,\
  build/**,\
  node_modules/**,\
  site-dist/**,\
  playwright-report/**,\
  test-results/**
sonar.sourceEncoding=UTF-8

# Left out of the duplication check only (still analysed for issues):
# - the SQLite and Postgres repositories: parallel on purpose, every method plain
#   SQL of its dialect, kept in step by the shared repository tests;
# - the migrations: each exists once per dialect, and an applied migration
#   cannot change (sqlx checks its checksum).
sonar.cpd.exclusions=src/infrastructure/sqlite_repository.rs,\
  src/infrastructure/postgres_repository.rs,\
  src/infrastructure/migrations/**

# Clippy: the workflow writes this report with cargo clippy
# --message-format=json; the analyzer imports it as external issues.
sonar.rust.clippyReport.reportPaths=build/clippy-report.json

# Coverage: Quality's tarpaulin run writes lcov.info, which the workflow
# downloads into build/.
sonar.rust.lcov.reportPaths=build/lcov.info
# JavaScript: the UI tests' page-script coverage (tests/ui/coverage.js) and the
# site tests' coverage of scripts/, downloaded into build/ui/ and build/site/.
sonar.javascript.lcov.reportPaths=build/ui/lcov.info,build/site/site-lcov.info

# Findings that stay as they are, each with its reason. Patterns name single
# files, so a new file with the same finding is still reported.
sonar.issue.ignore.multicriteria=semver,pins,combined,nulls,token,csrf,picker,path,oracle,receiver,walkthrough

# Applied migrations: sqlx checks their checksums, so changing one breaks every
# database that already ran it. The whole-table UPDATEs are deliberate backfills.
sonar.issue.ignore.multicriteria.semver.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.semver.resourceKey=src/infrastructure/migrations/*/20240624000000_add_semver_to_spec_versions.sql
sonar.issue.ignore.multicriteria.pins.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.pins.resourceKey=src/infrastructure/migrations/postgres/20260810000000_denormalize_pin_participants.sql
sonar.issue.ignore.multicriteria.nulls.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.nulls.resourceKey=src/infrastructure/migrations/*/20240626000000_fix_audit_types.sql
# The combined schema dumps carry the same backfill.
sonar.issue.ignore.multicriteria.combined.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.combined.resourceKey=*_combined.sql

# The page scripts are classic scripts sharing globals declared in common.js and
# graph.js; these assignments set those globals, a declaration would shadow them.
sonar.issue.ignore.multicriteria.token.ruleKey=javascript:S2703
sonar.issue.ignore.multicriteria.token.resourceKey=static/js/pages/account.js
sonar.issue.ignore.multicriteria.csrf.ruleKey=javascript:S2703
sonar.issue.ignore.multicriteria.csrf.resourceKey=static/js/pages/dashboard.js
sonar.issue.ignore.multicriteria.picker.ruleKey=javascript:S2703
sonar.issue.ignore.multicriteria.picker.resourceKey=static/js/pages/graph-1.js

# The site build runs on a developer's machine or the Pages runner and calls the
# git and tar found on its PATH.
sonar.issue.ignore.multicriteria.path.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.path.resourceKey=scripts/build-site-all.js

# The local preview server resolves the path, then refuses anything outside the
# output directory before touching the file system.
sonar.issue.ignore.multicriteria.oracle.ruleKey=jssecurity:S6549
sonar.issue.ignore.multicriteria.oracle.resourceKey=scripts/build-site.js

# The http:// there is text being replaced in the recorded evidence, no request.
sonar.issue.ignore.multicriteria.receiver.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.receiver.resourceKey=scripts/record-walkthroughs.sh

# Throwaway accounts of the temporary instance the walkthrough recording starts;
# the recorded evidence in the docs shows them on purpose.
sonar.issue.ignore.multicriteria.walkthrough.ruleKey=secrets:S2068
sonar.issue.ignore.multicriteria.walkthrough.resourceKey=scripts/record-walkthroughs.sh
