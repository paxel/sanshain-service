format: 1
motivation: 'Sanshain sits between the build pipelines of many microservices: Build Tooling publishes specs and Backstage catalog files as Producer and fetches pinned endpoint snippets as Consumer, while people use the web dashboard to inspect versions and the dependency graph and AI clients ask the catalog over MCP. Human login can be delegated to LDAP/AD or an OIDC provider; machine clients always use API tokens, full or read-only. State lives in SQLite or PostgreSQL, a Backup Job pulls consistent snapshots, traces and metrics go to an optional observability stack, and every catalog fact is pushed as a signed event to the webhook receivers on the allow-list.'
