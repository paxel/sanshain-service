format: 1
motivation: 'Sanshain sits between the build pipelines of many microservices: Build Tooling publishes specs as Producer and fetches pinned endpoint snippets as Consumer, while people use the web dashboard to inspect versions and the dependency graph. Human login can be delegated to LDAP/AD or an OIDC provider; machine clients always use API tokens. State lives in SQLite or PostgreSQL; traces and metrics go to an optional observability stack.'
