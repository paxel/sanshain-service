        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/consumers/{name}/webhooks/{id}/deliveries:
    get:
      summary: "Read: consumers/name/webhooks/id/deliveries"
      description: |
        Requires the `manage_producers` permission, **or** maintainership of the Producer of the same name as the Consumer in the path (the "same system" rule).

        The newest deliveries of the hook (`limit`, default 50, at most 200): status, attempts, next attempt, last response code and error.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The delivery log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "404":
          description: No such hook in this scope.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/consumers/{name}/webhooks/{id}/deliveries/{delivery_id}/redeliver:
    post:
      summary: "Create or run: consumers/name/webhooks/id/deliveries/delivery_id/redeliver"
      description: |
        Requires the `manage_producers` permission, **or** maintainership of the Producer of the same name as the Consumer in the path (the "same system" rule).

        Reset one delivery to `pending`, due now, attempt count kept — one more attempt even for a dead delivery.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: delivery_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Reset; the delivery as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "404":
          description: No such delivery on this hook.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/settings/webhook-allowed-hosts:
    get:
      summary: "Read: settings/webhook-allowed-hosts"
      description: |
        Requires the `manage_settings` permission.

        The egress allow-list: host patterns a hook URL may point at.
      responses:
        "200":
          description: "The list, as `{\"hosts\": [...]}`."
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      summary: "Create or run: settings/webhook-allowed-hosts"
      description: |
        Requires the `manage_settings` permission.

        Replace the allow-list (`{"hosts": [...]}`). A pattern is a host name with `*`/`?` wildcards
        (`hooks.slack.com`, `*.webhook.office.com`); prefixed `http://` it also admits plain HTTP to that
        host (`http://n8n.corp.internal`). Ports are not matched. An empty list means only callers with
        `manage_settings` may register hooks. Evaluated at registration and again at every delivery.
      responses:
        "200":
          description: The list as stored (trimmed, lower-cased, de-duplicated).
        "400":
          description: A pattern is not a host pattern.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
