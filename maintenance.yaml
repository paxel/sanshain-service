components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    SystemContext:
      type: object
      description: |
        What a system's Backstage `catalog-info.yaml` says about it (#48),
        read from the Component named like the system: `spec.owner`,
        `metadata.description`, the `backstage.io/source-location`
        annotation and `metadata.links`. One per system, replaced on every
        catalog push; a field the file does not have is `null` or empty.
      required: [owner, description, source_location, links]
      properties:
        owner:
          type: object
          nullable: true
          description: The owner ref's kind (`group` unless the ref says otherwise) and name, lower-cased.
          required: [kind, name]
          properties:
            kind:
              type: string
            name:
              type: string
        description:
          type: string
          nullable: true
          description: Trimmed, at most 1000 characters (a longer one is cut with an ellipsis).
        source_location:
          type: string
          nullable: true
          description: The annotation without its `url:` prefix; only an `http` or `https` URL is kept.
        links:
          type: array
          description: At most 20; a link whose `url` is not `http` or `https` is dropped.
          items:
            type: object
            required: [url, title, type, icon]
            properties:
              url:
                type: string
              title:
                type: string
                description: The link's title, or the URL's host when it has none.
              type:
                type: string
                nullable: true
              icon:
                type: string
                nullable: true
    ParticipantContext:
      type: object
      required: [name, context]
      properties:
        name:
          type: string
        context:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SystemContext"
    WebhookScope:
      type: object
      description: Who a hook belongs to (#47).
      required: [kind]
      properties:
        kind:
          type: string
          enum: [global, producer, consumer]
        name:
          type: string
          description: The Producer or Consumer; absent for `global`.
    Webhook:
      type: object
      description: |
        A registered hook (#47). The signing secret is never part of it;
        `secret_hint` is the first 8 hex characters of the secret's SHA-256,
        to tell hooks apart.
      required: [id, scope, url, format, event_types, producer_glob, secret_hint, paused, allow_list_exempt, created_by, created_at]
      properties:
        id:
          type: integer
          format: int64
        scope:
          $ref: "#/components/schemas/WebhookScope"
        url:
          type: string
        format:
          type: string
          enum: [json, slack, teams]
        event_types:
          type: array
          description: The event types the hook receives; empty means every type.
          items:
            type: string
        producer_glob:
          type: string
          nullable: true
          description: Only events about Producers whose name matches (`*` and `?`); `null` means every Producer.
        secret_hint:
          type: string
        paused:
          type: boolean
        allow_list_exempt:
          type: boolean
          description: Registered by a caller with `manage_settings`; the allow-list does not apply.
        created_by:
          type: string
        created_at:
          type: string
    WebhookList:
      type: array
      items:
        $ref: "#/components/schemas/Webhook"
    WebhookCreate:
      type: object
      required: [url]
      properties:
        url:
          type: string
        format:
          type: string
          enum: [json, slack, teams]
          default: json
        event_types:
          type: array
          items:
            type: string
          description: Empty or absent means every type; `webhook.test` cannot be subscribed to.
        producer_glob:
          type: string
          nullable: true
    WebhookCreated:
      type: object
      required: [webhook, secret]
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
        secret:
          type: string
          description: The signing secret, shown this once (`whsec_` + 64 hex characters).
    WebhookDelivery:
      type: object
      description: One hook's delivery of one event — a delivery log row (#47).
      required: [id, hook_id, event_id, event_type, occurred_at, status, attempts, next_attempt_at, last_response_code, last_error, delivered_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        hook_id:
          type: integer
          format: int64
        event_id:
          type: string
        event_type:
          type: string
        occurred_at:
          type: string
        status:
          type: string
          enum: [pending, delivered, failed, dead]
        attempts:
          type: integer
        next_attempt_at:
          type: string
        last_response_code:
          type: integer
          nullable: true
        last_error:
          type: string
          nullable: true
        delivered_at:
          type: string
          nullable: true
        updated_at:
          type: string
    WebhookDeliveryList:
      type: array
      items:
        $ref: "#/components/schemas/WebhookDelivery"
    ErrorBody:
      type: object
      description: |
        The body every error response carries. Identical to the schema of the
        same name in `api.yaml`.
      required:
        - error
      properties:
        error:
          type: string
        proposed_version:
          type: string
