    post:
      summary: "Create or run: consumers/name/webhooks/id/rotate-secret"
      description: |
        Requires the `manage_producers` permission, **or** maintainership of the Producer of the same name as the Consumer in the path (the "same system" rule).

        A fresh secret, shown once; deliveries from now on are signed with it.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The hook and its new secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookCreated"
        "404":
          description: No such hook in this scope.
        "401":
