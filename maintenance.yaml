        Any signed-in caller.

        Blame for one version of a line: the version's text (the stored document, or with
        `path` and `method` one endpoint's snippet) as a JSON array of blocks of consecutive
        lines last changed in the same version, oldest version first walked with the same
        `similar` diff as `/diff`. Each block is `{version, stability, provided_by, updated_at,
        start_line, lines}`; `start_line` is 1-based. A version with identical content (a
        promotion) changes no line; in endpoint mode a version without the endpoint is an empty
        text. An empty array means the version's text is empty.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: api_type
          in: query
          required: false
          schema:
            type: string
