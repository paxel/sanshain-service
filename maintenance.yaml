      summary: "Read: consumers/name/webhooks"
      description: |
        Requires the `manage_producers` permission, **or** maintainership of the Producer of the same name as the Consumer in the path (the "same system" rule).

        The hooks of this scope, newest last, without their secrets (`secret_hint` is a prefix of the secret's SHA-256).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The hooks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      summary: "Create or run: consumers/name/webhooks"
      description: |
        Requires the `manage_producers` permission, **or** maintainership of the Producer of the same name as the Consumer in the path (the "same system" rule).

        Register a hook (`WebhookCreate`). The URL must be `https://`, or `http://` to a host the allow-list
        names with `http://`; callers without `manage_settings` are refused outside the allow-list (and with an
        empty allow-list), callers with it are exempt for good. The answer carries the signing secret **once**.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Registered; the secret is shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookCreated"
        "400":
          description: Not a valid hook (URL, format, event type or glob).
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/consumers/{name}/webhooks/{id}:
    get:
      summary: "Read: consumers/name/webhooks/id"
      description: |
        Requires the `manage_producers` permission, **or** maintainership of the Producer of the same name as the Consumer in the path (the "same system" rule).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The hook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "404":
          description: No such hook in this scope.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      summary: "Update: consumers/name/webhooks/id"
      description: |
        Requires the `manage_producers` permission, **or** maintainership of the Producer of the same name as the Consumer in the path (the "same system" rule).

        Pause or resume (`paused`), replace the event-type filter (`event_types`, `[]` = every type) or the Producer glob (`producer_glob`, `null` clears it). Fields left out stay as they are.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The hook after the patch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "404":
          description: No such hook in this scope.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: "Delete: consumers/name/webhooks/id"
      description: |
        Requires the `manage_producers` permission, **or** maintainership of the Producer of the same name as the Consumer in the path (the "same system" rule).

        Deletes the hook and its delivery log.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted.
        "404":
          description: No such hook in this scope.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/consumers/{name}/webhooks/{id}/test:
    post:
      summary: "Create or run: consumers/name/webhooks/id/test"
      description: |
        Requires the `manage_producers` permission, **or** maintainership of the Producer of the same name as the Consumer in the path (the "same system" rule).

        Queue a `webhook.test` event for this hook alone; the worker delivers it like any other event, so the delivery log shows whether the receiver, the secret and the allow-list are in order.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Queued; `event_id` names the event the delivery log will show.
        "404":
          description: No such hook in this scope.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
