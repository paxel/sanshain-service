        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    ErrorBody:
      type: object
      description: |
        The body every error response carries. Identical to the schema of the
        same name in `api.yaml`.
      required:
        - error
      properties:
        error:
          type: string
        proposed_version:
          type: string
