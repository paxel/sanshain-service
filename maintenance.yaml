openapi: "3.0.3"
info:
  title: Sanshain Maintenance API
  description: |
    The administrative surface of Sanshain: users, roles, groups, maintainers,
    Producer and Consumer administration, version deletion, settings and
    observability.

    Kept separate from `api.yaml` deliberately. That file is the contract build
    plugins and CLIs are written against and must stay stable; this one changes
    whenever the admin interface does. One document would imply one stability
    promise for both.

    **Authorisation.** Every endpoint states what it requires. `Any signed-in
    caller` marks the read-only listings the dashboard needs before it knows who
    is looking; everything else names a permission. Producer-scoped endpoints
    additionally admit a maintainer of the Producer named in the path. An account
    listed in `SANSHAIN_ROOT_USERS` holds every permission.

    See [Administration](docs/administration.md) for the concepts.
  version: "2.2.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt

servers:
  - url: http://localhost:3000
    description: Local development

security:
  - bearerAuth: []

paths:
  /admin/auth-config:
    get:
      summary: "Read: auth-config"
      description: |
        Requires the `manage_auth_config` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    put:
      summary: "Replace: auth-config"
      description: |
        Requires the `manage_auth_config` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/auth-config/test:
    post:
      summary: "Create or run: auth-config/test"
      description: |
        Requires the `manage_auth_config` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/branches/{name}/timeline:
    get:
      summary: "Read: branches/name/timeline"
      description: |
        The instants this branch's graph changed (every open/close event of
        its append-only pin store), distinct and ascending — the timeline
        slider's markers (ADR-0005).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The change instants as a JSON array of RFC 3339 strings.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No sanshain-branch with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/trunk/graph:
    get:
      summary: "Read: trunk/graph"
      description: |
        The main graph's pin set — current, or as it was at the optional `at`
        instant, reconstructed from the append-only trunk history (ADR-0005).
        Pins on deleted versions are marked dangling; a non-RFC-3339 `at`
        answers `400`.
      parameters:
        - name: at
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The pin set as a JSON array.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/trunk/timeline:
    get:
      summary: "Read: trunk/timeline"
      description: |
        The instants the main graph changed, distinct and ascending — the
        timeline slider's markers (ADR-0005).
      responses:
        "200":
          description: The change instants as a JSON array of RFC 3339 strings.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/cache/clear:
    post:
      summary: "Create or run: cache/clear"
      description: |
        Requires the `manage_settings` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/cleanup/dependencies:
    post:
      summary: "Create or run: cleanup/dependencies"
      description: |
        Requires the `manage_settings` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/cleanup/trunk:
    post:
      summary: "Create or run: cleanup/trunk"
      description: |
        Requires the `manage_settings` permission.

        Runs the trunk TTL cleanup immediately (ADR-0004): open trunk pins not
        re-required within `trunk_max_age_days` are *closed* (they leave the
        main graph's current view; the rows stay as timeline history) and
        stale trunk version markers are cleared. Answers `{"closed": n}`.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/cleanup/snapshots:
    post:
      summary: "Create or run: cleanup/snapshots"
      description: |
        Requires the `manage_settings` permission.

        Runs the use-based snapshot expiry immediately: snapshots neither provided nor required within `snapshot_max_age_days` are deleted. GA versions are never age-culled.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/consumers:
    get:
      summary: "Read: consumers"
      description: |
        Any signed-in caller.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/consumers/{name}:
    delete:
      summary: "Delete: consumers/name"
      description: |
        Requires the `manage_consumers` permission.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/consumers/{name}/endpoints:
    get:
      summary: "Read: consumers/name/endpoints"
      description: |
        Any signed-in caller.

        Every endpoint the Consumer is recorded as depending on, with the pinned version and its current stability.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/endpoint-versions:
    get:
      summary: "Read: endpoint-versions"
      description: |
        Any signed-in caller.

        The blame trail of one endpoint: which versions of the line changed it, with the Author attribution recorded on each Provide.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/endpoint-yaml:
    get:
      summary: "Read: endpoint-yaml"
      description: |
        Any signed-in caller.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/groups:
    get:
      summary: "Read: groups"
      description: |
        Requires the `manage_roles` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      summary: "Create or run: groups"
      description: |
        Requires the `manage_roles` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/groups/{id}:
    put:
      summary: "Replace: groups/id"
      description: |
        Requires the `manage_roles` permission. Adding an admin-guarded role
        (`admin`, `releaser`) to the group's role set — or removing one it
        holds — additionally requires the caller to be an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: "Delete: groups/id"
      description: |
        Requires the `manage_roles` permission. Deleting a group that holds an
        admin-guarded role (`admin`, `releaser`) strips that role from every
        member at once, so it additionally requires the caller to be an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/groups/{id}/members:
    post:
      summary: "Create or run: groups/id/members"
      description: |
        Requires the `manage_roles` permission. Membership of a group that
        holds an admin-guarded role (`admin`, `releaser`) IS a grant of that
        role, so adding a member then additionally requires the caller to be
        an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/groups/{id}/members/{user_id}:
    delete:
      summary: "Delete: groups/id/members/user_id"
      description: |
        Requires the `manage_roles` permission. Removing a member from a group
        that holds an admin-guarded role (`admin`, `releaser`) strips that
        role, so it additionally requires the caller to be an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/maintainers:
    get:
      summary: "Read: maintainers"
      description: |
        Requires the `manage_roles` permission.

        Every Producer with its maintainer user and group ids, in one response — the aggregate behind the dashboard's Maintainers section, so it does not ask per Producer.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/nuke/consumers:
    post:
      summary: "Create or run: nuke/consumers"
      description: |
        Requires the `run_destructive_operations` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/nuke/database:
    post:
      summary: "Create or run: nuke/database"
      description: |
        Requires the `run_destructive_operations` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/nuke/producers:
    post:
      summary: "Create or run: nuke/producers"
      description: |
        Requires the `run_destructive_operations` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/nuke/users:
    post:
      summary: "Create or run: nuke/users"
      description: |
        Deletes every user who is not an effective administrator — users with a
        direct `admin` role, `admin` via group membership, or a configured root
        username survive. Requires the `run_destructive_operations` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/audit-logs:
    get:
      summary: "Read: observability/audit-logs"
      description: |
        Requires the `view_audit` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/audit-logs/export:
    get:
      summary: "Read: observability/audit-logs/export"
      description: |
        Requires the `view_audit` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/debug-config:
    get:
      summary: "Read: observability/debug-config"
      description: |
        Any signed-in caller.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/debug-config-update:
    post:
      summary: "Create or run: observability/debug-config-update"
      description: |
        Requires the `manage_settings` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/logs:
    get:
      summary: "Read: observability/logs"
      description: |
        Any signed-in caller.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/stats:
    get:
      summary: "Read: observability/stats"
      description: |
        Any signed-in caller.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/graph/diff:
    get:
      summary: "Read: graph/diff"
      description: |
        Structured diff between two graph selections (ADR-0005) — release vs
        release, release vs main, one graph at two instants. `left`/`right`
        are `main[@rfc3339]` or `<branch>[@rfc3339]`. Answers services
        added/removed, pins added/removed, and per-pin version changes; all
        arrays empty means no differences.
      parameters:
        - name: left
          in: query
          required: true
          schema:
            type: string
        - name: right
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The structured diff.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: A named branch does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/producers:
    get:
      summary: "Read: producers"
      description: |
        Any signed-in caller.

        Every Producer with metadata and its full version lines (version, stability, endpoint count, snapshot expiry).
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/producers/metadata:
    post:
      summary: "Create or run: producers/metadata"
      description: |
        Requires the `manage_producers` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/producers/{name}:
    delete:
      summary: "Delete: producers/name"
      description: |
        Requires the `manage_producers` permission, **or** maintainership of the Producer named in the path.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/producers/{name}/branch-memberships:
    get:
      summary: "Read: producers/name/branch-memberships"
      description: |
        Reverse lookup (ADR-0005): every (api_type, version, branch) this
        producer is currently referenced by across all sanshain-branches —
        "which releases pin b@1.0.0?" answered where you're already looking.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The memberships as a JSON array.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Producer not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/producers/{name}/diff:
    get:
      summary: "Read: producers/name/diff"
      description: |
        Any signed-in caller.

        Unified diff between two versions of a line (`api_type`, `from`, `to` query parameters).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/branches:
    get:
      summary: "Read: branches"
      description: |
        Every sanshain-branch (ADR-0005), newest first: `id`, `name`,
        `created_at`, `created_by`, `source` (`trunk` or the source branch's
        then-current name) and `as_of` (the instant of the source graph the
        branch was born from).
      responses:
        "200":
          description: The branch listing as a JSON array.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      summary: "Write: branches"
      description: |
        Requires the `release_ga` permission (the `releaser` role; admins and
        root hold it implicitly) — creating a named release graph is release
        work, and this endpoint's primary caller is the **DevOps release-cut
        script**, which needs nothing beyond this description:

        Creates a **sanshain-branch**: a named copy of a source graph at a
        chosen instant, from then on updated by `tag`-flagged hotfix builds.

        Body (JSON):
        - `name` (string, required): unique among existing branches; free
          text ("Release Maribou"). Duplicate → `409`.
        - `source` (string, optional): the name of an existing branch to copy
          from. **Omitted → the trunk graph.** Unknown name → `404`, nothing
          is created.
        - `as_of` (string, optional): RFC 3339 instant of the source graph to
          copy. **Omitted → now.** A past instant creates the branch
          *retroactively* — trunk-at-that-date is reconstructed from the
          append-only history, so a forgotten release day is repairable.
          Malformed → `400`.

        The call is not idempotent: repeating it answers `409`. Creation is
        audited (`BRANCH_CREATED`, naming the caller, source and instant).
      responses:
        "201":
          description: Created. The body is the branch record (see GET).
        "400":
          description: >-
            Empty or reserved name (`main`, `dev`), or `as_of` is not an
            RFC 3339 instant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without the `release_ga` permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: The `source` branch does not exist. Nothing was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: A branch with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/branches/{name}:
    put:
      summary: "Write: branches/name"
      description: |
        Requires the `manage_producers` permission (admins) — deliberately a
        higher bar than creation. Renames the branch: identity is the internal
        id, so membership, timeline and audit stamps survive; a pipeline still
        sending the old tag name gets the instructive `404` until its
        configuration is updated (intended for a name wrong enough to rename).
        Body: `{"new_name": "..."}`. Audited with old and new name.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Renamed; the body is the updated branch record.
        "400":
          description: Empty new name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No sanshain-branch with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The new name is already taken by a live branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: "Write: branches/name"
      description: |
        Requires the `manage_producers` permission (admins). Deletes the
        branch and its graph rows — the deliberate, audited EOL act — and
        frees the name for reuse.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No sanshain-branch with this name.
