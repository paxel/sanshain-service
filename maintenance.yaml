openapi: "3.0.3"
info:
  title: Sanshain Maintenance API
  description: |
    The administrative surface of Sanshain: users, roles, groups, maintainers,
    Producer and Consumer administration, version deletion, settings and
    observability.

    Kept separate from `api.yaml` deliberately. That file is the contract build
    plugins and CLIs are written against and must stay stable; this one changes
    whenever the admin interface does. One document would imply one stability
    promise for both.

    **Authorisation.** Every endpoint states what it requires. `Any signed-in
    caller` marks the read-only listings the dashboard needs before it knows who
    is looking; everything else names a permission. Producer-scoped endpoints
    additionally admit a maintainer of the Producer named in the path. An account
    listed in `SANSHAIN_ROOT_USERS` holds every permission.

    See [Administration](docs/administration.md) for the concepts.
  version: "2.6.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt

servers:
  - url: http://localhost:3000
    description: Local development

security:
  - bearerAuth: []

paths:
  /admin/auth-config:
    get:
      summary: "Read: auth-config"
      description: |
        Requires the `manage_auth_config` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    put:
      summary: "Replace: auth-config"
      description: |
        Requires the `manage_auth_config` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/auth-config/test:
    post:
      summary: "Create or run: auth-config/test"
      description: |
        Requires the `manage_auth_config` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/backup/sqlite:
    get:
      summary: "Read: backup/sqlite"
      description: |
        Requires the `run_destructive_operations` permission. A consistent
        snapshot of the SQLite database, produced by `VACUUM INTO` while
        Sanshain runs, streamed as `application/vnd.sqlite3` with a
        `Content-Disposition` filename `sanshain-<instance version>-<UTC
        timestamp>.db`. Only one snapshot runs at a time. Meant for the
        scheduled backup: a `full` API token of an account holding the
        permission is accepted beside a session, a `read_only` token is
        refused with `403`. See the deployment guide, Backup and restore.
      responses:
        "200":
          description: The database snapshot.
          content:
            application/vnd.sqlite3:
              schema:
                type: string
                format: binary
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: |
            A snapshot is already being produced, or this instance runs
            PostgreSQL — the message names `pg_dump`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/branches/{name}/timeline:
    get:
      summary: "Read: branches/name/timeline"
      description: |
        The instants this branch's graph changed (every open/close event of
        its append-only pin store), distinct and ascending — the timeline
        slider's markers (ADR-0005).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The change instants as a JSON array of RFC 3339 strings.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No sanshain-branch with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/trunk/graph:
    get:
      summary: "Read: trunk/graph"
      description: |
        The main graph's pin set — current, or as it was at the optional `at`
        instant, reconstructed from the append-only trunk history (ADR-0005).
        Pins on deleted versions are marked dangling; a non-RFC-3339 `at`
        answers `400`.
      parameters:
        - name: at
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The pin set as a JSON array.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/trunk/timeline:
    get:
      summary: "Read: trunk/timeline"
      description: |
        The instants the main graph changed, distinct and ascending — the
        timeline slider's markers (ADR-0005).
      responses:
        "200":
          description: The change instants as a JSON array of RFC 3339 strings.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/cache/clear:
    post:
      summary: "Create or run: cache/clear"
      description: |
        Requires the `manage_settings` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/cleanup/dependencies:
    post:
      summary: "Create or run: cleanup/dependencies"
      description: |
        Requires the `manage_settings` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/cleanup/trunk:
    post:
      summary: "Create or run: cleanup/trunk"
      description: |
        Requires the `manage_settings` permission.

        Runs the trunk TTL cleanup immediately (ADR-0004): open trunk pins not
        re-required within `trunk_max_age_days` are *closed* (they leave the
        main graph's current view; the rows stay as timeline history) and
        stale trunk version markers are cleared. Answers `{"closed": n}`.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/cleanup/snapshots:
    post:
      summary: "Create or run: cleanup/snapshots"
      description: |
        Requires the `manage_settings` permission.

        Runs the use-based snapshot expiry immediately: snapshots neither provided nor required within `snapshot_max_age_days` are deleted. GA versions are never age-culled.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/consumers:
    get:
      summary: "Read: consumers"
      description: |
        Any signed-in caller.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/consumers/{name}:
    get:
      summary: "Read: consumers/name"
      description: |
        Any signed-in caller.

        The Consumer's context (#48): what its Backstage `catalog-info.yaml`
        says about it — owner, description, source location and links.
        `context` is `null` until a catalog push described the system.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Consumer's name and context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantContext"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such Consumer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: "Delete: consumers/name"
      description: |
        Requires the `manage_consumers` permission.

        Answers `{"deleted": name}`. Refused with `409` while any
        sanshain-branch's recorded graph still references the Consumer — a
        release cut is a frozen record, and the delete would remove its edges
        retroactively. The message names the branches to retire first. Trunk
        presence does not block.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/consumers/{name}/endpoints:
    get:
      summary: "Read: consumers/name/endpoints"
      description: |
        Any signed-in caller.

        Every endpoint the Consumer is recorded as depending on, with the pinned version and its current stability.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/endpoint-versions:
    get:
      summary: "Read: endpoint-versions"
      description: |
        Any signed-in caller.

        The blame trail of one endpoint: which versions of the line changed it, with the Author attribution recorded on each Provide.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/endpoint-yaml:
    get:
      summary: "Read: endpoint-yaml"
      description: |
        Any signed-in caller.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/groups:
    get:
      summary: "Read: groups"
      description: |
        Requires the `manage_roles` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      summary: "Create or run: groups"
      description: |
        Requires the `manage_roles` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/groups/{id}:
    put:
      summary: "Replace: groups/id"
      description: |
        Requires the `manage_roles` permission. Adding an admin-guarded role
        (`admin`, `releaser`) to the group's role set — or removing one it
        holds — additionally requires the caller to be an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: "Delete: groups/id"
      description: |
        Requires the `manage_roles` permission. Deleting a group that holds an
        admin-guarded role (`admin`, `releaser`) strips that role from every
        member at once, so it additionally requires the caller to be an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/groups/{id}/members:
    post:
      summary: "Create or run: groups/id/members"
      description: |
        Requires the `manage_roles` permission. Membership of a group that
        holds an admin-guarded role (`admin`, `releaser`) IS a grant of that
        role, so adding a member then additionally requires the caller to be
        an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/groups/{id}/members/{user_id}:
    delete:
      summary: "Delete: groups/id/members/user_id"
      description: |
        Requires the `manage_roles` permission. Removing a member from a group
        that holds an admin-guarded role (`admin`, `releaser`) strips that
        role, so it additionally requires the caller to be an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/maintainers:
    get:
      summary: "Read: maintainers"
      description: |
        Requires the `manage_roles` permission.

        Every Producer with its maintainer user and group ids, in one response — the aggregate behind the dashboard's Maintainers section, so it does not ask per Producer.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/nuke/consumers:
    post:
      summary: "Create or run: nuke/consumers"
      description: |
        Requires the `run_destructive_operations` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/nuke/database:
    post:
      summary: "Create or run: nuke/database"
      description: |
        Requires the `run_destructive_operations` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/nuke/producers:
    post:
      summary: "Create or run: nuke/producers"
      description: |
        Requires the `run_destructive_operations` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/nuke/users:
    post:
      summary: "Create or run: nuke/users"
      description: |
        Deletes every user who is not an effective administrator — users with a
        direct `admin` role, `admin` via group membership, or a configured root
        username survive. Requires the `run_destructive_operations` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/audit-logs:
    get:
      summary: "Read: observability/audit-logs"
      description: |
        Requires the `view_audit` permission. The most recent audit entries for
        the observability panel; optional `limit` (default 100, capped at 200).
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/audit-logs/export:
    get:
      summary: "Read: observability/audit-logs/export"
      description: |
        Requires the `view_audit` permission. CSV of the most recent audit
        entries, columns `id,timestamp,username,action,details,service,version,
        action_type,stream` — every field except the bulky `diff` blob.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/debug-config:
    get:
      summary: "Read: observability/debug-config"
      description: |
        Any signed-in caller.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/debug-config-update:
    post:
      summary: "Create or run: observability/debug-config-update"
      description: |
        Requires the `manage_settings` permission.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/logs:
    get:
      summary: "Read: observability/logs"
      description: |
        Any signed-in caller.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/observability/stats:
    get:
      summary: "Read: observability/stats"
      description: |
        Any signed-in caller.
      responses:
        "200":
          description: Success.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/graph/diff:
    get:
      summary: "Read: graph/diff"
      description: |
        Structured diff between two graph selections (ADR-0005) — release vs
        release, release vs main, one graph at two instants. `left`/`right`
        are `main[@rfc3339]` or `<branch>[@rfc3339]`. Answers services
        added/removed, pins added/removed, per-pin version changes, and
        periphery edges (system → Peripheral Resource) added/removed; all
        arrays empty means no differences.
      parameters:
        - name: left
          in: query
          required: true
          schema:
            type: string
        - name: right
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The structured diff.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: A named branch does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/periphery:
    get:
      summary: "Read: periphery"
      description: |
        Any signed-in caller.

        The edges from systems to their Peripheral Resources (#46) — what
        their Backstage `catalog-info.yaml` lists under `dependsOn` — for one
        graph scope: `dev` (the default), `main[@rfc3339]` or
        `<branch>[@rfc3339]`, the selector grammar of `/admin/graph/diff`. A
        past instant answers the periphery as it was then.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A JSON array of `{system, resource}` edges, sorted.
        "400":
          description: A selector instant that is not RFC 3339, or `dev@…`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: A named branch does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/graph/scope:
    get:
      summary: "Read: graph scope"
      description: |
        Any signed-in caller.

        What the dependency graph needs of one scope beyond its pins, for
        `dev` (the default), `main[@rfc3339]` or `<branch>[@rfc3339]` — the
        selector grammar of `/admin/graph/diff`:

        - `producers`: the producers in the scope at its instant, each with
          one version line per API type. dev: every producer with any version
          (its newest per line). main: trunk's member versions — every
          trunk-flagged provide records the version it provided, closed again
          by the trunk TTL, a retire, or a version/producer delete. A branch:
          its member versions (tag-flagged provides) and, for lines without
          one, the highest version its pins name. `stability` is `null` when
          the version was deleted since; `last_provided_at` is the latest
          provide known at the instant (`null` when none is known).
        - `harvested_subscriptions`: dev all, live main the trunk-flagged
          ones, everything else none (there is no harvested timeline).
        - `systems`: the context (#48) of every system that pushed one, by
          name — owner, description, source location and links from its
          Backstage `catalog-info.yaml` — so the node panel needs no extra
          request. A present-day fact, the same in every scope.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The scope's producers, harvested subscriptions and system contexts.
          content:
            application/json:
              schema:
                type: object
                required: [producers, harvested_subscriptions, systems]
                properties:
                  producers:
                    type: array
                    items:
                      type: object
                      required: [name, versions]
                      properties:
                        name:
                          type: string
                        versions:
                          type: array
                          items:
                            type: object
                            required: [api_type, version, stability, last_provided_at]
                            properties:
                              api_type:
                                type: string
                                enum: [openapi, asyncapi, proto]
                              version:
                                type: string
                              stability:
                                type: string
                                nullable: true
                                enum: [snapshot, ga]
                              last_provided_at:
                                type: string
                                nullable: true
                  harvested_subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        client:
                          type: string
                        channel:
                          type: string
                        message_name:
                          type: string
                        owner:
                          type: string
                          nullable: true
                        trunk:
                          type: boolean
                  systems:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/SystemContext"
        "400":
          description: A selector instant that is not RFC 3339, or `dev@…`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: A named branch does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
