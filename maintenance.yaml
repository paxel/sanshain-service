          description: Blame this endpoint's snippet instead of the document; needs `method`.
          schema:
            type: string
        - name: method
          in: query
          required: false
          description: The endpoint's method (or RPC/operation); needs `path`.
          schema:
            type: string
      responses:
        "200":
          description: The blame blocks.
        "400":
          description: Only one of `path`/`method`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Signed in, but without what this endpoint requires.
