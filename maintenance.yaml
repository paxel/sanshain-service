              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/branches/{name}/graph:
    get:
      summary: "Read: branches/name/graph"
      description: |
        The branch's pin set — its graph edges, each `{client, service,
        api_type, version, path, method, valid_from, last_required_at}` with
        the version **by value** (a deleted spec version renders as a dangling
        reference and heals when the number is re-provided). Optional `at`
        (RFC 3339) answers the branch's graph as it was at that instant; a
        non-RFC-3339 `at` answers `400`.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: at
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The pin set as a JSON array.
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
