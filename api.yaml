openapi: "3.0.3"
info:
  title: Sanshain API
  description: |
    API contract for tooling that talks to Sanshain (build plugins, CLIs).
    A **Producer** provides its complete specification under a producer-declared
    **version**; a **Consumer** pins an exact version and requires only the
    endpoint snippets it uses. Covers providing specifications (OpenAPI,
    AsyncAPI, gRPC/Proto) and requiring endpoint snippets. See CONTEXT.md for
    the vocabulary and docs/adr/0003-versions-replace-branches.md for the model.

    **The version lives in the spec file.** For OpenAPI and AsyncAPI it is read
    from `info.version`; for proto from a mandatory
    `// sanshain-version: MAJOR.MINOR.PATCH` comment. Accepted spellings are
    `MAJOR[.MINOR[.PATCH]]` with an optional leading `v` — omitted parts are
    zero (`v2` → `2.0.0`) and the stored/answered form is always the full
    three-part version. No `-SNAPSHOT` or other suffixes.

    **Stability** is declared on every Provide: `snapshot` (overwritable
    work-in-progress, expires when unused) or `ga` (immutable; the number is
    permanently claimed). Resolution prefers GA, falls back only to the
    same-numbered snapshot, and otherwise fails immediately — no fallback, no
    long-polling.

    **2.0 is a clean break** of the 1.x branch-based contract: `branch`,
    `base_version`, `force`, `timeout`, `source_protected_branch` and
    `pull_from_branch` are no longer accepted anywhere and are rejected as
    unknown fields.

    **Only the canonical names** `producername` and `consumername` are
    accepted; the 1.x aliases `servicename` and `clientname` are rejected as
    unknown fields like every other branch-era leftover.
  version: "2.10.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /provide:
    post:
      operationId: provideSpec
      summary: Provide an OpenAPI specification under its declared version
      x-auth: session-or-api-token-full
      security:
        - bearerToken: []
      description: |
        Parses the provided OpenAPI YAML, reads the version from `info.version`,
        splits the document into individual endpoint snippets, and stores the
        full document and the snippets as one version-line entry for the
        Producer.

        **Releasing is a role**: `stability: ga` — a fresh GA, a promotion,
        or even an idempotent GA re-provide — requires the `release_ga`
        permission (the `releaser` role; admins and root hold it implicitly)
        and is otherwise refused 403. Snapshots need only authentication.

        **Idempotency**: re-providing byte-identical content is a no-op —
        CI re-runs of the same commit never fight. `changes` reports all zero.
        The GA gate still applies first: for `stability: ga` the caller must
        hold `release_ga` even when the re-provide would change nothing.

        **Snapshots** are overwritable by their provider: a snapshot Provide
        for an existing snapshot version replaces it wholesale when it comes
        from the user who last provided it (the audit trail still names
        every overwrite). Different content from anyone else is rejected 409
        (`snapshot_owned`) naming the provider and proposing the next free
        minor, so two developers who picked the same number cannot break each
        other's Consumer builds; CI rebuilding what its developer provided
        sends identical bytes and stays a no-op. An administrator deletes the
        snapshot to free the number.

        **GA is immutable**: a Provide for an existing GA version with
        different content is rejected 409 with `proposed_version` — the next
        free number, bumped by what actually changed (breaking → major,
        additive → minor, shape-identical → patch). A GA Provide for a version
        that exists as a snapshot **promotes** it in place. A snapshot Provide
        for a version that has gone GA is rejected — a released number can
        never carry a snapshot again.

        **Semver honesty**: a GA Provide whose changes relative to the highest
        GA below it are breaking without a major bump is rejected 409 with the
        correct `proposed_version`. Snapshots are never compatibility-checked.
      requestBody:
        required: true
        content:
          application/json:
            example:
              "producername": "payments"
              "stability": "snapshot"
              "openapi_yaml": "openapi: 3.0.3\ninfo:\n  title: Payments\n  version: 1.0.0\npaths:\n  /payments:\n    post:\n      summary: Create a payment\n      responses:\n        '201':\n          description: Created\n"
              "trunk": true
            schema:
              $ref: "#/components/schemas/ProvidePayload"
      responses:
        "202":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: |
            Specification accepted and stored — or, for `retired: true`, the
            family retired. The two answer different objects; a caller knows
            which it sent.
          content:
            application/json:
              example:
                "version": "1.0.0"
                "stability": "snapshot"
                "content_hash": "sha256:c79fec9c98fc8f883b24e080ef5f3a19644c5200c82362f06122186585d4574b"
                "changes":
                  "inserts": 2
                  "updates": 0
                  "deletes": 0
                "promoted": false
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProvideResponse"
                  - $ref: "#/components/schemas/RetiredProtocolResponse"
        "400":
          description: |
            Invalid request — malformed spec YAML, a missing/non-semver
            `info.version`, or two paths that are the same endpoint after
            normalization (differing only in a path-parameter name, a trailing
            slash, or doubled separators).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: |
            Request body has the wrong shape — missing `stability`, or unknown
            (1.x) fields such as `branch`, `base_version` or `force`, which are
            rejected by name rather than silently ignored.
        "403":
          description: |
            `stability: ga` without the `release_ga` permission. Releasing is
            a role: grant `releaser` to the publishing user or token (admins
            and root always may), or publish as a snapshot.

            Also `retired: true` without the `release_ga` permission and
            without a maintainer grant on this Producer. Retiring is a role for
            the same reason releasing is — see `ProvidePayload.retired`.

            Also any request with a `read_only` API token — see the
            `ReadOnlyToken` response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: |
            Rejected by the version rules. The body carries `proposed_version`,
            the next free version to publish as instead. Every rejection is
            self-service — fix the version and republish.
          content:
            application/json:
              example:
                "error": "version 1.0.0 of openapi 'payments' is GA and immutable, but the submitted content differs — did you forget to increment info's version? Publish as 1.1.0 instead"
                "proposed_version": "1.1.0"
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: Request body exceeds the configured size limit (`MAX_SPEC_BODY_BYTES`, default 4 MiB).

  /provide/asyncapi:
    post:
      operationId: provideAsyncApi
      summary: Provide an AsyncAPI specification under its declared version
      x-auth: session-or-api-token-full
      security:
        - bearerToken: []
      description: |
        Same rules as `/provide`, for AsyncAPI 2.x/3.x documents (version
        auto-detected). The version is read from `info.version`. Only PUB
        (publish/send) operations are stored; SUB channels belong in a
        Consumer's requires. On **GA** provides, message-level channel
        contracts are reconciled: the first Producer to publish a named PUB
        message owns its payload schema; a different Producer may co-publish
        only an identical schema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvideAsyncApiPayload"
      responses:
        "202":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: |
            Specification accepted and stored — or, for `retired: true`, the
            family retired. The two answer different objects; a caller knows
            which it sent.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProvideResponse"
                  - $ref: "#/components/schemas/RetiredProtocolResponse"
        "400":
          description: Invalid request (e.g. malformed YAML, bad version).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |
            `stability: ga` without the `release_ga` permission, or
            `retired: true` without it and without a maintainer grant on this
            Producer (see `/provide`), or a `read_only` API token (see the
            `ReadOnlyToken` response).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: |
            Rejected by the version rules (see `/provide`), or by a channel
            message contract owned by another Producer with a different schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: Request body exceeds the configured size limit (`MAX_SPEC_BODY_BYTES`, default 4 MiB).

  /provide/grpc:
    post:
      operationId: provideGrpc
      summary: Provide a .proto file under its declared version
      x-auth: session-or-api-token-full
      security:
        - bearerToken: []
      description: |
        Same rules as `/provide`, for proto files. Proto has no standard
        version slot, so the file must carry exactly one
        `// sanshain-version: MAJOR.MINOR.PATCH` comment (conventionally in the
        header); a missing, malformed or conflicting marker rejects the
        Provide. The marker travels into the split files Consumers download.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvideProtoPayload"
      responses:
        "202":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: |
            Specification accepted and stored — or, for `retired: true`, the
            family retired. The two answer different objects; a caller knows
            which it sent.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProvideResponse"
                  - $ref: "#/components/schemas/RetiredProtocolResponse"
        "400":
          description: Invalid request (e.g. missing sanshain-version marker).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |
            `stability: ga` without the `release_ga` permission, or
            `retired: true` without it and without a maintainer grant on this
            Producer (see `/provide`), or a `read_only` API token (see the
            `ReadOnlyToken` response).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Rejected by the version rules (see `/provide`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: Request body exceeds the configured size limit (`MAX_SPEC_BODY_BYTES`, default 4 MiB).

  /require:
    get:
      operationId: requireEndpoint
      summary: Retrieve an endpoint snippet at a pinned version
      x-auth: session-or-api-token-full
      security:
        - bearerToken: []
      description: |
        Resolves one endpoint of the Producer's line at exactly the pinned
        version: GA preferred, else the same-numbered snapshot, else an
        immediate `404`. There is no fallback to any other version and nothing
        waits — a missing pinned version is a configuration error.

        A successful require records the dependency (this is what the graph
        shows) and counts as *use* for snapshot expiry. A failed require
        records nothing — resolution never creates graph entities.

        Responses carry `X-Sanshain-Resolution` (`served`),
        `X-Sanshain-Version` (the Pin) and `X-Sanshain-Stability`
        (`ga` or `snapshot` — what actually answered), plus an `ETag`;
        `If-None-Match` yields `304 Not Modified` when unchanged.
      parameters:
        - name: consumername
          in: query
          required: true
          schema: { type: string }
          description: Name of the requiring Consumer.
        - name: producername
          in: query
          required: true
          schema: { type: string }
          description: Name of the Producer to require from.
        - name: version
          in: query
          required: true
          schema: { type: string }
          description: |
            The exact pinned version (`MAJOR.MINOR.PATCH`). No ranges, no
            `latest`. A leading `v` and omitted MINOR/PATCH are accepted and
            normalized (`v1` → `1.0.0`).
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: The OpenAPI path (lenient matching normalizes variable names).
        - name: method
          in: query
          required: true
          schema: { type: string }
          description: The HTTP verb (case-insensitive).
        - name: dry_run
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Resolve without recording the dependency.
        - name: trunk
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Marks this build as the trunk stream's: the pin is additionally
            recorded in the append-only trunk store that feeds the main graph
            (last write per endpoint wins). Omit when not using trunk/graph
            features.
        - name: tag
          in: query
          required: false
          schema: { type: string }
          description: |
            The pin updates the named sanshain-branch's graph instead of
            trunk (release-branch hotfix). Mutually exclusive with `trunk`:
            both together, or a tag naming no existing sanshain-branch, still
            answer normally but record the pin in the dev graph only, with a
            `Sanshain-Warning` header. Branches are never auto-created.
      responses:
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "200":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: The endpoint snippet as YAML.
          content:
            application/yaml:
              example: "openapi: 3.0.3\ninfo:\n  title: Payments\n  version: 1.0.0\npaths:\n  /payments:\n    post:\n      summary: Create a payment\n      responses:\n        '201':\n          description: Created\n"
              schema: { type: string }
        "304":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: Not modified (ETag match).
        "404":
          description: |
            Unknown — the Producer, or the pinned version, does not exist in
            either stability. Fails in milliseconds; nothing waits for a
            version to appear.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          description: |
            Absent — the pinned version exists and deliberately does not
            include this endpoint. Provided specs are complete, so absence is
            a definitive no, distinct from an unknown version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /require/asyncapi:
    get:
      operationId: requireAsyncApi
      summary: Retrieve an AsyncAPI channel snippet at a pinned version
      x-auth: session-or-api-token-full
      security:
        - bearerToken: []
      description: |
        Same resolution rules as `/require`. `path` is the channel name
        (AsyncAPI 2.x channel key / 3.x channel address); `method` is `PUB`
        or `SUB` from the provider's perspective.

        With `format=openapi` the answer is not the AsyncAPI snippet but an
        OpenAPI 3.0.3 document holding the payload schemas of the channel's
        messages (see the `format` parameter). Its ETag never matches the
        AsyncAPI answer's.
      parameters:
        - name: consumername
          in: query
          required: true
          schema: { type: string }
        - name: producername
          in: query
          required: true
          schema: { type: string }
        - name: version
          in: query
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: method
          in: query
          required: true
          schema: { type: string }
        - name: dry_run
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: trunk
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: See `trunk` on `/require`.
        - name: tag
          in: query
          required: false
          schema: { type: string }
          description: See `tag` on `/require`.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [openapi]
          description: |
            `openapi` answers an OpenAPI 3.0.3 document instead of the
            AsyncAPI snippet: `openapi: 3.0.3`, `info.title`
            `<producername> message schemas`, `info.version` the pinned
            version, empty `paths`, and in `components.schemas` only the
            payload schemas reachable from the kept messages (nested `$ref`s
            included). A payload given as `$ref: '#/components/schemas/X'`
            keeps the name `X`; an inline payload is named
            `<MessageKey>Payload` (the message's component or channel
            message key, else its `messageId` or `name`). Every `$ref` in the
            answer resolves inside it. AsyncAPI 2.x and 3.x are supported.
            Without the parameter the answer is unchanged.
      responses:
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "200":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: |
            The channel snippet as YAML, or with `format=openapi` the OpenAPI
            3.0.3 document of its payload schemas.
          content:
            application/yaml:
              schema: { type: string }
        "304":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: Not modified (ETag match).
        "400":
          description: |
            An unknown `format`, or the spec cannot be converted with
            `format=openapi`: two different schemas would get the same name,
            a message payload has a non-AsyncAPI `schemaFormat` (e.g. Avro),
            a `$ref` is external or does not resolve, or an inline payload
            has no message key to be named after.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Unknown Producer or version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          description: The pinned version deliberately lacks this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /require/grpc:
    get:
      operationId: requireGrpc
      summary: Retrieve a gRPC method snippet at a pinned version
      x-auth: session-or-api-token-full
      security:
        - bearerToken: []
      description: |
        Same resolution rules as `/require`. `path` is the fully qualified
        service name; `method` is the exact (case-sensitive) RPC name.
      parameters:
        - name: consumername
          in: query
          required: true
          schema: { type: string }
        - name: producername
          in: query
          required: true
          schema: { type: string }
        - name: version
          in: query
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: method
          in: query
          required: true
          schema: { type: string }
        - name: dry_run
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: trunk
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: See `trunk` on `/require`.
        - name: tag
          in: query
          required: false
          schema: { type: string }
          description: See `tag` on `/require`.
      responses:
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "200":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: The .proto snippet.
          content:
            text/plain:
              schema: { type: string }
        "304":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: Not modified (ETag match).
        "404":
          description: Unknown Producer or version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          description: The pinned version deliberately lacks this method.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /require-bundle:
    post:
      operationId: requireBundle
      summary: Retrieve multiple endpoint snippets as a single merged spec
      x-auth: session-or-api-token-full
      security:
        - bearerToken: []
      description: |
        Resolves several endpoints of one Producer at one pinned version and
        returns a single merged document (one copy of each shared schema, so
        generated DTOs are shared across operations). Resolution rules match
        `/require`; if *any* requested endpoint is absent from the pinned
        version the whole bundle fails `410` naming the missing endpoints, and
        no dependency is recorded.

        With `format=openapi` (query parameter, `api_type: asyncapi` only)
        the answer is one OpenAPI 3.0.3 document holding the payload schemas
        of all requested channels' messages, built as described on
        `/require/asyncapi`.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [openapi]
          description: |
            `openapi` answers the payload schemas of the requested AsyncAPI
            channels as an OpenAPI 3.0.3 document (see `format` on
            `/require/asyncapi`). Only valid with `api_type: asyncapi`.
            Without it the answer is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequireBundlePayload"
      responses:
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "200":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: |
            The merged specification as YAML, or with `format=openapi` the
            OpenAPI 3.0.3 document of the channels' payload schemas.
          content:
            application/yaml:
              schema: { type: string }
        "304":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: Not modified (ETag match).
        "400":
          description: |
            `format` with an `api_type` other than `asyncapi` (the default is
            `openapi`), an unknown `format`, or a spec `format=openapi` cannot
            convert (see `/require/asyncapi`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Unknown Producer or version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          description: The pinned version deliberately lacks one or more requested endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /catalog/{systemname}:
    put:
      operationId: pushCatalog
      summary: Record a system's periphery and context from its Backstage catalog-info.yaml
      x-auth: session-or-api-token-full
      security:
        - bearerToken: []
      description: |
        Optional. A Producer's or Consumer's build pushes its Backstage
        `catalog-info.yaml` so the network graph can show the **Peripheral
        Resources** the system depends on — databases, buckets, queues and
        other things outside Sanshain — and so the graph's node panel and the
        system's page can say who owns it, what it is, where its code lives
        and where its wiki, dashboards and ticket board are.

        Sanshain reads only the `Component` whose `metadata.name` equals
        `systemname` (case-insensitive), and of it only:

        - `spec.dependsOn`: `resource:` refs become Peripheral Resources;
          `component:` refs are recorded too and drawn as a **missing
          component** while no Producer or Consumer of that name exists (a
          ref with a Sanshain pendant is ignored: edges between systems are
          Sanshain's own, `/require`); `consumesApis` is ignored. A ref
          without a kind is read as a `resource`, a ref without a namespace
          takes the Component's namespace (`default` when it declares none),
          and refs are lower-cased.
        - `spec.owner`, normalised like other refs (a bare `team-orders` is
          `group:default/team-orders`) and kept as kind and name.
        - `spec.system`, the Backstage system the Component belongs to: its
          name fills the Producer's **domain** (the graph's cluster) when no
          domain is set; a domain an administrator set stays.
        - `metadata.description`, trimmed, at most 1000 characters (a longer
          one is cut with an ellipsis).
        - the `backstage.io/source-location` annotation, without its `url:`
          prefix, when it is an `http` or `https` URL.
        - `metadata.links`: `url` (must be `http` or `https`, otherwise the
          link is dropped), `title` (defaults to the URL's host), `type` and
          `icon`; at most 20, further ones are ignored.
        - `metadata.tags`, lower-cased and deduplicated, at most 20; shown as
          chips with the context, answered by the MCP `describe_service`, and
          a graph focus (`tag:<name>`).

        Everything else in the file is ignored. Each push **replaces** the
        system's periphery and its context: a resource no longer listed is
        removed from the current graph (it stays in the timeline), an empty
        or missing `dependsOn` clears it, and a missing owner, description,
        source location or link list leaves that field empty. `trunk: true`
        updates the main graph and the dev graph; otherwise only the dev
        graph. The context is one present-day fact per system, whatever the
        stream. Sanshain-branches get the periphery copied when they are cut.
        A push whose content matches what is recorded changes nothing.

        Any authenticated caller may push — the same bar as `/require`.
      parameters:
        - name: systemname
          in: path
          required: true
          schema: { type: string }
          description: |
            The system the file describes — the `serviceName` from
            `sanshain.yaml`, i.e. the Producer or Consumer name.
      requestBody:
        required: true
        content:
          application/json:
            example:
              "catalog_info_yaml": "apiVersion: backstage.io/v1alpha1\nkind: Component\nmetadata:\n  name: payments\n  description: Takes payments for the shop and hands them to the bank.\n  annotations:\n    backstage.io/source-location: url:https://github.com/example/payments\nspec:\n  type: service\n  owner: group:default/checkout\n  dependsOn:\n    - resource:default/payments-db\n    - resource:default/bank-gateway\n"
              "trunk": true
            schema:
              $ref: "#/components/schemas/CatalogPushPayload"
      responses:
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "200":
          headers:
            Sanshain-Warning:
              $ref: "#/components/headers/SanshainWarning"
          description: |
            The periphery now recorded for the system (`recorded: true`).

            When the file is not valid YAML, a document in it is not a
            Backstage entity, it has no (or more than one) `Component` named
            `systemname`, or its `dependsOn` is not a list of entity refs,
            the answer is still `200`, with `resources: []` and
            `recorded: false`: nothing is recorded — neither periphery nor
            context — the system's previous state stays as it was, and a
            `Sanshain-Warning` header names the reason.
          content:
            application/json:
              example:
                "system": "payments"
                "trunk": true
                "resources":
                  - "resource:default/bank-gateway"
                  - "resource:default/payments-db"
                "recorded": true
              schema:
                $ref: "#/components/schemas/CatalogPushResponse"
        "422":
          description: Request body has the wrong shape (missing `catalog_info_yaml`, unknown fields).
        "413":
          description: Request body exceeds the configured size limit (`MAX_SPEC_BODY_BYTES`, default 4 MiB).

  /producers/{producername}/versions:
    get:
      operationId: listProducerVersions
      summary: List a Producer's version lines
      x-auth: session-or-api-token
      security:
        - bearerToken: []
      description: |
        Every version-line entry of one Producer — version, stability, content
        hash, timestamps, last provider, endpoint count, and (for snapshots,
        when cleanup is enabled) the use-based expiry. What "what can I
        upgrade to?" tooling reads.
      parameters:
        - name: producername
          in: path
          required: true
          schema: { type: string }
        - name: api_type
          in: query
          required: false
          schema:
            type: string
            enum: [openapi, asyncapi, proto]
          description: Narrow to one API type's line.
      responses:
        "200":
          description: The version-line entries, API types grouped, newest first.
          content:
            application/json:
              example:
                - "api_type": "openapi"
                  "version": "1.0.0"
                  "stability": "snapshot"
                  "content_hash": "sha256:c79fec9c98fc8f883b24e080ef5f3a19644c5200c82362f06122186585d4574b"
                  "provided_by": "root"
                  "created_at": "2026-10-18T16:07:53Z"
                  "updated_at": "2026-10-18T16:07:53Z"
                  "last_required_at": null
                  "endpoint_count": 2
                  "expires_at": "2026-11-17T16:07:53Z"
                  "trunk_provided_at": "2026-10-18T16:07:53Z"
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProducerVersionInfo"
        "404":
          description: Unknown Producer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /report:
    get:
      operationId: dependencyReport
      summary: The dependency report of a graph scope
      x-auth: session-or-api-token
      security:
        - bearerToken: []
      description: |
        Everything the graph view shows, as JSON: the dependency graph
        (Consumer pins at exact versions), provided endpoints nobody requires,
        required endpoints a pinned version does not provide, the trunk pins,
        harvested AsyncAPI subscriptions, Peripheral Resources and the
        catalog context of every system. `scope` selects the graph: `dev`
        (default) is accumulated activity, `main` the trunk, a sanshain-branch
        name its cut; `main` and a branch take `@<instant>` (RFC 3339) for a
        past state (ADR-0004, ADR-0005). Not audited.
      parameters:
        - $ref: "#/components/parameters/ReportScope"
      responses:
        "200":
          description: The report; `scope_label` names the selected scope.
          content:
            application/json:
              example:
                "unused_endpoints": []
                "missing_endpoints": []
                "dependency_graph":
                  - "api_type": "openapi"
                    "client": "orders"
                    "service": "payments"
                    "version": "1.0.0"
                    "stability": "ga"
                    "path": "/payments"
                    "method": "POST"
                    "deprecated": false
                "service_tags": {}
                "trunk_graph": []
                "harvested_subscriptions": []
                "peripheral_dependencies": []
                "systems": {}
                "scope_label": "release-2026.10"
              schema:
                $ref: "#/components/schemas/DependencyReport"
        "400":
          description: |
            `dev@<instant>` (the dev scope has no timeline), or `main@…` with
            an instant that does not parse as a date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No sanshain-branch of that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid token.

  /report/markdown:
    get:
      operationId: dependencyReportMarkdown
      summary: The dependency report as Markdown
      x-auth: session-or-api-token
      security:
        - bearerToken: []
      description: |
        The same report as `/report`, rendered as a Markdown document for a
        wiki page or a release note. Audited as `REPORT`.
      parameters:
        - $ref: "#/components/parameters/ReportScope"
      responses:
        "200":
          description: The report.
          content:
            text/markdown:
              schema:
                type: string
        "400":
          description: Unusable `scope`, as for `/report`.
        "404":
          description: No sanshain-branch of that name.
        "401":
          description: Missing or invalid token.

  /report/isolation:
    get:
      operationId: dependencyReportIsolation
      summary: The isolation report
      x-auth: session-or-api-token
      security:
        - bearerToken: []
      description: |
        Which Consumers would be affected by which Producer, from the same
        report as `/report`, rendered as plain text. Audited as `REPORT`.
      parameters:
        - $ref: "#/components/parameters/ReportScope"
      responses:
        "200":
          description: The report.
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Unusable `scope`, as for `/report`.
        "404":
          description: No sanshain-branch of that name.
        "401":
          description: Missing or invalid token.

  /endpoint-versions:
    get:
      operationId: endpointHistory
      summary: The history of one endpoint across a Producer's version line
      x-auth: session-or-api-token
      security:
        - bearerToken: []
      description: |
        Walks the Producer's version line for one endpoint and reports, per
        version, what it stored for that endpoint and whether that version
        changed it: the blame trail behind "last changed in version X by Y".
      parameters:
        - name: service
          in: query
          required: true
          schema: { type: string }
          description: The Producer.
        - name: api_type
          in: query
          required: false
          schema:
            type: string
            enum: [openapi, asyncapi, proto]
            default: openapi
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: The endpoint's path (OpenAPI), channel (AsyncAPI) or `Service/Method` (proto).
        - name: method
          in: query
          required: true
          schema: { type: string }
          description: The HTTP method, `subscribe`/`publish`, or `rpc`.
      responses:
        "200":
          description: Oldest version first.
          content:
            application/json:
              example:
                - "version": "1.0.0"
                  "stability": "ga"
                  "provided_by": "root"
                  "updated_at": "2026-10-18T16:07:54Z"
                  "yaml_content": "openapi: 3.0.3\ninfo:\n  title: Payments\n  version: 1.0.0\npaths:\n  /payments:\n    post:\n      summary: Create a payment\n      responses:\n        '201':\n          description: Created\n"
                  "changed": true
                - "version": "2.0.0"
                  "stability": "ga"
                  "provided_by": "root"
                  "updated_at": "2026-10-18T16:08:02Z"
                  "yaml_content": "openapi: 3.0.3\ninfo:\n  title: Payments\n  version: 2.0.0\npaths:\n  /payments:\n    post:\n      summary: Create a payment\n      responses:\n        '201':\n          description: Created\n"
                  "changed": true
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EndpointHistoryEntry"
        "404":
          description: No such Producer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid token.

  /api/audit/timeline:
    get:
      operationId: auditTimeline
      summary: Audit entries, newest first
      x-auth: session
      security:
        - bearerToken: []
      description: |
        The audit log the dashboard's timeline reads. Session only, with the
        `view_audit` permission (the `admin` and `viewer` roles); an API token
        is refused.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
        - name: from_date
          in: query
          required: false
          schema: { type: string }
          description: RFC 3339 lower bound.
        - name: to_date
          in: query
          required: false
          schema: { type: string }
          description: RFC 3339 upper bound.
        - name: action_type
          in: query
          required: false
          schema: { type: string }
          description: Exact `action_type`, e.g. `PROVIDE`, `REQUIRE`, `ADMIN`, `READ`.
        - name: service
          in: query
          required: false
          schema: { type: string }
          description: Service name, `*` wildcards allowed.
        - name: version
          in: query
          required: false
          schema: { type: string }
          description: Version, `*` wildcards allowed.
        - name: stream
          in: query
          required: false
          schema: { type: string }
          description: Exact stream, `trunk` or a sanshain-branch name (ADR-0005).
      responses:
        "200":
          description: Newest first, at most `limit` entries.
          content:
            application/json:
              example:
                - "id": 25
                  "timestamp": "2026-10-18T16:08:05.620855031+00:00"
                  "username": "root"
                  "action": "DATABASE_SNAPSHOT"
                  "details": "Produced database snapshot sanshain-2.6.1-20261018T160805Z.db (385024 bytes)"
                  "service": null
                  "version": null
                  "action_type": "ADMIN"
                  "diff": null
                  "stream": null
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "401":
          description: Not signed in, or an API token.
        "403":
          description: Signed in without `view_audit`.

  /api/sse/updates:
    get:
      operationId: updatesSse
      summary: Catalog change notifications as server-sent events
      x-auth: session-or-api-token
      security:
        - bearerToken: []
      description: |
        A `text/event-stream` that sends the event `updated` whenever a
        provide, require, deletion or branch cut changed the catalog; the
        event carries no detail, the client re-reads what it shows. Keep-alive
        comments keep the connection open.
      responses:
        "200":
          description: An open event stream; each event's data is `updated`.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Missing or invalid token.

  /api/ws/updates:
    get:
      operationId: updatesWebSocket
      summary: Catalog change notifications over a WebSocket
      x-auth: session-or-api-token
      security:
        - bearerToken: []
      description: |
        The WebSocket twin of `/api/sse/updates`: after the upgrade the
        server sends the text frame `updated` on every catalog change and
        closes when the client closes.
      responses:
        "101":
          description: Switching protocols; text frames `updated` follow.
        "401":
          description: Missing or invalid token.

  /validate:
    post:
      operationId: validateSpec
      summary: Validate a specification without publishing anything
      x-auth: none
      security: []
      description: |
        The free validator: runs exactly the provide-side pipeline — version
        extraction (`MAJOR[.MINOR[.PATCH]]`, optional `v` prefix) and endpoint
        splitting — with
        no persistence and no producer context. **Unauthenticated** and
        stateless; bounded by the request body-size limit. Always answers
        `200` with a verdict, so callers parse one shape. "Valid here" means
        "a Provide of this document parses there" — the version-line rules
        (GA immutability, semver honesty) additionally apply on a real
        Provide.
      requestBody:
        required: true
        content:
          application/json:
            example:
              "api_type": "openapi"
              "content": "openapi: 3.0.3\ninfo:\n  title: Payments\n  version: 1.0.0\npaths:\n  /payments:\n    post:\n      summary: Create a payment\n      responses:\n        '201':\n          description: Created\n"
            schema:
              type: object
              required: [api_type, content]
              properties:
                api_type:
                  type: string
                  enum: [openapi, asyncapi, proto]
                content:
                  type: string
                  description: The full specification document.
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              example:
                "valid": true
                "api_type": "openapi"
                "version": "1.0.0"
                "endpoint_count": 1
                "endpoints":
                  - "POST /payments"
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "413":
          description: Request body exceeds the configured size limit.

  /version:
    get:
      operationId: getVersion
      summary: Report the running Sanshain instance version
      x-auth: none
      security: []
      description: |
        The **instance version** — Sanshain's own build — never to be confused
        with spec versions.
      responses:
        "200":
          description: Instance version and id.
          content:
            application/json:
              example:
                "version": "2.10.0"
              schema:
                type: object
                properties:
                  version: { type: string }
                  instance_id: { type: string }

  /auth/tokens:
    get:
      operationId: listApiTokens
      summary: List the caller's API tokens
      x-auth: session
      security:
        - bearerToken: []
      description: |
        Every token the signed-in user owns, newest first, with its scope and
        when it was last used. The raw token is never answered again after
        creation. Session-authenticated: this is the account page's call, so
        an API token cannot list or mint tokens.
      responses:
        "200":
          description: The caller's tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"
        "401":
          description: No valid session.
    post:
      operationId: createApiToken
      summary: Create an API token
      x-auth: session
      security:
        - bearerToken: []
      description: |
        Mints a token for the signed-in user and answers it **once**. The
        `scope` is decided here and is immutable afterwards: `full` (the
        default) may do everything the user may; `read_only` is for AI / MCP
        clients and is refused on every route that changes the catalog (see
        the `ReadOnlyToken` response). Session-authenticated.
      requestBody:
        required: true
        content:
          application/json:
            example:
              "name": "claude-code"
              "expires_in_days": 90
              "scope": "read_only"
            schema:
              $ref: "#/components/schemas/CreateApiTokenPayload"
      responses:
        "200":
          description: The new token. Copy `token` now; it is not stored and not shown again.
          content:
            application/json:
              example:
                "id": "376e96e4-3808-4c5f-a6c4-0e4c9deacd14"
                "name": "claude-code"
                "scope": "read_only"
                "token": "san_…"
              schema:
                $ref: "#/components/schemas/CreateApiTokenResponse"
        "401":
          description: No valid session.
        "409":
          description: The caller already has a token of that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/tokens/{id}:
    delete:
      operationId: revokeApiToken
      summary: Revoke an API token
      x-auth: session
      security:
        - bearerToken: []
      description: Deletes one of the caller's tokens; it stops validating immediately. Session-authenticated.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The token id answered at creation and by the listing.
      responses:
        "200":
          description: Revoked.
        "401":
          description: No valid session.
        "404":
          description: No such token owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  parameters:
    ReportScope:
      name: scope
      in: query
      required: false
      schema: { type: string }
      description: |
        `dev` (default), `main`, `main@<instant>`, `<branch>` or
        `<branch>@<instant>`; instants are RFC 3339.
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>`: a browser session token or an API
        token (`san_…`). Which of the two an operation accepts, and whether a
        `read_only` API token is refused, is stated per operation in `x-auth`:
        `none` (open), `session` (session token only), `session-or-api-token`
        (either, any scope) or `session-or-api-token-full` (either, but a
        read-only API token is refused with 403).
  responses:
    ReadOnlyToken:
      description: |
        The request carried an API token with scope `read_only`. Such a token
        may read — reports, `/producers/{producername}/versions`,
        `/endpoint-versions`, the update streams and the MCP endpoint — but
        never provide, retire, require or push a catalog. `error` names the
        token's scope and the scope the call needs (`full`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            "error": "this API token has scope 'read_only' and may not change the catalog; create a token with scope 'full' for provide, require and catalog pushes"
  headers:
    SanshainWarning:
      description: |
        A warning the caller's build should print — the call itself
        succeeded. Sent once per warning (the header may appear several
        times). The value is plain ASCII: any other character, e.g. from a
        tag name, is escaped as `\u{XXXX}` (its Unicode code point in hex,
        at least four digits). The graph is informational and never fails a
        build: an unknown `tag` (`no sanshain-branch '<name>' - this build
        was not recorded in a release graph`), `trunk` and `tag` together
        (`trunk and tag are mutually exclusive - this build was recorded in
        neither`), or a catalog push that recorded nothing (the reason).
        Clients fail on it only in strict mode.
      schema:
        type: string
  schemas:
    ErrorBody:
      type: object
      description: |
        The body every error response carries. `error` holds the human-readable
        message; `proposed_version` appears only on 409s from the version
        rules.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable description of what went wrong.
        proposed_version:
          type: string
          description: |
            The next free version the Producer should publish as instead.
            Present only on a 409 refusing a Provide by the version rules.

    ApiTokenScope:
      type: string
      enum: [full, read_only]
      default: full
      description: |
        What a token may do. Decided at creation, immutable afterwards. `full`
        is everything its owner may do; `read_only` is for AI / MCP clients
        and is refused on every catalog-changing route.

    ApiToken:
      type: object
      required: [id, name, scope, created_at, expires_at]
      properties:
        id:
          type: string
        user_id:
          type: integer
          format: int64
        name:
          type: string
        scope:
          $ref: "#/components/schemas/ApiTokenScope"
        created_at:
          type: string
          description: RFC 3339 instant.
        expires_at:
          type: string
          description: RFC 3339 instant; the token stops validating after it.
        last_used_at:
          type: string
          nullable: true
          description: |
            When the token last authenticated a request (API or MCP), to the
            minute — the stamp is refreshed at most once a minute. `null` when
            never used.

    CreateApiTokenPayload:
      type: object
      required: [name, expires_in_days]
      properties:
        name:
          type: string
          description: Unique per user.
        expires_in_days:
          type: integer
          minimum: 1
        scope:
          allOf:
            - $ref: "#/components/schemas/ApiTokenScope"
          description: Omitted means `full`.

    CreateApiTokenResponse:
      type: object
      required: [id, name, scope, token]
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          $ref: "#/components/schemas/ApiTokenScope"
        token:
          type: string
          description: The raw token (`san_` + 64 hex). Shown only here.

    Stability:
      type: string
      enum: [snapshot, ga]
      description: |
        Which of exactly two states a stored version is in. Declared by the
        caller on every Provide; a state of the stored version, never part of
        the version string. Snapshots are overwritable and expire when unused;
        GA is immutable and permanently claims its number.

    ProvidePayload:
      type: object
      required:
        - producername
      properties:
        producername:
          type: string
          description: Name of the Producer providing the specification.
        openapi_yaml:
          type: string
          description: |
            The full OpenAPI specification as a YAML string. Its
            `info.version` is the authoritative version of this Provide.
            Required, except on a retire (`retired: true`), which publishes
            nothing.
        stability:
          allOf:
            - $ref: "#/components/schemas/Stability"
          description: |
            Required, except on a retire, which publishes nothing and so has no
            stability to declare.
        retired:
          type: boolean
          default: false
          description: |
            The Producer no longer provides this API family — retire the
            capability instead of publishing a version. The endpoint already
            names the family, so nothing else identifies it.

            Retiring clears the `messaging`/`grpc` auto-tag, closes the family's
            open trunk pins (it leaves the current main graph while its closed
            rows stay as timeline history), and releases any AsyncAPI
            channel-message contracts it owned so another Producer may claim
            them. Version lines are kept and existing Consumer pins still
            resolve. Answers `{"tag_cleared", "trunk_pins_closed",
            "contracts_released"}`.

            **Retiring is a role**, like releasing: the caller needs the
            `releaser` role — which is what a build pipeline holds, so CI can
            retire the moment `sanshain.yaml` drops a protocol — or a maintainer
            grant on this Producer. Admins and root hold both implicitly.
            Otherwise `403`. A plain authenticated caller may still provide.

            Combining it with anything a publish needs answers `400`: a
            specification body, a `stability`, `trunk`, or `tag`. A retire is
            not a build, so a request declaring both is a contradiction rather
            than one with defaults to fill in.

            With `dry_run: true` the permission check and the Producer lookup
            run and nothing is retired; the returned counts are zero because
            nothing happened.
        build_url:
          type: string
          nullable: true
          description: |
            Where this build ran (an absolute `http(s)` URL). Part of the
            version's **origin**: the latest Provide that carries one wins,
            and a no-op re-provide of identical bytes only fills an empty one.
        change_url:
          type: string
          nullable: true
          description: The pull or merge request behind this build (an absolute `http(s)` URL).
        tickets:
          type: array
          items: { type: string }
          description: Ticket ids this build closes (letters, digits, `-`, `_`, `.`; at most 20); rendered as links through the instance's ticket URL template.
        note:
          type: string
          nullable: true
          description: One line of intent, at most 200 characters.
        dry_run:
          type: boolean
          default: false
          description: Validate and classify without storing anything.
        trunk:
          type: boolean
          default: false
          description: |
            Marks this build as the trunk stream's: the stored version entry
            becomes "trunk's current version" (shown in the main graph), as
            opposed to e.g. a release-branch GA backport. Orthogonal to
            `stability`; no effect on version rules. Omit when not using
            trunk/graph features.
        tag:
          type: string
          description: |
            Marks this build as a sanshain-branch's (release-branch hotfix):
            the producer's member version within that branch is updated.
            Mutually exclusive with `trunk`: both together, or a tag naming no
            existing sanshain-branch (a releaser must create it first), still
            store the spec but record it in the dev graph only, with a
            `Sanshain-Warning` header.

    ProvideAsyncApiPayload:
      type: object
      required:
        - producername
      properties:
        producername:
          type: string
          description: Name of the Producer.
        asyncapi_yaml:
          type: string
          description: |
            The full AsyncAPI document as a YAML string. Its `info.version` is
            the authoritative version of this Provide. See
            `ProvidePayload.openapi_yaml` for when it may be omitted.
        stability:
          allOf:
            - $ref: "#/components/schemas/Stability"
          description: See `ProvidePayload.stability`.
        retired:
          type: boolean
          default: false
          description: See `ProvidePayload.retired`.
        build_url:
          type: string
          nullable: true
          description: See `ProvidePayload.build_url`.
        change_url:
          type: string
          nullable: true
          description: See `ProvidePayload.change_url`.
        tickets:
          type: array
          items: { type: string }
          description: See `ProvidePayload.tickets`.
        note:
          type: string
          nullable: true
          description: See `ProvidePayload.note`.
        dry_run:
          type: boolean
          default: false
        trunk:
          type: boolean
          default: false
          description: See `ProvidePayload.trunk`.
        tag:
          type: string
          description: See `ProvidePayload.tag`.

    ProvideProtoPayload:
      type: object
      required:
        - producername
      properties:
        producername:
          type: string
          description: Name of the Producer.
        proto_content:
          type: string
          description: |
            The full .proto file. Must carry exactly one
            `// sanshain-version: MAJOR.MINOR.PATCH` comment. See
            `ProvidePayload.openapi_yaml` for when it may be omitted.
        stability:
          allOf:
            - $ref: "#/components/schemas/Stability"
          description: See `ProvidePayload.stability`.
        retired:
          type: boolean
          default: false
          description: See `ProvidePayload.retired`.
        build_url:
          type: string
          nullable: true
          description: See `ProvidePayload.build_url`.
        change_url:
          type: string
          nullable: true
          description: See `ProvidePayload.change_url`.
        tickets:
          type: array
          items: { type: string }
          description: See `ProvidePayload.tickets`.
        note:
          type: string
          nullable: true
          description: See `ProvidePayload.note`.
        dry_run:
          type: boolean
          default: false
        trunk:
          type: boolean
          default: false
          description: See `ProvidePayload.trunk`.
        tag:
          type: string
          description: See `ProvidePayload.tag`.

    RetiredProtocolResponse:
      type: object
      description: |
        What retiring an API family actually shed. Answered by a provide call
        carrying `retired: true`, in place of `ProvideResponse` — a retire
        publishes no version, so it reports no version.

        All three counts are zero under `dry_run`, which checks permission and
        stops without retiring anything.
      required:
        - trunk_pins_closed
        - contracts_released
      properties:
        tag_cleared:
          type: string
          nullable: true
          description: |
            The capability auto-tag removed — `messaging` for AsyncAPI, `grpc`
            for proto. Null for OpenAPI, which carries no such tag, and null
            when the family had none to clear.
        trunk_pins_closed:
          type: integer
          description: |
            Open trunk pins closed. They leave the current main graph; their
            closed rows stay as timeline history, so the era the Producer did
            provide this family remains visible.
        contracts_released:
          type: integer
          description: |
            AsyncAPI channel-message contracts released for another Producer to
            claim. Always zero for OpenAPI and proto, which own no contracts.

    ProvideResponse:
      type: object
      required:
        - version
        - stability
        - content_hash
        - changes
      properties:
        version:
          type: string
          description: The version read from the provided document.
        stability:
          $ref: "#/components/schemas/Stability"
        content_hash:
          type: string
          description: |
            SHA-256 (`sha256:` prefixed) of the provided document after its
            line endings were normalized to LF and a leading BOM was removed.
        changes:
          type: object
          description: |
            Endpoint diff relative to what this exact version stored before
            (snapshot overwrite / promotion); a brand-new version reports its
            whole endpoint set as inserts. All zero = idempotent no-op.
          properties:
            inserts: { type: integer }
            updates: { type: integer }
            deletes: { type: integer }
        promoted:
          type: boolean
          description: |
            True when this Provide released an existing snapshot in place
            (snapshot → GA under the same number), including the byte-identical
            case where `changes` is all zero.
        harvested_subscriptions:
          type: array
          description: |
            AsyncAPI `subscribe` operations harvested from this provide as
            version-less consumer edges (only present for `/provide/asyncapi`,
            and omitted when empty). Each is validated against the producer's
            GA channel contract: on a GA provide an unsatisfiable expectation is
            rejected with `409`; on a snapshot it is reported here as `drift`.

            Perspective convention: Sanshain reads AsyncAPI 2.x
            `publish`/`subscribe` from the application's perspective —
            `publish` means "this service publishes", `subscribe` means "this
            service consumes" (the 2.x specification's client-perspective
            reading is the inverse). This matches the 3.x `send`/`receive`
            mapping. A document authored with the spec-literal 2.x reading
            harvests exactly backwards.
          items:
            type: object
            required:
              - channel
              - message_name
            properties:
              channel:
                type: string
              message_name:
                type: string
              owner:
                type: string
                nullable: true
                description: |
                  The Producer that owns the channel's PUB contract, or absent
                  when no GA provider owns it yet (an unfulfilled subscription).
              drift:
                type: string
                nullable: true
                description: |
                  Advisory note when the subscription's expectation is not
                  satisfiable by the current contract (snapshot provides only).

    RequireBundlePayload:
      type: object
      required:
        - consumername
        - producername
        - version
        - endpoints
      properties:
        consumername:
          type: string
          description: Name of the requiring Consumer.
        producername:
          type: string
          description: Name of the Producer.
        version:
          type: string
          description: |
            The exact pinned version (`MAJOR.MINOR.PATCH`). A leading `v` and
            omitted MINOR/PATCH are accepted and normalized (`v1` → `1.0.0`).
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
          default: openapi
        endpoints:
          type: array
          minItems: 1
          items:
            type: object
            required: [path, method]
            properties:
              path: { type: string }
              method: { type: string }
        dry_run:
          type: boolean
          default: false
        trunk:
          type: boolean
          default: false
          description: See `trunk` on `/require`.
        tag:
          type: string
          description: See `tag` on `/require`.

    CatalogPushPayload:
      type: object
      required:
        - catalog_info_yaml
      properties:
        catalog_info_yaml:
          type: string
          description: The system's Backstage `catalog-info.yaml`, as text. May hold several documents.
        trunk:
          type: boolean
          default: false
          description: |
            A trunk build (ADR-0004): the periphery updates the main graph as
            well as the dev graph.

    CatalogPushResponse:
      type: object
      required: [system, trunk, resources, recorded]
      properties:
        system:
          type: string
        trunk:
          type: boolean
        resources:
          type: array
          description: The recorded refs, `resource:<namespace>/<name>`, lower-cased and sorted.
          items: { type: string }
        components:
          type: array
          description: The recorded `component:<namespace>/<name>` refs, lower-cased and sorted; drawn as missing components while no Sanshain system of that name exists.
          items: { type: string }
        recorded:
          type: boolean
          description: |
            Whether the push was recorded. `false` when Sanshain could not
            read the file as the system's Component — the reason is in the
            `Sanshain-Warning` header, and the previous periphery stays.

    ValidationReport:
      type: object
      required: [valid, api_type]
      properties:
        valid:
          type: boolean
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
        version:
          type: string
          description: The version the document declares, when parseable.
        endpoint_count:
          type: integer
          description: How many endpoints/channels/RPCs the split found.
        endpoints:
          type: array
          items: { type: string }
          description: |
            Preview of the first entries the split would store, as
            "METHOD path" strings (at most 20).
        error:
          type: string
          description: Why the document is invalid; absent when valid.

    VersionOrigin:
      type: object
      description: |
        What the build that provided a version said about why: references,
        not content. The latest Provide that carries any of them wins; a
        no-op re-provide of identical bytes only fills an empty one. All
        fields absent when no build said anything.
      required: [build_url, change_url, tickets, note]
      properties:
        build_url:
          type: string
          nullable: true
        change_url:
          type: string
          nullable: true
        tickets:
          type: array
          items: { type: string }
        note:
          type: string
          nullable: true
    ProducerVersionInfo:
      type: object
      required:
        - api_type
        - version
        - stability
        - content_hash
        - provided_by
        - created_at
        - updated_at
        - endpoint_count
        - origin
      properties:
        origin:
          $ref: "#/components/schemas/VersionOrigin"
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
        version:
          type: string
        stability:
          $ref: "#/components/schemas/Stability"
        content_hash:
          type: string
        provided_by:
          type: string
          description: |
            The authenticated Actor credited with this version's content — the
            last provider. A same-content promotion preserves the snapshot's
            provider, so the human who built it stays on the released version.
        created_at:
          type: string
          description: When this version first appeared on the line.
        updated_at:
          type: string
          description: Last successful Provide (overwrite or promotion).
        last_required_at:
          type: string
          nullable: true
          description: Last successful require against this version.
        endpoint_count:
          type: integer
          format: int64
        expires_at:
          type: string
          nullable: true
          description: |
            Use-based expiry for snapshots when cleanup is enabled; absent for
            GA (never age-culled) or when cleanup is off.

    WebhookEnvelope:
      type: object
      description: |
        The JSON a webhook receiver gets (#47) — the body of the `json`
        format, and the facts behind the `slack` and `teams` bodies. No path
        serves it: Sanshain POSTs it to the URL a hook was registered with,
        signed with `Sanshain-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256
        of "<t>.<body>">` under the hook's secret, with `Sanshain-Event` (the
        type) and `X-Sanshain-Delivery` (the delivery id) alongside. See the
        CI integration guide for the receiver's side.
      required: [id, type, occurred_at, sanshain_version, data]
      properties:
        id:
          type: string
          format: uuid
          description: Unique per event; a redelivery carries the same id.
        type:
          $ref: "#/components/schemas/WebhookEventType"
        occurred_at:
          type: string
          format: date-time
          description: RFC 3339, UTC, second precision.
        sanshain_version:
          type: string
          description: The instance version that emitted the event.
        data:
          description: Per type — see the `Webhook*Data` schemas.
          oneOf:
            - $ref: "#/components/schemas/WebhookVersionPublishedData"
            - $ref: "#/components/schemas/WebhookProvideRejectedData"
            - $ref: "#/components/schemas/WebhookVersionDeprecatedData"
            - $ref: "#/components/schemas/WebhookDependencyRecordedData"
            - $ref: "#/components/schemas/WebhookBranchCutData"
            - $ref: "#/components/schemas/WebhookCatalogRecordedData"
            - $ref: "#/components/schemas/WebhookTestData"
        links:
          type: object
          description: |
            Deep links into the UI, keyed `producer`, `version`, `consumer`,
            `graph`, `audit` or `admin` as the type warrants. Omitted when the
            instance does not know its public base URL.
          additionalProperties:
            type: string
            format: uri
    WebhookEventType:
      type: string
      enum:
        - version.published
        - provide.rejected
        - version.deprecated
        - dependency.recorded
        - branch.cut
        - catalog.recorded
        - webhook.test
    WebhookStream:
      type: string
      description: "`dev`, `trunk`, or a Sanshain-branch's name."
    WebhookVersionPublishedData:
      type: object
      description: A Provide succeeded. The idempotent no-op emits nothing.
      required: [producer, api_type, version, stability, promoted, stream, actor, compatibility, origin]
      properties:
        producer:
          type: string
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
        version:
          type: string
        stability:
          $ref: "#/components/schemas/Stability"
        promoted:
          type: boolean
          description: A Snapshot was promoted to GA in place.
        stream:
          $ref: "#/components/schemas/WebhookStream"
        actor:
          type: string
          nullable: true
        compatibility:
          type: object
          nullable: true
          description: On a GA Provide with a previous GA on the line — the classification against it.
          required: [against, impact]
          properties:
            against:
              type: string
            impact:
              type: string
              enum: [none, patch, minor, major]
        origin:
          $ref: "#/components/schemas/VersionOrigin"
    WebhookProvideRejectedData:
      type: object
      description: A Provide was refused by a version rule. Dry-runs emit nothing.
      required: [producer, api_type, version, rule, message, proposed_version, actor]
      properties:
        producer:
          type: string
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
        version:
          type: string
          description: The attempted Version.
        rule:
          type: string
          enum: [immutable_ga, snapshot_on_ga, snapshot_owned, breaking_without_major, message_contract_conflict, ga_requires_releaser]
        message:
          type: string
        proposed_version:
          type: string
          nullable: true
          description: The next free Version to publish as instead, where one exists.
        actor:
          type: string
          nullable: true
    WebhookVersionDeprecatedData:
      type: object
      description: A Provide newly marked elements deprecated (not deprecated in the previous GA).
      required: [producer, api_type, version, stability, elements, document_deprecated]
      properties:
        producer:
          type: string
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
        version:
          type: string
        stability:
          $ref: "#/components/schemas/Stability"
        elements:
          type: array
          items:
            type: object
            required: [path, method]
            properties:
              path:
                type: string
              method:
                type: string
        document_deprecated:
          type: boolean
          description: Every element of the document is deprecated.
    WebhookDependencyRecordedData:
      type: object
      description: A require recorded an edge the Consumer did not hold yet in the declared stream.
      required: [consumer, producer, api_type, version, stability, snapshot_pinned, stream, endpoints]
      properties:
        consumer:
          type: string
        producer:
          type: string
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
        version:
          type: string
          description: The Pin.
        stability:
          $ref: "#/components/schemas/Stability"
        snapshot_pinned:
          type: boolean
        stream:
          $ref: "#/components/schemas/WebhookStream"
        endpoints:
          type: array
          description: The endpoints new to the edge.
          items:
            type: object
            required: [path, method]
            properties:
              path:
                type: string
              method:
                type: string
    WebhookBranchCutData:
      type: object
      description: A Sanshain-branch was created. Global hooks only.
      required: [name, source, as_of, cut_at, actor]
      properties:
        name:
          type: string
        source:
          type: string
          description: "`trunk`, or the source branch's name."
        as_of:
          type: string
          format: date-time
        cut_at:
          type: string
          format: date-time
        actor:
          type: string
    WebhookCatalogRecordedData:
      type: object
      description: A catalog push ran, readable or not.
      required: [system, trunk, recorded, warning, resources]
      properties:
        system:
          type: string
        trunk:
          type: boolean
        recorded:
          type: boolean
        warning:
          type: string
          nullable: true
          description: Why nothing was recorded, when `recorded` is false.
        resources:
          type: integer
          description: The number of Peripheral Resources recorded.
    WebhookTestData:
      type: object
      description: The "send test event" button, to one hook alone.
      required: [hook_id, message]
      properties:
        hook_id:
          type: integer
          format: int64
        message:
          type: string
    ReportEndpoint:
      type: object
      description: A provided endpoint that no Consumer requires.
      required: [api_type, service, version, stability, path, method, deprecated]
      properties:
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
        service:
          type: string
        version:
          type: string
          description: Semantic version, e.g. `1.2.0`.
        stability:
          $ref: "#/components/schemas/Stability"
        path:
          type: string
        method:
          type: string
        deprecated:
          type: boolean
    ReportMissingEndpoint:
      type: object
      description: A required endpoint the pinned version does not provide.
      required: [api_type, client, service, version, path, method]
      properties:
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
        client:
          type: string
        service:
          type: string
        version:
          type: string
          description: Semantic version, e.g. `1.2.0`.
        path:
          type: string
        method:
          type: string
    ReportDependency:
      type: object
      description: One Consumer-to-Producer edge of the dependency graph, one endpoint at a pinned version.
      required: [api_type, client, service, version, stability, path, method, deprecated]
      properties:
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
        client:
          type: string
        service:
          type: string
        version:
          type: string
          description: Semantic version, e.g. `1.2.0`.
        stability:
          $ref: "#/components/schemas/Stability"
        path:
          type: string
        method:
          type: string
        deprecated:
          type: boolean
    ReportTrunkPin:
      type: object
      description: "One trunk pin (ADR-0004): what a Consumer declared as its production dependency."
      required: [client, service, api_type, version, path, method, valid_from, last_required_at, dangling]
      properties:
        client:
          type: string
        service:
          type: string
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
        version:
          type: string
          description: Semantic version, e.g. `1.2.0`.
        path:
          type: string
        method:
          type: string
        valid_from:
          type: string
        last_required_at:
          type: string
        dangling:
          type: boolean
    ReportHarvestedSubscription:
      type: object
      description: An AsyncAPI subscription harvested from a provided spec (ADR-0006).
      required: [client, channel, message_name, owner, trunk]
      properties:
        client:
          type: string
        channel:
          type: string
        message_name:
          type: string
        owner:
          type: string
          nullable: true
        trunk:
          type: boolean
    ReportPeripheralDependency:
      type: object
      description: An edge from a system to a Peripheral Resource (`resource:` ref) or a missing component (`component:` ref with no Sanshain pendant) from its Backstage catalog file.
      required: [system, resource]
      properties:
        system:
          type: string
        resource:
          type: string
    EndpointHistoryEntry:
      type: object
      description: One version of a Producer's line and what it stored for the endpoint; `changed` marks the versions that altered it (the blame trail).
      required: [version, stability, provided_by, updated_at, yaml_content, changed]
      properties:
        version:
          type: string
          description: Semantic version, e.g. `1.2.0`.
        stability:
          $ref: "#/components/schemas/Stability"
        provided_by:
          type: string
        updated_at:
          type: string
        yaml_content:
          type: string
          nullable: true
        changed:
          type: boolean
    AuditLogEntry:
      type: object
      description: One audit entry.
      required: [id, timestamp, username, action, details, service, version, action_type, diff, stream]
      properties:
        id:
          type: integer
        timestamp:
          type: string
        username:
          type: string
        action:
          type: string
        details:
          type: string
        service:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        action_type:
          type: string
          nullable: true
        diff:
          type: string
          nullable: true
        stream:
          type: string
          nullable: true
    SystemContext:
      type: object
      description: |
        What a system's Backstage `catalog-info.yaml` says about it: owner,
        description, source location, links and tags, as pushed to `/catalog/{systemname}`.
      required: [owner, description, source_location, links, tags]
      properties:
        owner:
          type: object
          nullable: true
          required: [kind, name]
          properties:
            kind:
              type: string
            name:
              type: string
        description:
          type: string
          nullable: true
        source_location:
          type: string
          nullable: true
        links:
          type: array
          items:
            type: object
            required: [url, title, type, icon]
            properties:
              url:
                type: string
              title:
                type: string
              type:
                type: string
                nullable: true
              icon:
                type: string
                nullable: true
        tags:
          type: array
          items:
            type: string
    DependencyReport:
      type: object
      description: The dependency report of one graph scope.
      required: [unused_endpoints, missing_endpoints, dependency_graph, service_tags, trunk_graph, harvested_subscriptions, peripheral_dependencies, systems]
      properties:
        unused_endpoints:
          type: array
          items:
            $ref: "#/components/schemas/ReportEndpoint"
        missing_endpoints:
          type: array
          items:
            $ref: "#/components/schemas/ReportMissingEndpoint"
        dependency_graph:
          type: array
          items:
            $ref: "#/components/schemas/ReportDependency"
        service_tags:
          type: object
          description: Tags per service name.
          additionalProperties:
            type: array
            items:
              type: string
        trunk_graph:
          type: array
          items:
            $ref: "#/components/schemas/ReportTrunkPin"
        harvested_subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/ReportHarvestedSubscription"
        peripheral_dependencies:
          type: array
          items:
            $ref: "#/components/schemas/ReportPeripheralDependency"
        systems:
          type: object
          description: Catalog context per system name.
          additionalProperties:
            $ref: "#/components/schemas/SystemContext"
        trunk_stale_before:
          type: string
          description: Only in the dev scope; trunk pins last required before this instant are stale.
        scope_label:
          type: string
          description: The selected scope (`main`, a branch name, optionally with its instant); absent for `dev`.
