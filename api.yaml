openapi: "3.0.3"
info:
  title: Sanshain API
  description: |
    API contract for tooling that talks to Sanshain (build plugins, CLIs).
    A **Producer** provides its full specification for a branch; a **Consumer** requires
    only the endpoint snippets it uses. Covers providing specifications (OpenAPI, AsyncAPI,
    gRPC/Proto) and requiring endpoint snippets. See CONTEXT.md for the vocabulary.
  version: "1.6.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /provide:
    post:
      operationId: provideSpec
      summary: Upload an OpenAPI specification for a service branch
      description: |
        Parses the provided OpenAPI YAML, splits it into individual endpoint snippets,
        and stores them for the given service and branch.

        **Idempotency**: Re-uploading identical YAML for the same service/branch succeeds without modification.
        The server detects identical content via SHA-256 hash and skips updates/version bumps.

        **Optimistic Concurrency**: Clients can provide a `base_version`. If the current version on the
        branch differs from `base_version`, the request is rejected with 409 Conflict.

        **Immutability on protected branches**: If an endpoint already exists on a protected branch
        with different content, the request is rejected with 409 Conflict.
        Feature (non-protected) branches allow overwrites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvidePayload"
      responses:
        "202":
          description: Specification accepted and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvideResponse"
        "400":
          description: Invalid request (e.g. malformed YAML or missing fields).
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: |
            Conflict — an endpoint on a protected branch already exists with different content.
            The response body includes the method, path, branch, and service name.
          content:
            text/plain:
              schema:
                type: string
        "413":
          description: Request body exceeds the configured size limit (`MAX_SPEC_BODY_BYTES`, default 4 MiB).

  /provide/asyncapi:
    post:
      operationId: provideAsyncApi
      summary: Upload an AsyncAPI specification for a service branch
      description: |
        Parses the provided AsyncAPI YAML, splits it into individual channel snippets,
        and stores them for the given service and branch. Each named `publish` message
        registers a message-level channel contract; contract violations are rejected on
        every branch (see the 409 response).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvideAsyncApiPayload"
      responses:
        "202":
          description: Specification accepted and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvideResponse"
        "400":
          description: Invalid request.
        "409":
          description: |
            Conflict. Either a breaking change on a protected branch, or a message-level
            channel-contract violation on any branch: an incompatible change to a message
            this service owns, or a different payload schema for a channel + message name
            already owned by another service.
        "413":
          description: Request body exceeds the configured size limit.

  /provide/grpc:
    post:
      operationId: provideGrpc
      summary: Upload a .proto file for a service branch
      description: |
        Parses the provided Proto file, extracts service and method definitions,
        and stores them as individual endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvideProtoPayload"
      responses:
        "202":
          description: Specification accepted and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvideResponse"
        "400":
          description: Invalid request.
        "409":
          description: Conflict on protected branch.
        "413":
          description: Request body exceeds the configured size limit.

  /admin/settings/dev-mode:
    get:
      summary: Get developer mode status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Developer mode status
          content:
            application/json:
              schema:
                type: object
                properties:
                  dev_mode:
                    type: boolean
    post:
      summary: Set developer mode status
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnabledPayload"
      responses:
        "200":
          description: Status updated

  /admin/settings/auto-approve:
    get:
      summary: Get auto-approve status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Auto-approve status
          content:
            application/json:
              schema:
                type: object
                properties:
                  auto_approve_users:
                    type: boolean
    post:
      summary: Set auto-approve status
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnabledPayload"
      responses:
        "200":
          description: Status updated

  /admin/settings/branch-max-age:
    get:
      summary: Get branch max age
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Max age in days
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: integer
    post:
      summary: Set branch max age
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaxAgePayload"
      responses:
        "200":
          description: Status updated

  /admin/settings/dependency-max-age:
    get:
      summary: Get dependency max age
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Max age in days
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: integer
    post:
      summary: Set dependency max age
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaxAgePayload"
      responses:
        "200":
          description: Status updated

  /admin/users:
    get:
      summary: List all users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{id}/approve:
    post:
      summary: Approve a user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User approved

  /admin/users/{id}:
    delete:
      summary: Delete a user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted

  /admin/nuke/branch/{branch}:
    post:
      summary: Delete a branch from all services
      security:
        - bearerAuth: []
      parameters:
        - name: branch
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NukeConfirmPayload"
      responses:
        "200":
          description: Branch deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

  /require:
    get:
      operationId: requireEndpoint
      summary: Retrieve an endpoint snippet and register a client dependency
      description: |
        Returns the OpenAPI YAML snippet for a specific endpoint of a service on a given branch.
        Registers the calling client as a consumer of that endpoint.

        **Long-polling**: If `timeout` is provided and the endpoint is not yet available,
        the server waits up to `timeout` seconds for it to appear.

        **Branch fallback**: if the endpoint is not found on the requested branch (and that
        branch is not itself a protected branch — protected branches never substitute another),
        the server falls back in this order: the branch's `source_protected_branch` (a sticky,
        persisted hint — see `source_protected_branch` below), then the service's configured
        fallback branch, then any protected branch. Use `pull_from_branch` to bypass this chain
        entirely for a single request.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: SHA-256 hash (in double quotes) of the currently cached specification. Returns 304 Not Modified if it matches the server version.
          schema:
            type: string
        - name: consumername
          in: query
          required: true
          description: Name of the client registering the dependency.
          schema:
            type: string
        - name: producername
          in: query
          required: true
          description: Name of the service that provides the endpoint.
          schema:
            type: string
        - name: branch
          in: query
          required: true
          description: Branch name to retrieve the endpoint from.
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: "API path of the endpoint (e.g. `/api/v1/users`)."
          schema:
            type: string
        - name: method
          in: query
          required: true
          description: "HTTP method (e.g. `GET`, `POST`)."
          schema:
            type: string
        - name: timeout
          in: query
          required: false
          description: |
            Optional long-polling timeout in seconds. If the endpoint is not yet available,
            the server waits up to this duration before returning 404.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: dry_run
          in: query
          required: false
          description: |
            When true, validates the endpoint lookup without recording a dependency.
            Useful for CI dry-run checks.
          schema:
            type: boolean
            default: false
        - name: source_protected_branch
          in: query
          required: false
          description: |
            Best-effort hint: the protected branch this branch defers to when it has no data
            of its own. Only takes effect the first time it is supplied for a given branch —
            once set (by any caller, or an admin), later differing values are ignored (and
            logged as a mismatch); only an admin can change it afterward.
          schema:
            type: string
        - name: pull_from_branch
          in: query
          required: false
          description: |
            One-shot override: resolve this specific request against exactly this branch,
            bypassing `source_protected_branch` and all other fallback resolution. Never
            persisted — use this when the caller's own understanding of its lineage disagrees
            with the stored `source_protected_branch`.
          schema:
            type: string
      responses:
        "200":
          description: The OpenAPI YAML snippet for the requested endpoint.
          headers:
            ETag:
              description: SHA-256 hash of the returned content.
              schema:
                type: string
            X-Sanshain-Resolution:
              description: |
                How this request was resolved: `published` (this branch published it)
                or `inherited` (this branch has never published, so it came from the
                branch named in `X-Sanshain-Served-Branch`).
              schema:
                type: string
                enum: [published, inherited]
            X-Sanshain-Served-Branch:
              description: The branch the returned spec actually came from.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "304":
          description: Not Modified. The specification hasn't changed since the version provided in `If-None-Match`.
        "410":
          description: |
            The requested branch has published a spec that does not include this
            endpoint, so it is deliberately not part of that branch's API. Definitive:
            returned immediately even when `timeout` is set, because no later publish
            of the *current* spec can change it. Distinct from `404`, which means no
            branch has the endpoint and it may still appear.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: |
            No branch of this service has the endpoint (after timeout, if specified).
            May still appear later, which is why a long-poll waits on this state but not on `410`.
            The response body contains a descriptive error message with the service name, branch, and endpoint details.
          content:
            text/plain:
              schema:
                type: string

  /require/asyncapi:
    get:
      operationId: requireAsyncApi
      summary: Retrieve an AsyncAPI channel snippet and register a dependency
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: SHA-256 hash (in double quotes) of the currently cached specification.
          schema:
            type: string
        - $ref: "#/components/parameters/consumername"
        - $ref: "#/components/parameters/producername"
        - $ref: "#/components/parameters/branch"
        - name: path
          in: query
          required: true
          description: "Channel name."
          schema:
            type: string
        - name: method
          in: query
          required: true
          description: "Operation (PUB or SUB)."
          schema:
            type: string
        - $ref: "#/components/parameters/timeout"
        - $ref: "#/components/parameters/dry_run"
        - $ref: "#/components/parameters/source_protected_branch"
        - $ref: "#/components/parameters/pull_from_branch"
      responses:
        "200":
          description: The AsyncAPI snippet.
          headers:
            ETag:
              description: SHA-256 hash of the returned content.
              schema:
                type: string
            X-Sanshain-Resolution:
              description: |
                How this request was resolved: `published` (this branch published it)
                or `inherited` (this branch has never published, so it came from the
                branch named in `X-Sanshain-Served-Branch`).
              schema:
                type: string
                enum: [published, inherited]
            X-Sanshain-Served-Branch:
              description: The branch the returned spec actually came from.
              schema:
                type: string
        "304":
          description: Not Modified.
        "410":
          description: |
            The requested branch has published a spec that does not include the requested
            endpoint(s), so they are deliberately not part of that branch's API. Definitive:
            returned immediately even when `timeout` is set. Distinct from `404`, which means
            no branch has it and it may still appear.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Not found.

  /require/grpc:
    get:
      operationId: requireGrpc
      summary: Retrieve a gRPC method snippet and register a dependency
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: SHA-256 hash (in double quotes) of the currently cached specification.
          schema:
            type: string
        - $ref: "#/components/parameters/consumername"
        - $ref: "#/components/parameters/producername"
        - $ref: "#/components/parameters/branch"
        - name: path
          in: query
          required: true
          description: "Service name."
          schema:
            type: string
        - name: method
          in: query
          required: true
          description: "Method name."
          schema:
            type: string
        - $ref: "#/components/parameters/timeout"
        - $ref: "#/components/parameters/dry_run"
        - $ref: "#/components/parameters/source_protected_branch"
        - $ref: "#/components/parameters/pull_from_branch"
      responses:
        "200":
          description: The Proto snippet.
          headers:
            ETag:
              description: SHA-256 hash of the returned content.
              schema:
                type: string
            X-Sanshain-Resolution:
              description: |
                How this request was resolved: `published` (this branch published it)
                or `inherited` (this branch has never published, so it came from the
                branch named in `X-Sanshain-Served-Branch`).
              schema:
                type: string
                enum: [published, inherited]
            X-Sanshain-Served-Branch:
              description: The branch the returned spec actually came from.
              schema:
                type: string
        "304":
          description: Not Modified.
        "410":
          description: |
            The requested branch has published a spec that does not include the requested
            endpoint(s), so they are deliberately not part of that branch's API. Definitive:
            returned immediately even when `timeout` is set. Distinct from `404`, which means
            no branch has it and it may still appear.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Not found.

  /require-bundle:
    post:
      operationId: requireBundle
      summary: Retrieve multiple endpoint snippets as a single merged OpenAPI spec
      description: |
        Returns a single merged OpenAPI YAML containing all requested endpoints from one service
        on a given branch, with deduplicated schemas/components.
        Registers the calling client as a consumer of each requested endpoint.

        This solves the duplicate DTO problem for typed languages (e.g. Java): instead of
        downloading separate specs per endpoint with overlapping schemas, clients receive
        one consistent spec.

        **Long-polling**: If `timeout` is provided and the service spec is not yet available,
        the server waits up to `timeout` seconds for it to appear.

        **Branch fallback**: identical to `/require` — anything not found on the requested
        branch (and only when that branch is not itself protected) resolves via the branch's
        `source_protected_branch`, then the service's configured fallback branch, then any
        protected branch. Use `pull_from_branch` to bypass the chain for a single request.

        **Caching**: Supports `If-None-Match` and `ETag` headers.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: SHA-256 hash (in double quotes) of the currently cached specification.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequireBundlePayload"
      responses:
        "200":
          description: A single merged OpenAPI YAML containing all requested endpoints with deduplicated schemas.
          headers:
            ETag:
              description: SHA-256 hash of the returned content.
              schema:
                type: string
            X-Sanshain-Resolution:
              description: |
                How this request was resolved: `published` (this branch published it)
                or `inherited` (this branch has never published, so it came from the
                branch named in `X-Sanshain-Served-Branch`).
              schema:
                type: string
                enum: [published, inherited]
            X-Sanshain-Served-Branch:
              description: The branch the returned spec actually came from.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "304":
          description: Not Modified.
        "400":
          description: Invalid request (e.g. empty endpoints list or missing fields).
          content:
            text/plain:
              schema:
                type: string
        "410":
          description: |
            The requested branch has published a spec that does not include the requested
            endpoint(s), so they are deliberately not part of that branch's API. Definitive:
            returned immediately even when `timeout` is set. Distinct from `404`, which means
            no branch has it and it may still appear.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: |
            One or more requested endpoints not found (after timeout, if specified).
            The response body lists all missing endpoints with service name, branch, and endpoint details.
          content:
            text/plain:
              schema:
                type: string
        "413":
          description: Request body exceeds the configured size limit.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    consumername:
      name: consumername
      in: query
      required: true
      description: |
        Name of the client registering the dependency.
        (Also accepted as `clientname` for backward compatibility with clients
        built before 1.6.0.)
      schema:
        type: string
    producername:
      name: producername
      in: query
      required: true
      description: |
        Name of the service that provides the endpoint.
        (Also accepted as `servicename` for backward compatibility with clients
        built before 1.6.0.)
      schema:
        type: string
    branch:
      name: branch
      in: query
      required: true
      schema:
        type: string
    timeout:
      name: timeout
      in: query
      required: false
      schema:
        type: integer
        format: int64
    dry_run:
      name: dry_run
      in: query
      required: false
      schema:
        type: boolean
        default: false
    source_protected_branch:
      name: source_protected_branch
      in: query
      required: false
      description: |
        Best-effort hint: the protected branch this branch defers to when it has no data
        of its own. Only takes effect the first time it is supplied for a given branch —
        once set (by any caller, or an admin), later differing values are ignored (and
        logged as a mismatch); only an admin can change it afterward.
      schema:
        type: string
    pull_from_branch:
      name: pull_from_branch
      in: query
      required: false
      description: |
        One-shot override: resolve this specific request against exactly this branch,
        bypassing `source_protected_branch` and all other fallback resolution. Never
        persisted — use this when the caller's own understanding of its lineage disagrees
        with the stored `source_protected_branch`.
      schema:
        type: string

  schemas:
    ProvidePayload:
      type: object
      required:
        - producername
        - branch
        - openapi_yaml
      properties:
        producername:
          type: string
          description: |
            Name of the service providing the specification.
            (Also accepted as `servicename` for backward compatibility with
            clients built before 1.6.0.)
        branch:
          type: string
          description: Branch name for the specification.
        openapi_yaml:
          type: string
          description: The full OpenAPI specification as a YAML string.
        dry_run:
          type: boolean
          default: false
          description: |
            When true, validates the spec (parsing, conflict detection) without storing anything.
            Useful for CI dry-run checks.
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
          default: openapi
        tags:
          type: array
          items:
            type: string
          description: Optional list of tags to associate with this version.
        base_version:
          type: integer
          description: |
            Optional base version for optimistic concurrency control.
            If provided, the server will reject the update if the current version doesn't match.
        force:
          type: boolean
          default: false
          description: |
            Deprecated: has no effect on non-protected branches (breaking changes are
            always accepted there). Blocked on protected branches (returns 400).
        source_protected_branch:
          type: string
          description: |
            Best-effort hint: the protected branch this branch defers to when it has no
            data of its own (e.g. the release line a hotfix branch was cut from). Only
            takes effect the first time it is supplied for a given branch — once set
            (by any caller, or an admin), later differing values are ignored (and logged
            as a mismatch); only an admin can change it afterward.
        author:
          type: string
          description: |
            Client-supplied override for who authored this change, used for blame/version
            history display only (e.g. a CI pipeline forwarding the real commit author
            instead of its own service-account identity). Sanshain has no git access, so
            this is a pure client hint with no verification. Never affects the audit log,
            which always records the real authenticated caller.
    ProvideAsyncApiPayload:
      type: object
      required:
        - producername
        - branch
        - asyncapi_yaml
      properties:
        producername:
          type: string
          description: |
            (Also accepted as `servicename` for backward compatibility with
            clients built before 1.6.0.)
        branch:
          type: string
        asyncapi_yaml:
          type: string
        dry_run:
          type: boolean
          default: false
        tags:
          type: array
          items:
            type: string
        base_version:
          type: integer
        force:
          type: boolean
          default: false
          description: |
            Deprecated: has no effect on non-protected branches (breaking changes are
            always accepted there). Blocked on protected branches (returns 400).
        source_protected_branch:
          type: string
          description: See `ProvidePayload.source_protected_branch`.
        author:
          type: string
          description: See `ProvidePayload.author`.
    ProvideProtoPayload:
      type: object
      required:
        - producername
        - branch
        - proto_content
      properties:
        producername:
          type: string
          description: |
            (Also accepted as `servicename` for backward compatibility with
            clients built before 1.6.0.)
        branch:
          type: string
        proto_content:
          type: string
        dry_run:
          type: boolean
          default: false
        tags:
          type: array
          items:
            type: string
        base_version:
          type: integer
        force:
          type: boolean
          default: false
          description: |
            Deprecated: has no effect on non-protected branches (breaking changes are
            always accepted there). Blocked on protected branches (returns 400).
        source_protected_branch:
          type: string
          description: See `ProvidePayload.source_protected_branch`.
        author:
          type: string
          description: See `ProvidePayload.author`.
    ProvideResponse:
      type: object
      properties:
        version:
          type: integer
          description: The new monotonic version of the service specification on this branch.
        content_hash:
          type: string
          description: SHA-256 hash of the specification content.
        changes:
          $ref: "#/components/schemas/ProvideChanges"
    ProvideChanges:
      type: object
      properties:
        inserts:
          type: integer
          description: Number of new endpoints added.
        updates:
          type: integer
          description: Number of existing endpoints updated.
        deletes:
          type: integer
          description: Number of endpoints removed.

    RequireBundlePayload:
      type: object
      required:
        - consumername
        - producername
        - branch
        - endpoints
      properties:
        consumername:
          type: string
          description: |
            Name of the client registering the dependencies.
            (Also accepted as `clientname` for backward compatibility with
            clients built before 1.6.0.)
        producername:
          type: string
          description: |
            Name of the service that provides the endpoints.
            (Also accepted as `servicename` for backward compatibility with
            clients built before 1.6.0.)
        branch:
          type: string
          description: Branch name to retrieve the endpoints from.
        api_type:
          type: string
          enum: [openapi, asyncapi, proto]
          default: openapi
        endpoints:
          type: array
          description: List of endpoints to include in the merged spec.
          items:
            $ref: "#/components/schemas/RequireBundleEndpoint"
        timeout:
          type: integer
          format: int64
          minimum: 0
          description: |
            Optional long-polling timeout in seconds. If the service spec is not yet available,
            the server waits up to this duration before returning 404.
        source_protected_branch:
          type: string
          description: |
            Best-effort hint: the protected branch this branch defers to when it has no data
            of its own. Same write-once semantics as on `/provide` and `/require` — only
            takes effect the first time it is supplied for a given branch.
        pull_from_branch:
          type: string
          description: |
            One-shot override: resolve this specific request against exactly this branch,
            bypassing `source_protected_branch` and all other fallback resolution. Never
            persisted.
        dry_run:
          type: boolean
          default: false
          description: |
            When true, validates all endpoint lookups without recording dependencies.
            Useful for CI dry-run checks.
    RequireBundleEndpoint:
      type: object
      required:
        - path
        - method
      properties:
        path:
          type: string
          description: "API path of the endpoint (e.g. `/api/v1/users`)."
        method:
          type: string
          description: "HTTP method (e.g. `GET`, `POST`)."

    EnabledPayload:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean

    MaxAgePayload:
      type: object
      required:
        - days
      properties:
        days:
          type: integer

    NukeConfirmPayload:
      type: object
      required:
        - confirmation
      properties:
        confirmation:
          type: string

    User:
      type: object
      required:
        - id
        - username
        - is_admin
        - approved
      properties:
        id:
          type: integer
        username:
          type: string
        is_admin:
          type: boolean
        approved:
          type: boolean
