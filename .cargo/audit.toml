[advisories]
# RUSTSEC-2026-0459: the SQLite that `libsqlite3-sys` bundles before 3.54.0 can
# return uninitialized page-cache memory when it opens a database together with
# a crafted `-wal` file of a different page size (CVE-2026-119375). Fixed in
# `libsqlite3-sys` 0.39.0, but `sqlx-sqlite` 0.9.0, the newest sqlx release,
# accepts only `libsqlite3-sys` below 0.38, so no released sqlx can take the fix.
# The attack is local and needs the process to open files a less trusted party
# wrote; Sanshain opens only its own database under its data directory and has
# no route that accepts a database file. Remove the ignore with the first sqlx
# release past 0.9.0 that allows `libsqlite3-sys` 0.39 (sqlx main already does).
ignore = ["RUSTSEC-2026-0459"]
