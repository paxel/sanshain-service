[advisories]
# RUSTSEC-2023-0071: Marvin Attack timing sidechannel in the `rsa` crate.
# No fix is available upstream. `rsa` comes in through `openidconnect`, which
# uses it to verify RS256-signed ID tokens with the provider's public key. The
# attack recovers a private key from RSA decryption timings; Sanshain holds no
# RSA private key and never decrypts, so the affected code path is not used.
#
# RUSTSEC-2026-0387: timing variability in `crypto-bigint` 0.5, fixed in 0.7.6.
# Pulled in by `openidconnect -> p256/p384 -> elliptic-curve 0.13`; the newest
# `openidconnect` (4.0.1) still needs that generation. Sanshain only verifies
# the provider's ID token signatures with its public key, so this code never
# handles a secret a timing difference could leak. Remove the ignore once
# `openidconnect` moves to `elliptic-curve` 0.14.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]
