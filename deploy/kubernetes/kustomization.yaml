apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - statefulset.yaml
  - service.yaml
  - ingress.yaml
  # Scheduled backups are opt-in: see backup-cronjob-sqlite.yaml and
  # backup-cronjob-postgres.yaml (commented examples, https://paxel.github.io/sanshain-service/operator/backup.html).
