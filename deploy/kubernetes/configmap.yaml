apiVersion: v1
kind: ConfigMap
metadata:
  name: sanshain-config
  labels:
    app: sanshain
data:
  BIND_ADDRESS: "0.0.0.0:3000"
  RUST_LOG: "info,sanshain_service=debug"
  MAX_POSTGRES_CONNECTIONS: "20"
  MAX_SQLITE_CONNECTIONS: "5"
  SQLITE_BUSY_TIMEOUT_MS: "5000"
  CLEANUP_INTERVAL_SECS: "3600"
  CSRF_MAX_AGE_HOURS: "24"
  LOG_BUFFER_SIZE: "100"
  SPEC_UPDATED_CHANNEL_SIZE: "100"
  CAPTURE_LOG_FILTER: "sanshain_service=debug,tower_http=debug"
  STATIC_DIR: "static"
  INITIAL_ADMIN_USERNAME: "root"
  # The auth mode of the very first start (off, dev, local, ldap, oidc).
  # Unset: Off, maintenance, where only the admin signs in and picks the mode.
  # INITIAL_AUTH_MODE: "local"
  # Directory of additional CA certificates (*.pem) to trust for outbound TLS.
  # Unset means platform certificates only. See the ca-certs mount in
  # statefulset.yaml.
  # EXTRA_CA_CERTS_DIR: "/certs"
