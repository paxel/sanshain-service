apiVersion: v1
kind: Secret
metadata:
  name: sanshain-secrets
  labels:
    app: sanshain
type: Opaque
# Base64-encoded values (echo -n "value" | base64). Add a key only with a
# value: left out, DATABASE_URL means the image's default (SQLite under /data)
# and INITIAL_ADMIN_PASSWORD a random password in /data/initial-admin-password
# on the first start.
data: {}
#  DATABASE_URL: ""
#  INITIAL_ADMIN_PASSWORD: ""
