apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanshain
  labels:
    app: sanshain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sanshain
  template:
    metadata:
      labels:
        app: sanshain
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: sanshain
        image: ghcr.io/sanshain/sanshain-service:v1.5.0
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: sanshain-config
        - secretRef:
            name: sanshain-secrets
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sanshain-data
