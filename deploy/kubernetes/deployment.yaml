apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanshain
  labels:
    app: sanshain
spec:
  # Keep at 1 with the default SQLite backend: the ReadWriteOnce PVC below can
  # only be mounted by a single pod, and concurrent writers would corrupt the
  # SQLite file. To scale above 1, switch to PostgreSQL (set DATABASE_URL to a
  # postgres:// URL in the secret) and remove the SQLite PVC mount.
  replicas: 1
  selector:
    matchLabels:
      app: sanshain
  template:
    metadata:
      labels:
        app: sanshain
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: sanshain
        image: ghcr.io/sanshain/sanshain-service:v1.6.0
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: sanshain-config
        - secretRef:
            name: sanshain-secrets
        volumeMounts:
        - name: data
          mountPath: /data
        # To trust a corporate CA for outbound TLS (e.g. LDAPS), mount the
        # certificates and set EXTRA_CA_CERTS_DIR in the ConfigMap to the same
        # path. They are added to the platform trust store, not substituted for
        # it. Every *.pem in the directory is read at startup; a malformed one
        # fails startup rather than being skipped silently.
        # - name: ca-certs
        #   mountPath: /certs
        #   readOnly: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sanshain-data
      # Companion to the ca-certs mount above — a PVC, or a Secret:
      # - name: ca-certs
      #   secret:
      #     secretName: corporate-ca-certs
