apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sanshain
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
  - host: sanshain.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sanshain
            port:
              number: 80
