{{- /*
Sanshain runs as exactly one instance: each process keeps its own caches and
its own live-update stream, so a second pod would serve stale data. A
StatefulSet stops the old pod before it starts the new one, so the two never
share the data volume during an upgrade.
*/ -}}
{{- if hasKey .Values "replicaCount" }}
{{- fail "replicaCount was removed: Sanshain runs as exactly one instance (see the Scaling section of the deployment guide)" }}
{{- end }}
{{- if hasKey .Values "autoscaling" }}
{{- fail "autoscaling was removed: Sanshain runs as exactly one instance (see the Scaling section of the deployment guide)" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sanshain.fullname" . }}
  labels:
    {{- include "sanshain.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "sanshain.fullname" . }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "sanshain.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sanshain.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sanshain.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "sanshain.fullname" . }}-config
            - secretRef:
                name: {{ include "sanshain.fullname" . }}-secrets
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.persistence.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.persistence.enabled }}
        {{- /* Mounted by name, not through volumeClaimTemplates, so an
        installation that ran as a Deployment keeps its data on upgrade. */}}
        - name: data
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.createPvc }}{{ include "sanshain.fullname" . }}-data{{ else }}{{ .Values.persistence.existingClaim }}{{ end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
