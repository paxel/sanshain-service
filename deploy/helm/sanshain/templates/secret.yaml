apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sanshain.fullname" . }}-secrets
  labels:
    {{- include "sanshain.labels" . | nindent 4 }}
type: Opaque
{{- /* A key is rendered only with a value: an empty DATABASE_URL would reach
     the service as a set variable, and an empty INITIAL_ADMIN_PASSWORD used to
     become the password of the initial admin. */}}
{{- if or .Values.secrets.databaseUrl .Values.secrets.initialAdminPassword }}
data:
  {{- with .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.initialAdminPassword }}
  INITIAL_ADMIN_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
