# Default values for sanshain.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/paxel/sanshain-service
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is "v" + the chart appVersion (release tags carry a v).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: sanshain.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: sanshain-tls
  #    hosts:
  #      - sanshain.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Sanshain specific configuration
config:
  rustLog: "info,sanshain_service=debug"
  bindAddress: "0.0.0.0:3000"
  maxPostgresConnections: 20
  maxSqliteConnections: 5
  sqliteBusyTimeoutMs: 5000
  cleanupIntervalSecs: 3600
  csrfMaxAgeHours: 24
  logBufferSize: 100
  specUpdatedChannelSize: 100
  captureLogFilter: "sanshain_service=debug,tower_http=debug"
  prometheusEndpoint: "/metrics"
  staticDir: "static"
  loginSessionDurationHours: 24
  initialAdminUsername: "root"
  # Directory of additional CA certificates (*.pem) to trust for outbound TLS,
  # e.g. LDAPS against a directory server using a corporate CA. They are added
  # to the platform trust store, not substituted for it. Leave empty to disable.
  # Mount the certificates with extraVolumes/extraVolumeMounts below and point
  # this at the same mountPath. A malformed certificate fails startup.
  extraCaCertsDir: ""

secrets:
  # DATABASE_URL: "sqlite:///data/sanshain.db"
  databaseUrl: ""
  # If empty, a random password will be generated if it's the first install (not implemented in chart logic yet, but good practice)
  initialAdminPassword: ""

persistence:
  enabled: true
  # Set to false if using external PostgreSQL
  createPvc: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data

# Additional volumes and mounts for the Sanshain container. Generic on purpose:
# the data volume above is database-only and goes away with external PostgreSQL,
# so anything else you need to mount belongs here.
#
# Example — trust a corporate CA for LDAPS, alongside config.extraCaCertsDir: /certs
#
# extraVolumes:
#   - name: ca-certs
#     persistentVolumeClaim:
#       claimName: corporate-ca-certs
#   # ...or from a Secret:
#   # - name: ca-certs
#   #   secret:
#   #     secretName: corporate-ca-certs
# extraVolumeMounts:
#   - name: ca-certs
#     mountPath: /certs
#     readOnly: true
extraVolumes: []
extraVolumeMounts: []

# Scheduled backups (see https://paxel.github.io/sanshain-service/operator/backup.html). Off by
# default. Renders one CronJob writing to a backup volume and keeping the
# newest `retain` files:
#   sqlite   — fetches GET /admin/backup/sqlite, a consistent snapshot produced
#              by the engine, with a bearer token read from `tokenSecret`. The
#              token must be a `full`-scope API token of an account holding
#              `run_destructive_operations` (an admin); a `read_only` token is
#              refused.
#   postgres — runs `pg_dump --format=custom` with the DATABASE_URL from the
#              chart's own Secret.
backup:
  enabled: false
  # Daily at 02:00 (cluster time zone).
  schedule: "0 2 * * *"
  # "sqlite" or "postgres". Empty: postgres when secrets.databaseUrl is a
  # postgres:// URL, sqlite otherwise.
  engine: ""
  # How many backup files to keep on the volume; older ones are deleted after
  # each successful run. At least 1: the chart refuses to render otherwise.
  retain: 7
  # Mount this PersistentVolumeClaim instead of creating one.
  existingClaim: ""
  # The claim the chart creates when existingClaim is empty.
  storage:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
  # SQLite only: the Secret and key holding the API token.
  #   kubectl create secret generic sanshain-backup-token --from-literal=token=<api token>
  tokenSecret:
    name: ""
    key: token
  images:
    curl: "curlimages/curl:8.11.1"
    postgres: "postgres:17-alpine"
