<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <title>Sanshain - Producers</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/common.js"></script>
    <script src="/js/discovery.js"></script>
    <script src="/js/webhooks.js"></script>
    <script src="/js/endpoint-filter.js"></script>
    <style>
      .endpoint-card {
        transition: all 0.2s;
      }
      .endpoint-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <header id="site-banner" class="bg-indigo-700 text-white p-4 shadow-lg"></header>
    <script src="/js/site-chrome.js"></script>

    <main class="container mx-auto flex-1 p-6">
      <div id="service-section">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-semibold flex items-center">
            <span class="bg-indigo-100 text-indigo-700 p-2 rounded-lg mr-3">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                ></path>
              </svg>
            </span>
            Producers &amp; Versions
          </h2>
          <div class="relative w-64">
            <input
              type="text"
              id="service-search"
              aria-label="Search services"
              placeholder="Search services..."
              class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 focus:outline-hidden focus:ring-2 focus:ring-indigo-500"
            />
            <div class="absolute left-3 top-2.5 text-slate-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </div>
          </div>
        </div>
        <div
          id="service-breadcrumb"
          class="flex items-center text-sm text-slate-500 mb-4 hidden"
        ></div>
        <div id="services-list" class="space-y-4">
          <div class="animate-pulse bg-white p-6 rounded-xl border border-slate-200 h-32"></div>
          <div class="animate-pulse bg-white p-6 rounded-xl border border-slate-200 h-32"></div>
        </div>
      </div>
    </main>

    <!-- Confirm Delete Modal -->
    <div
      id="confirm-modal"
      class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50"
    >
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
        <h3 class="text-lg font-bold text-slate-800 mb-2">Confirm Deletion</h3>
        <p id="confirm-message" class="text-sm text-slate-600 mb-6"></p>
        <div class="flex space-x-3">
          <button
            id="confirm-yes"
            class="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition-colors font-medium"
          >
            Delete
          </button>
          <button
            data-click="closeConfirmModal"
            class="flex-1 bg-slate-100 text-slate-700 py-2 rounded-lg hover:bg-slate-200 transition-colors font-medium"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script src="/js/pages/producers.js"></script>
    <footer id="site-footer" class="text-center text-sm text-slate-500 py-6 mt-auto"></footer>
    <script src="/js/site-chrome.js"></script>
  </body>
</html>
