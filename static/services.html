<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/sonne.png">
    <title>Sanshain - Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/common.js"></script>
    <script src="/js/discovery.js"></script>
    <style>

            transition: all 0.2s;
        }
        .endpoint-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);

</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

                <path d="M80,50 C95,50 95,30 85,30" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
                <path d="M25,25 L20,10 L35,22 Z" />
                <path d="M45,22 L60,10 L55,25 Z" />
                <path d="M28,35 L36,35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
                <path d="M44,35 L52,35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
                <circle cx="40" cy="40" r="1.5" fill="#1e293b" />
            </svg>
            <div class="zzz-container">
                <span class="zzz">z</span>
                <span class="zzz">z</span>
                <span class="zzz">z</span>

        <div class="mt-4 text-slate-500 text-sm font-medium tracking-wide">Loading...</div>
    </div>
<header id="site-banner" class="bg-indigo-700 text-white p-4 shadow-lg">
    <div class="container mx-auto flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center justify-between gap-4 md:justify-start">
            <a href="/" class="flex items-center space-x-3">
                <img src="/images/sonne.png" alt="Sanshain Logo" width="66" height="36" class="h-9 w-auto rounded-md bg-white/10 p-0.5">
                <div class="text-2xl font-bold tracking-tight">Sanshain <span class="text-indigo-200">(サンシャイン)</span></div>
            </a>
            <span id="version-badge" class="text-indigo-200 text-sm md:hidden"></span>
        </div>
        <nav class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-sm font-medium md:flex-1">
            <a href="/services.html" class="text-white hover:text-indigo-100 transition-colors">Services</a>
            <a href="/clients.html" class="text-white hover:text-indigo-100 transition-colors">Clients</a>
            <a href="/graph.html" class="text-white hover:text-indigo-100 transition-colors">Graph</a>
            <a href="/reports.html" class="text-white hover:text-indigo-100 transition-colors">Reports</a>

            <button id="banner-logout" type="button" onclick="sanshainLogout()" class="hidden rounded-lg bg-indigo-600 px-3 py-1 font-medium transition-colors hover:bg-indigo-500">Logout</button>
            <a id="banner-signin" href="/account.html" class="hidden text-indigo-100 transition-colors hover:text-white">Sign In</a>

<main class="container mx-auto flex-1 p-6">
    <div id="service-section">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold flex items-center">
                <span class="bg-indigo-100 text-indigo-700 p-2 rounded-lg mr-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </span>
                Provided Services & Branches
            </h2>
            <div class="relative w-64">
                <input type="text" id="service-search" placeholder="Search services..."
                       class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div class="absolute left-3 top-2.5 text-slate-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>
        <div id="service-breadcrumb" class="flex items-center text-sm text-slate-500 mb-4 hidden"></div>
        <div id="services-list" class="space-y-4">
            <div class="animate-pulse bg-white p-6 rounded-xl border border-slate-200 h-32"></div>
            <div class="animate-pulse bg-white p-6 rounded-xl border border-slate-200 h-32"></div>
        </div>
    </div>
</main>


<script>
    async function loadServices() {
        showLoader();
        const list = document.getElementById('services-list');
        const breadcrumb = document.getElementById('service-breadcrumb');
        breadcrumb.classList.add('hidden');
        breadcrumb.innerHTML = '';
        document.getElementById('service-search').value = '';
        list.innerHTML = '<div class="text-center py-10">Loading services...</div>';

        try {
            await loadUserFavorites();
            await loadAllServiceBranches();
            renderServiceList(allServices);
            hideLoader();
        } catch (err) {
            hideLoader();
            list.innerHTML = `<div class="text-red-500 text-center py-10">Error: ${err.message}</div>`;
        }
    }

    function goBackToServices() {
        history.pushState({}, '', window.location.pathname);
        loadServices();
    }

    function goBackToBranches(serviceName) {
        history.pushState({ service: serviceName }, '', `?service=${encodeURIComponent(serviceName)}`);
        showServiceBranches(serviceName);
    }

    function renderServiceList(allServicesIn) {
        const list = document.getElementById('services-list');
        const breadcrumb = document.getElementById('service-breadcrumb');
        breadcrumb.classList.add('hidden');
        breadcrumb.innerHTML = '';

        // Only show services that serve something: at least one of their
        // branches must have at least one endpoint. A service whose only
        // branches are empty (e.g. an OpenAPI spec provided with no paths)
        // provides no benefit to list here.
        const services = (allServicesIn || []).filter(svc => serviceHasAnyEndpoints(svc.name));

        if (!services || services.length === 0) {
            list.innerHTML = `
                <div class="bg-white p-10 rounded-2xl border-2 border-dashed border-slate-200 text-center">
                    <div class="text-slate-500 mb-4">
                        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-medium text-slate-900">No services found</h3>
                    <p class="text-slate-500 mt-1">Provide an OpenAPI spec via POST /provide to see it here.</p>
                </div>`;
            return;
        }

        list.innerHTML = '';
        for (const svc of services) {
            const name = svc.name;
            const branches = (svc.branches || []).filter(b => branchHasEndpoints(name, b));
            const isFav = !!svc.is_favorite;
            const icon = svc.icon || null;
            const domain = svc.domain || null;
            const card = document.createElement('div');
            card.className = 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm endpoint-card cursor-pointer';
            card.onclick = () => {
                history.pushState({ service: name }, '', `?service=${encodeURIComponent(name)}`);
                showServiceBranches(name);
            };
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <span class="bg-indigo-100 text-indigo-700 p-2 rounded-lg mr-3 flex items-center justify-center w-10 h-10">
                            ${icon ? `<span class="text-xl">${icon}</span>` : `
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                            </svg>`}
                        </span>
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-lg text-slate-800">${name}</h3>
                                ${domain ? `<span class="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full border border-blue-100 font-bold uppercase">${domain}</span>` : ''}
                                <button onclick="toggleFavorite(event, 'service', '${name}', ${isFav})" class="text-amber-400 hover:text-amber-500 p-1 focus:outline-none rounded transition-colors" title="${isFav ? 'Remove from favorites' : 'Mark as favorite'}">
                                    ${isFav ? `
                                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                    ` : `
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                                    `}
                                </button>
                            </div>
                            <div class="text-sm text-slate-500">
                                <span class="w-2 h-2 inline-block rounded-full bg-green-500 mr-1"></span>
                                ${branches.length} branch${branches.length !== 1 ? 'es' : ''}
                            </div>
                        </div>
                    </div>
                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>`;
            list.appendChild(card);
        }
    }

    document.getElementById('service-search').addEventListener('input', function() {
        const q = this.value.toLowerCase();
        if (!q) {
            renderServiceList(allServices);
            return;
        }
        renderServiceList(allServices.filter(svc => svc.name.toLowerCase().includes(q)));
    });

    async function showServiceBranches(serviceName) {
        hideLoader();
        const list = document.getElementById('services-list');
        const breadcrumb = document.getElementById('service-breadcrumb');
        breadcrumb.classList.remove('hidden');
        breadcrumb.innerHTML = `
            <button onclick="goBackToServices()" class="hover:text-indigo-600 font-medium">Services</button>
            <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            <span class="text-slate-800 font-semibold">${serviceName}</span>`;

        // Only branches that actually serve something belong in the server view —
        // an empty branch (e.g. an OpenAPI spec with no paths) gives no benefit here.
        const branches = (allServiceBranches[serviceName] || []).filter(b => branchHasEndpoints(serviceName, b));
        list.innerHTML = '';

        if (branches.length === 0) {
            list.innerHTML = '<div class="text-center py-10 text-slate-500 italic">No branches found for this service.</div>';
            return;
        }

        const lastPublishedMap = allServiceLastPublished[serviceName] || {};
        const expireMap = allServiceExpireAt[serviceName] || {};
        for (const branch of branches) {
            const iso = lastPublishedMap[branch];
            const lastPublished = iso
                ? `Last published ${iso.slice(0, 16).replace('T', ' ')}`
                : 'No publishes yet';
            // Stale-cleanup TTL: warn when a non-protected branch is due to be culled soon.
            let ttlBadge = '';
            const expireIso = expireMap[branch];
            if (expireIso) {
                const daysLeft = Math.ceil((new Date(expireIso).getTime() - Date.now()) / 86400000);
                if (daysLeft <= 3) {
                    const label = daysLeft <= 0 ? 'Expiring' : `Expires in ${daysLeft}d`;
                    ttlBadge = `<span class="text-[10px] text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full font-bold uppercase tracking-tighter mr-2" title="This branch has had no publish recently and will be removed by stale-branch cleanup.">${label}</span>`;
                }
            }
            const card = document.createElement('div');
            card.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm endpoint-card cursor-pointer';
            card.onclick = () => {
                history.pushState({ service: serviceName, branch: branch }, '', `?service=${encodeURIComponent(serviceName)}&branch=${encodeURIComponent(branch)}`);
                showServiceBranchEndpoints(serviceName, branch);
            };
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <span class="bg-purple-100 text-purple-700 p-2 rounded-lg mr-3">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                        </span>
                        <div>
                            <h3 class="font-semibold text-slate-800">${branch}</h3>
                            <p class="text-xs text-slate-400 mt-0.5">${lastPublished}</p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        ${ttlBadge}
                        <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>
                </div>`;
            list.appendChild(card);
        }
    }

    async function downloadFullApi(service, branch, apiType) {
        try {
            const res = await apiCall(`/admin/services/${encodeURIComponent(service)}/branches/${encodeURIComponent(branch)}/full-spec?api_type=${encodeURIComponent(apiType)}`);
            if (!res.ok) {
                alert('Failed to load the full API spec for this branch.');
                return;
            }
            const text = await res.text();
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${service}-${branch}.yaml`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch (e) {
            alert('Failed to download the full API: ' + e.message);
        }
    }

    async function showServiceBranchEndpoints(serviceName, branchName) {
        showLoader();
        const list = document.getElementById('services-list');
        const breadcrumb = document.getElementById('service-breadcrumb');
        breadcrumb.classList.remove('hidden');
        breadcrumb.innerHTML = `
            <button onclick="goBackToServices()" class="hover:text-indigo-600 font-medium">Services</button>
            <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            <button onclick="goBackToBranches('${serviceName.replace(/'/g, "\\'")}')" class="hover:text-indigo-600 font-medium">${serviceName}</button>
            <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            <span class="text-slate-800 font-semibold">${branchName}</span>`;

        list.innerHTML = '<div class="text-center py-10 text-slate-500">Loading endpoints...</div>';

        try {
            const providedEndpoints = await fetchJSON(`/admin/services/${encodeURIComponent(serviceName)}/branches/${encodeURIComponent(branchName)}/endpoints`);
            if (providedEndpoints && providedEndpoints.length > 0) {
                const apiType = providedEndpoints[0].api_type || 'openapi';
                breadcrumb.innerHTML += `<button onclick="downloadFullApi('${serviceName.replace(/'/g, "\\'")}', '${branchName.replace(/'/g, "\\'")}', '${apiType}')" class="ml-4 px-2.5 py-1 text-xs font-semibold bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Download full API</button>`;
            }
            let report = { dependency_graph: [], unused_endpoints: [] };
            try {
                report = await fetchJSON(`/report?branch=${encodeURIComponent(branchName)}`);
            } catch (_) {}

            const uniqueEndpoints = (providedEndpoints || []).map(e => ({ api_type: e.api_type, path: e.path, method: e.method, service: serviceName, deprecated: e.deprecated, external: e.external }));

            const providedKeys = new Set(uniqueEndpoints.map(e => `${e.method}:${e.path}`));
            const reportEndpoints = [
                ...report.dependency_graph.filter(e => e.service === serviceName),
                ...report.unused_endpoints.filter(e => e.service === serviceName)
            ];
            for (const e of reportEndpoints) {
                const key = `${e.method}:${e.path}`;
                if (!providedKeys.has(key)) {
                    providedKeys.add(key);
                    uniqueEndpoints.push(e);
                }
            }

            const clientsMap = {};
            report.dependency_graph.filter(e => e.service === serviceName).forEach(e => {
                const key = `${e.method}:${e.path}`;
                if (!clientsMap[key]) clientsMap[key] = new Set();
                clientsMap[key].add(e.client);
            });

            const usedKeys = new Set(report.dependency_graph.filter(e => e.service === serviceName).map(e => `${e.method}:${e.path}`));
            const unusedSet = new Set(uniqueEndpoints.filter(e => !usedKeys.has(`${e.method}:${e.path}`)).map(e => `${e.method}:${e.path}`));

            list.innerHTML = '';
            hideLoader();

            if (uniqueEndpoints.length === 0) {
                list.innerHTML = '<div class="text-center py-10 text-slate-500 italic">No endpoints found for this service on this branch.</div>';
                return;
            }

            const summary = document.createElement('div');
            summary.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-2 flex items-center justify-between';
            const usedCount = uniqueEndpoints.filter(e => !unusedSet.has(`${e.method}:${e.path}`)).length;
            const unusedCount = uniqueEndpoints.length - usedCount;
            summary.innerHTML = `
                <div class="text-sm text-slate-600">
                    <span class="font-semibold text-slate-800">${uniqueEndpoints.length}</span> endpoints total &middot;
                    <span class="text-green-600 font-medium">${usedCount} used</span> &middot;
                    <span class="text-amber-600 font-medium">${unusedCount} unused</span>
                </div>`;
            list.appendChild(summary);

            for (const ep of uniqueEndpoints) {
                const key = `${ep.method}:${ep.path}`;
                const isUnused = unusedSet.has(key);
                const clients = clientsMap[key] ? [...clientsMap[key]] : [];
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm endpoint-card cursor-pointer';
                card.onclick = () => {
                    const api_type = ep.api_type || 'REST';
                    window.location.href = `/yaml.html?service=${encodeURIComponent(serviceName)}&branch=${encodeURIComponent(branchName)}&path=${encodeURIComponent(ep.path)}&method=${encodeURIComponent(ep.method)}&api_type=${encodeURIComponent(api_type)}`;
                };
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <span class="px-1.5 py-0.5 rounded-md text-[9px] font-bold uppercase tracking-wider mr-2 bg-slate-100 text-slate-500 border border-slate-200">
                                ${ep.api_type || 'REST'}
                            </span>
                            <span class="px-2 py-1 rounded text-[10px] font-bold uppercase mr-3 ${getMethodColor(ep.method)}">
                                ${ep.method}
                            </span>
                            <span class="font-mono text-sm text-slate-700">${ep.path}</span>
                            ${ep.deprecated ? '<span class="text-[10px] text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full font-bold uppercase tracking-tighter ml-2">deprecated</span>' : ''}
                            ${ep.external ? '<span class="text-[10px] text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-full font-bold uppercase tracking-tighter ml-2">external</span>' : ''}
                        </div>
                        <div class="flex items-center">
                            ${isUnused
                                ? '<span class="text-xs text-amber-600 bg-amber-50 px-2 py-1 rounded-full mr-2">unused</span>'
                                : `<span class="text-xs text-green-600 bg-green-50 px-2 py-1 rounded-full mr-2 relative client-badge-wrapper" data-clients="${clients.map(c => c).join(',')}" onclick="event.stopPropagation(); toggleClientPopover(this)">${clients.length} client${clients.length !== 1 ? 's' : ''} ▾</span>`}
                            <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </div>`;
                list.appendChild(card);
            }
        } catch (err) {
            hideLoader();
            list.innerHTML = `<div class="text-red-500 text-center py-10">Error: ${err.message}</div>`;
        }
    }


    function toggleClientPopover(badge) {
        document.querySelectorAll('.client-popover').forEach(p => p.remove());
        const clients = badge.dataset.clients.split(',').filter(Boolean);
        if (clients.length === 0) return;
        const popover = document.createElement('div');
        popover.className = 'client-popover absolute right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-50 py-1 min-w-[180px]';
        popover.innerHTML = clients.map(c =>
            `<button class="block w-full text-left px-3 py-1.5 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-700" onclick="event.stopPropagation(); navigateToClient('${c}')">${c}</button>`
        ).join('');
        badge.style.position = 'relative';
        badge.appendChild(popover);
        setTimeout(() => {
            const handler = (e) => { if (!badge.contains(e.target)) { popover.remove(); document.removeEventListener('click', handler); } };
            document.addEventListener('click', handler);
        }, 0);
    }

    function navigateToClient(clientName) {
        document.querySelectorAll('.client-popover').forEach(p => p.remove());
        window.location.href = `/clients.html?name=${encodeURIComponent(clientName)}`;
    }

    async function handleDeepLink() {
        const params = new URLSearchParams(window.location.search);
        const service = params.get('service');
        const branch = params.get('branch');
        const path = params.get('path');
        const method = params.get('method');
        const api_type = params.get('api_type') || 'REST';

        if (service && branch && path && method) {
            window.location.href = `/yaml.html?service=${encodeURIComponent(service)}&branch=${encodeURIComponent(branch)}&path=${encodeURIComponent(path)}&method=${encodeURIComponent(method)}&api_type=${encodeURIComponent(api_type)}`;
        } else if (service && branch) {
            await showServiceBranchEndpoints(service, branch);
        } else if (service) {
            await showServiceBranches(service);
        } else {
            await loadServices();
        }
    }

    // Initial load
    checkDiscoveryAuth(async () => {
        await loadAllServiceBranches();
        await handleDeepLink();
    });

    // Handle back/forward navigation
    window.addEventListener('popstate', () => {
        handleDeepLink();
    });

    window.addEventListener('sanshain-update', () => {
        console.log('Live update received, refreshing services...');
        handleDeepLink();
    });
</script>
