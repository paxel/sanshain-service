<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>Sanshain - Audit Timeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/common.js"></script>
    <script src="/js/discovery.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css">
    <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>
    <style>
        .timeline-item {
            position: relative;
            padding-left: 2rem;
            border-left: 2px solid #e2e8f0;
            margin-left: 1rem;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -0.5rem;
            top: 0.25rem;
            width: 1rem;
            height: 1rem;
            background: #6366f1;
            border-radius: 50%;
            border: 2px solid white;
        }
        .d2h-file-header { display: none !important; }
        .d2h-file-wrapper { border: none !important; margin-bottom: 0 !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <div id="app-loader">
        <div class="cat-container">
            <svg class="cat-svg" viewBox="0 0 100 60">
                <path d="M20,50 Q20,20 50,20 Q80,20 80,50 L20,50 Z" />
                <path d="M80,50 C95,50 95,30 85,30" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
                <path d="M25,25 L20,10 L35,22 Z" />
                <path d="M45,22 L60,10 L55,25 Z" />
                <path d="M28,35 L36,35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
                <path d="M44,35 L52,35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
                <circle cx="40" cy="40" r="1.5" fill="#1e293b" />
            </svg>
            <div class="zzz-container">
                <span class="zzz">z</span>
                <span class="zzz">z</span>
                <span class="zzz">z</span>
            </div>
        </div>
        <div class="mt-4 text-slate-500 text-sm font-medium tracking-wide">Loading...</div>
    </div>
<header id="site-banner" class="bg-indigo-700 text-white p-4 shadow-lg">
    <div class="container mx-auto flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center justify-between gap-4 md:justify-start">
            <a href="/" class="flex items-center space-x-3">
                <img src="/images/sonne.png" alt="Sanshain Logo" width="66" height="36" class="h-9 w-auto rounded-md bg-white/10 p-0.5">
                <div class="text-2xl font-bold tracking-tight">Sanshain <span class="text-indigo-200">(サンシャイン)</span></div>
            </a>
            <span id="version-badge" class="text-indigo-200 text-sm md:hidden"></span>
        </div>
        <nav class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-sm font-medium md:flex-1">
            <a href="/producers.html" class="text-white hover:text-indigo-100 transition-colors">Producers</a>
            <a href="/consumers.html" class="text-white hover:text-indigo-100 transition-colors">Consumers</a>
            <a href="/graph.html" class="text-white hover:text-indigo-100 transition-colors">Graph</a>
            <a href="/reports.html" class="text-white hover:text-indigo-100 transition-colors">Reports</a>
            <a id="nav-audit-link" href="/audit.html" class="hidden text-white font-bold underline underline-offset-4">Audit</a>
            <a href="/observability.html" class="text-white hover:text-indigo-100 transition-colors">Observability</a>
            <a href="/admin.html" class="text-white hover:text-indigo-100 transition-colors">Admin</a>
        </nav>
        <div class="flex items-center justify-end gap-4 text-sm">
            <span id="version-badge-desktop" class="hidden text-indigo-200 md:inline"></span>
            <a id="banner-username" href="/account.html" class="hidden text-indigo-200 hover:text-white transition-colors cursor-pointer"></a>
            <button id="banner-logout" type="button" onclick="sanshainLogout()" class="hidden rounded-lg bg-indigo-600 px-3 py-1 font-medium transition-colors hover:bg-indigo-500">Logout</button>
            <a id="banner-signin" href="/account.html" class="hidden text-indigo-100 transition-colors hover:text-white">Sign In</a>
        </div>
    </div>
</header>

<main class="container mx-auto flex-1 p-6">
    <div class="mb-8">
        <h2 class="text-2xl font-bold flex items-center">
            <span class="bg-indigo-100 text-indigo-700 p-2 rounded-lg mr-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </span>
            System Audit Log
        </h2>
        <p class="text-slate-500 mt-2">Historical log of all system activities and specification updates.</p>
    </div>

    <!-- Filter Bar -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-8">
        <form id="audit-filters" onsubmit="loadTimeline(); return false;" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-7 gap-4 items-end">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">From Date</label>
                <input type="date" id="filter-from" class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">To Date</label>
                <input type="date" id="filter-to" class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Type</label>
                <select id="filter-type" class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">All Types</option>
                    <option value="READ">Read (Discovery)</option>
                    <option value="WRITE">Write (Changes)</option>
                    <option value="ADMIN">Admin (System)</option>
                    <option value="REJECT">Rejected (Blocked)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Producer (wildcard %)</label>
                <input type="text" id="filter-service" placeholder="e.g. auth-%" class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Version (wildcard %)</label>
                <input type="text" id="filter-version" placeholder="e.g. 1.2.%" class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Stream</label>
                <input type="text" id="filter-stream" placeholder="trunk or a branch tag" class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div class="flex gap-2">
                <button type="submit" class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition-colors">Filter</button>
                <button type="button" onclick="resetFilters()" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-200 transition-colors">Reset</button>
            </div>
        </form>
    </div>

    <div id="audit-timeline" class="space-y-2">
        <!-- Timeline items will be rendered here -->
        <div class="text-center py-20 text-slate-400">Loading timeline...</div>
    </div>
</main>

<footer class="text-center text-sm text-slate-500 py-6 mt-auto">
    <img src="/images/sonne.png" alt="Sanshain" width="59" height="32" class="mx-auto mb-2 h-8 w-auto opacity-70">
    <div>Sanshain (サンシャイン) &mdash; OpenAPI Distribution Service</div>
    <div class="mt-2 flex items-center justify-center gap-4">
        <a href="https://github.com/paxel/sanshain-service" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:text-indigo-800">GitHub</a>
        <a href="/LICENSE" class="text-indigo-600 hover:text-indigo-800">License</a>
    </div>
</footer>

<script src="/js/audit.js"></script>
<script>
    function initAudit() {
        checkDiscoveryAuth(() => loadTimeline());
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAudit);
    } else {
        initAudit();
    }
    window.addEventListener('sanshain-update', () => loadTimeline());
</script>
</body>
</html>
