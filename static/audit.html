<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <title>Sanshain - Audit Timeline</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/common.js"></script>
    <script src="/js/discovery.js"></script>
    <link rel="stylesheet" href="/vendor/diff2html-3.4.56.min.css" />
    <script src="/vendor/diff2html-ui-3.4.56.min.js"></script>
    <style>
      .timeline-item {
        position: relative;
        padding-left: 2rem;
        border-left: 2px solid #e2e8f0;
        margin-left: 1rem;
      }
      .timeline-item::before {
        content: "";
        position: absolute;
        left: -0.5rem;
        top: 0.25rem;
        width: 1rem;
        height: 1rem;
        background: #6366f1;
        border-radius: 50%;
        border: 2px solid white;
      }
      .d2h-file-header {
        display: none !important;
      }
      .d2h-file-wrapper {
        border: none !important;
        margin-bottom: 0 !important;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <header id="site-banner" class="bg-indigo-700 text-white p-4 shadow-lg"></header>
    <script src="/js/site-chrome.js"></script>

    <main class="container mx-auto flex-1 p-6">
      <div class="mb-8">
        <h2 class="text-2xl font-bold flex items-center">
          <span class="bg-indigo-100 text-indigo-700 p-2 rounded-lg mr-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
          </span>
          System Audit Log
        </h2>
        <p class="text-slate-500 mt-2">
          Historical log of all system activities and specification updates.
        </p>
      </div>

      <!-- Filter Bar -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs mb-8">
        <form
          id="audit-filters"
          data-submit="loadTimeline"
          class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-7 gap-4 items-end"
        >
          <div>
            <label
              for="filter-from"
              class="block text-xs font-semibold text-slate-500 uppercase mb-1"
              >From Date</label
            >
            <input
              type="date"
              id="filter-from"
              class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>
          <div>
            <label for="filter-to" class="block text-xs font-semibold text-slate-500 uppercase mb-1"
              >To Date</label
            >
            <input
              type="date"
              id="filter-to"
              class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>
          <div>
            <label
              for="filter-type"
              class="block text-xs font-semibold text-slate-500 uppercase mb-1"
              >Type</label
            >
            <select
              id="filter-type"
              class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500"
            >
              <option value="">All Types</option>
              <option value="READ">Read (Discovery)</option>
              <option value="WRITE">Write (Changes)</option>
              <option value="ADMIN">Admin (System)</option>
              <option value="REJECT">Rejected (Blocked)</option>
            </select>
          </div>
          <div>
            <label
              for="filter-service"
              class="block text-xs font-semibold text-slate-500 uppercase mb-1"
              >Producer (wildcard %)</label
            >
            <input
              type="text"
              id="filter-service"
              placeholder="e.g. auth-%"
              class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>
          <div>
            <label
              for="filter-version"
              class="block text-xs font-semibold text-slate-500 uppercase mb-1"
              >Version (wildcard %)</label
            >
            <input
              type="text"
              id="filter-version"
              placeholder="e.g. 1.2.%"
              class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>
          <div>
            <label
              for="filter-stream"
              class="block text-xs font-semibold text-slate-500 uppercase mb-1"
              >Stream</label
            >
            <input
              type="text"
              id="filter-stream"
              placeholder="trunk or a branch tag"
              class="w-full rounded-lg border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>
          <div class="flex gap-2">
            <button
              type="submit"
              class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition-colors"
            >
              Filter
            </button>
            <button
              type="button"
              data-click="resetFilters"
              class="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-200 transition-colors"
            >
              Reset
            </button>
          </div>
        </form>
      </div>

      <div id="audit-timeline" class="space-y-2">
        <!-- Timeline items will be rendered here -->
        <div class="text-center py-20 text-slate-400">Loading timeline...</div>
      </div>
    </main>

    <footer id="site-footer" class="text-center text-sm text-slate-500 py-6 mt-auto"></footer>
    <script src="/js/site-chrome.js"></script>

    <script src="/js/audit.js"></script>
    <script src="/js/pages/audit.js"></script>
  </body>
</html>
