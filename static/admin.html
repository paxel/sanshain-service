<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanshain - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-center mb-6 text-indigo-700">Sanshain Admin</h1>
            <div id="login-error" class="hidden bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm"></div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Username</label>
                    <input type="text" id="login-username" required
                        class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                    <input type="password" id="login-password" required
                        class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition-colors font-medium">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="hidden">
        <nav class="bg-indigo-700 text-white p-4 shadow-lg">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <h1 class="text-2xl font-bold tracking-tight">Sanshain Admin</h1>
                    <a href="/" class="text-indigo-200 hover:text-white text-sm">← Back to Dashboard</a>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="admin-username" class="text-indigo-200 text-sm"></span>
                    <button onclick="changePassword()" class="text-indigo-200 hover:text-white text-sm">Change Password</button>
                    <button onclick="logout()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1 rounded-lg text-sm transition-colors">Logout</button>
                </div>
            </div>
        </nav>

        <main class="container mx-auto p-6 space-y-8">
            <!-- Dev Mode Toggle -->
            <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-800">Developer Mode</h2>
                        <p class="text-sm text-slate-500 mt-1">When enabled, API endpoints are accessible without authentication.</p>
                    </div>
                    <button id="dev-mode-toggle" onclick="toggleDevMode()"
                        class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 bg-slate-200">
                        <span id="dev-mode-dot" class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-1"></span>
                    </button>
                </div>
            </section>

            <!-- Protected Branches -->
            <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-800">Protected Branches</h2>
                        <p class="text-sm text-slate-500 mt-1">Endpoints on protected branches are immutable once provided.</p>
                    </div>
                    <div class="flex space-x-2">
                        <input type="text" id="new-branch-pattern" placeholder="e.g. main, release/*"
                            class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="addProtectedBranch()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-indigo-700 transition-colors">Add</button>
                    </div>
                </div>
                <div id="protected-branches-list" class="space-y-2"></div>
            </section>

            <!-- Services -->
            <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-800">Services</h2>
                    <button onclick="loadServices()" class="text-indigo-600 hover:text-indigo-800 text-sm">↻ Refresh</button>
                </div>
                <div id="services-list" class="space-y-2"></div>
            </section>

            <!-- Clients -->
            <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-800">Clients</h2>
                    <button onclick="loadClients()" class="text-indigo-600 hover:text-indigo-800 text-sm">↻ Refresh</button>
                </div>
                <div id="clients-list" class="space-y-2"></div>
            </section>
        </main>
    </div>

    <!-- Change Password Modal -->
    <div id="password-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Change Password</h3>
            <div id="password-error" class="hidden bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm"></div>
            <div id="password-success" class="hidden bg-green-50 text-green-600 p-3 rounded-lg mb-4 text-sm"></div>
            <form id="password-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Current Password</label>
                    <input type="password" id="current-password" required
                        class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">New Password</label>
                    <input type="password" id="new-password" required
                        class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex space-x-3">
                    <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition-colors font-medium">Update</button>
                    <button type="button" onclick="closePasswordModal()" class="flex-1 bg-slate-100 text-slate-700 py-2 rounded-lg hover:bg-slate-200 transition-colors font-medium">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-2">Confirm Deletion</h3>
            <p id="confirm-message" class="text-sm text-slate-600 mb-6"></p>
            <div class="flex space-x-3">
                <button id="confirm-yes" class="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition-colors font-medium">Delete</button>
                <button onclick="closeConfirmModal()" class="flex-1 bg-slate-100 text-slate-700 py-2 rounded-lg hover:bg-slate-200 transition-colors font-medium">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('sanshain_token');
        let csrfToken = null;

        async function fetchCsrfToken() {
            try {
                const res = await fetch('/csrf-token');
                if (res.ok) {
                    const data = await res.json();
                    csrfToken = data.csrf_token;
                }
            } catch (_) {}
        }

        // --- Auth ---
        async function apiCall(url, options = {}) {
            const headers = { ...options.headers };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            if (options.body && typeof options.body === 'object') {
                headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(options.body);
            }
            const method = (options.method || 'GET').toUpperCase();
            if (['POST', 'PUT', 'DELETE', 'PATCH'].includes(method) && csrfToken) {
                headers['X-CSRF-Token'] = csrfToken;
            }
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401) {
                token = null;
                localStorage.removeItem('sanshain_token');
                showLogin();
                throw new Error('Session expired');
            }
            return res;
        }

        function showLogin() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            loadAll();
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');
            try {
                if (!csrfToken) await fetchCsrfToken();
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken || '' },
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value,
                        password: document.getElementById('login-password').value,
                    }),
                });
                if (!res.ok) {
                    errEl.textContent = res.status === 401 ? 'Invalid credentials' : `Error: ${res.status}`;
                    errEl.classList.remove('hidden');
                    return;
                }
                const data = await res.json();
                token = data.token;
                localStorage.setItem('sanshain_token', token);
                showDashboard();
            } catch (err) {
                errEl.textContent = err.message;
                errEl.classList.remove('hidden');
            }
        });

        async function logout() {
            try { await apiCall('/auth/logout', { method: 'POST' }); } catch (_) {}
            token = null;
            localStorage.removeItem('sanshain_token');
            showLogin();
        }

        async function checkSession() {
            if (!token) { showLogin(); return; }
            try {
                const res = await apiCall('/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('admin-username').textContent = data.username;
                    showDashboard();
                } else {
                    showLogin();
                }
            } catch (_) { showLogin(); }
        }

        // --- Load All ---
        function loadAll() {
            loadDevMode();
            loadProtectedBranches();
            loadServices();
            loadClients();
            loadMe();
        }

        async function loadMe() {
            try {
                const res = await apiCall('/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('admin-username').textContent = data.username;
                }
            } catch (_) {}
        }

        // --- Dev Mode ---
        let devModeEnabled = false;

        async function loadDevMode() {
            try {
                const res = await apiCall('/admin/settings/dev-mode');
                if (res.ok) {
                    const data = await res.json();
                    devModeEnabled = data.dev_mode;
                    updateDevModeUI();
                }
            } catch (_) {}
        }

        function updateDevModeUI() {
            const toggle = document.getElementById('dev-mode-toggle');
            const dot = document.getElementById('dev-mode-dot');
            if (devModeEnabled) {
                toggle.classList.remove('bg-slate-200');
                toggle.classList.add('bg-indigo-600');
                dot.classList.remove('translate-x-1');
                dot.classList.add('translate-x-6');
            } else {
                toggle.classList.remove('bg-indigo-600');
                toggle.classList.add('bg-slate-200');
                dot.classList.remove('translate-x-6');
                dot.classList.add('translate-x-1');
            }
        }

        async function toggleDevMode() {
            try {
                const res = await apiCall('/admin/settings/dev-mode', {
                    method: 'POST',
                    body: { enabled: !devModeEnabled },
                });
                if (res.ok) {
                    devModeEnabled = !devModeEnabled;
                    updateDevModeUI();
                }
            } catch (_) {}
        }

        // --- Protected Branches ---
        async function loadProtectedBranches() {
            const list = document.getElementById('protected-branches-list');
            try {
                const res = await apiCall('/admin/protected-branches');
                if (!res.ok) { list.innerHTML = '<p class="text-sm text-red-500">Failed to load</p>'; return; }
                const branches = await res.json();
                if (branches.length === 0) {
                    list.innerHTML = '<p class="text-sm text-slate-400 italic">No protected branches configured.</p>';
                    return;
                }
                list.innerHTML = branches.map(b => `
                    <div class="flex justify-between items-center bg-slate-50 px-4 py-2 rounded-lg fade-in">
                        <span class="font-mono text-sm text-slate-700">${escapeHtml(b)}</span>
                        <button onclick="confirmDelete('Remove protected branch <strong>${escapeHtml(b)}</strong>?', () => deleteProtectedBranch('${escapeAttr(b)}'))"
                            class="text-red-500 hover:text-red-700 text-sm">Remove</button>
                    </div>
                `).join('');
            } catch (_) {
                list.innerHTML = '<p class="text-sm text-red-500">Failed to load</p>';
            }
        }

        async function addProtectedBranch() {
            const input = document.getElementById('new-branch-pattern');
            const pattern = input.value.trim();
            if (!pattern) return;
            try {
                const res = await apiCall('/admin/protected-branches', {
                    method: 'POST',
                    body: { pattern },
                });
                if (res.ok) {
                    input.value = '';
                    loadProtectedBranches();
                }
            } catch (_) {}
        }

        async function deleteProtectedBranch(pattern) {
            try {
                await apiCall(`/admin/protected-branches/${encodeURIComponent(pattern)}`, { method: 'DELETE' });
                loadProtectedBranches();
            } catch (_) {}
        }

        // --- Services ---
        async function loadServices() {
            const list = document.getElementById('services-list');
            try {
                const res = await apiCall('/admin/services');
                if (!res.ok) { list.innerHTML = '<p class="text-sm text-red-500">Failed to load</p>'; return; }
                const services = await res.json();
                if (services.length === 0) {
                    list.innerHTML = '<p class="text-sm text-slate-400 italic">No services registered.</p>';
                    return;
                }
                list.innerHTML = '';
                for (const svc of services) {
                    const div = document.createElement('div');
                    div.className = 'bg-slate-50 rounded-lg p-4 fade-in';
                    div.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div class="flex items-center space-x-3">
                                <button onclick="toggleBranches(this, '${escapeAttr(svc)}')" class="text-slate-400 hover:text-slate-600 text-sm">▶</button>
                                <span class="font-medium text-slate-800">${escapeHtml(svc)}</span>
                            </div>
                            <button onclick="confirmDelete('Delete service <strong>${escapeHtml(svc)}</strong> and all its data?', () => deleteService('${escapeAttr(svc)}'))"
                                class="text-red-500 hover:text-red-700 text-sm">Delete</button>
                        </div>
                        <div class="branches-container hidden mt-3 ml-8 space-y-1"></div>
                    `;
                    list.appendChild(div);
                }
            } catch (_) {
                list.innerHTML = '<p class="text-sm text-red-500">Failed to load</p>';
            }
        }

        async function toggleBranches(btn, serviceName) {
            const container = btn.closest('.bg-slate-50').querySelector('.branches-container');
            if (!container.classList.contains('hidden')) {
                container.classList.add('hidden');
                btn.textContent = '▶';
                return;
            }
            btn.textContent = '▼';
            container.classList.remove('hidden');
            container.innerHTML = '<p class="text-xs text-slate-400">Loading...</p>';
            try {
                const res = await apiCall(`/admin/services/${encodeURIComponent(serviceName)}/branches`);
                if (!res.ok) { container.innerHTML = '<p class="text-xs text-red-500">Failed</p>'; return; }
                const branches = await res.json();
                if (branches.length === 0) {
                    container.innerHTML = '<p class="text-xs text-slate-400 italic">No branches</p>';
                    return;
                }
                container.innerHTML = branches.map(b => `
                    <div class="flex justify-between items-center bg-white px-3 py-1.5 rounded border border-slate-100 fade-in">
                        <span class="text-sm font-mono text-slate-600">${escapeHtml(b)}</span>
                        <button onclick="confirmDelete('Delete branch <strong>${escapeHtml(b)}</strong> from <strong>${escapeHtml(serviceName)}</strong>?', () => deleteBranch('${escapeAttr(serviceName)}', '${escapeAttr(b)}'))"
                            class="text-red-400 hover:text-red-600 text-xs">Delete</button>
                    </div>
                `).join('');
            } catch (_) {
                container.innerHTML = '<p class="text-xs text-red-500">Failed</p>';
            }
        }

        async function deleteService(name) {
            try {
                await apiCall(`/admin/services/${encodeURIComponent(name)}`, { method: 'DELETE' });
                loadServices();
            } catch (_) {}
        }

        async function deleteBranch(service, branch) {
            try {
                await apiCall(`/admin/services/${encodeURIComponent(service)}/branches/${encodeURIComponent(branch)}`, { method: 'DELETE' });
                loadServices();
            } catch (_) {}
        }

        // --- Clients ---
        async function loadClients() {
            const list = document.getElementById('clients-list');
            try {
                const res = await apiCall('/admin/clients');
                if (!res.ok) { list.innerHTML = '<p class="text-sm text-red-500">Failed to load</p>'; return; }
                const clients = await res.json();
                if (clients.length === 0) {
                    list.innerHTML = '<p class="text-sm text-slate-400 italic">No clients registered.</p>';
                    return;
                }
                list.innerHTML = clients.map(c => `
                    <div class="flex justify-between items-center bg-slate-50 px-4 py-2 rounded-lg fade-in">
                        <span class="font-medium text-slate-800">${escapeHtml(c)}</span>
                        <button onclick="confirmDelete('Delete client <strong>${escapeHtml(c)}</strong> and all its dependencies?', () => deleteClient('${escapeAttr(c)}'))"
                            class="text-red-500 hover:text-red-700 text-sm">Delete</button>
                    </div>
                `).join('');
            } catch (_) {
                list.innerHTML = '<p class="text-sm text-red-500">Failed to load</p>';
            }
        }

        async function deleteClient(name) {
            try {
                await apiCall(`/admin/clients/${encodeURIComponent(name)}`, { method: 'DELETE' });
                loadClients();
            } catch (_) {}
        }

        // --- Change Password ---
        function changePassword() {
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('password-error').classList.add('hidden');
            document.getElementById('password-success').classList.add('hidden');
            document.getElementById('password-form').reset();
        }

        function closePasswordModal() {
            document.getElementById('password-modal').classList.add('hidden');
        }

        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('password-error');
            const successEl = document.getElementById('password-success');
            errEl.classList.add('hidden');
            successEl.classList.add('hidden');
            try {
                const res = await apiCall('/auth/change-password', {
                    method: 'POST',
                    body: {
                        old_password: document.getElementById('current-password').value,
                        new_password: document.getElementById('new-password').value,
                    },
                });
                if (res.ok) {
                    successEl.textContent = 'Password updated successfully.';
                    successEl.classList.remove('hidden');
                    setTimeout(closePasswordModal, 1500);
                } else {
                    errEl.textContent = res.status === 401 ? 'Current password is incorrect' : `Error: ${res.status}`;
                    errEl.classList.remove('hidden');
                }
            } catch (err) {
                errEl.textContent = err.message;
                errEl.classList.remove('hidden');
            }
        });

        // --- Confirm Modal ---
        function confirmDelete(message, onConfirm) {
            document.getElementById('confirm-message').innerHTML = message;
            document.getElementById('confirm-modal').classList.remove('hidden');
            document.getElementById('confirm-yes').onclick = () => {
                closeConfirmModal();
                onConfirm();
            };
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        // --- Helpers ---
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeAttr(str) {
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        // --- Init ---
        fetchCsrfToken().then(() => checkSession());
    </script>
</body>
</html>
