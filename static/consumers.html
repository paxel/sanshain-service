<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <title>Sanshain - Consumers</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/common.js"></script>
    <script src="/js/discovery.js"></script>
    <style>
      .endpoint-card {
        transition: all 0.2s;
      }
      .endpoint-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <div id="app-loader">
      <div class="cat-container">
        <svg class="cat-svg" viewBox="0 0 100 60">
          <path d="M20,50 Q20,20 50,20 Q80,20 80,50 L20,50 Z" />
          <path
            d="M80,50 C95,50 95,30 85,30"
            fill="none"
            stroke="#94a3b8"
            stroke-width="6"
            stroke-linecap="round"
          />
          <path d="M25,25 L20,10 L35,22 Z" />
          <path d="M45,22 L60,10 L55,25 Z" />
          <path d="M28,35 L36,35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
          <path d="M44,35 L52,35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
          <circle cx="40" cy="40" r="1.5" fill="#1e293b" />
        </svg>
        <div class="zzz-container">
          <span class="zzz">z</span>
          <span class="zzz">z</span>
          <span class="zzz">z</span>
        </div>
      </div>
      <div class="mt-4 text-slate-500 text-sm font-medium tracking-wide">Loading...</div>
    </div>
    <header id="site-banner" class="bg-indigo-700 text-white p-4 shadow-lg">
      <div
        class="container mx-auto flex flex-col gap-3 md:flex-row md:items-center md:justify-between"
      >
        <div class="flex items-center justify-between gap-4 md:justify-start">
          <a href="/" class="flex items-center space-x-3">
            <img
              src="/images/sonne.png"
              alt="Sanshain Logo"
              width="66"
              height="36"
              class="h-9 w-auto rounded-md bg-white/10 p-0.5"
            />
            <div class="text-2xl font-bold tracking-tight">
              Sanshain <span class="text-indigo-200">(サンシャイン)</span>
            </div>
          </a>
          <span id="version-badge" class="text-indigo-200 text-sm md:hidden"></span>
        </div>
        <nav
          class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-sm font-medium md:flex-1"
        >
          <a href="/producers.html" class="text-white hover:text-indigo-100 transition-colors"
            >Producers</a
          >
          <a href="/consumers.html" class="text-white hover:text-indigo-100 transition-colors"
            >Consumers</a
          >
          <a href="/graph.html" class="text-white hover:text-indigo-100 transition-colors">Graph</a>
          <a href="/reports.html" class="text-white hover:text-indigo-100 transition-colors"
            >Reports</a
          >
          <a
            id="nav-audit-link"
            href="/audit.html"
            class="hidden text-white hover:text-indigo-100 transition-colors"
            >Audit</a
          >
          <a href="/observability.html" class="text-white hover:text-indigo-100 transition-colors"
            >Observability</a
          >
          <a href="/admin.html" class="text-white hover:text-indigo-100 transition-colors">Admin</a>
        </nav>
        <div class="flex items-center justify-end gap-4 text-sm">
          <span id="version-badge-desktop" class="hidden text-indigo-200 md:inline"></span>
          <a
            id="banner-username"
            href="/account.html"
            class="hidden text-indigo-200 hover:text-white transition-colors cursor-pointer"
          ></a>
          <button
            id="banner-logout"
            type="button"
            data-click="sanshainLogout"
            class="hidden rounded-lg bg-indigo-600 px-3 py-1 font-medium transition-colors hover:bg-indigo-500"
          >
            Logout
          </button>
          <a
            id="banner-signin"
            href="/account.html"
            class="hidden text-indigo-100 transition-colors hover:text-white"
            >Sign In</a
          >
        </div>
      </div>
    </header>

    <main class="container mx-auto flex-1 p-6">
      <div id="client-section">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-semibold flex items-center">
            <span class="bg-teal-100 text-teal-700 p-2 rounded-lg mr-3">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
                ></path>
              </svg>
            </span>
            Consumer Dependencies
          </h2>
          <div class="relative w-64">
            <input
              type="text"
              id="client-search"
              placeholder="Search for consumers..."
              class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500"
            />
            <div class="absolute left-3 top-2.5 text-slate-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </div>
          </div>
        </div>
        <div id="clients-list" class="space-y-4">
          <div class="text-center py-10 text-slate-500">Loading consumers...</div>
        </div>
      </div>
    </main>

    <script src="/js/pages/consumers.js"></script>
    <footer class="text-center text-sm text-slate-500 py-6 mt-auto">
      <img
        src="/images/sonne.png"
        alt="Sanshain"
        width="59"
        height="32"
        class="mx-auto mb-2 h-8 w-auto opacity-70"
      />
      <div>Sanshain (サンシャイン) &mdash; OpenAPI Distribution Service</div>
      <div class="mt-2 flex items-center justify-center gap-4">
        <a
          href="https://github.com/paxel/sanshain-service"
          target="_blank"
          rel="noopener noreferrer"
          class="text-indigo-600 hover:text-indigo-800"
          >GitHub</a
        >
        <a href="/LICENSE" class="text-indigo-600 hover:text-indigo-800">License</a>
      </div>
    </footer>
  </body>
</html>
