<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <title>Sanshain - Consumers</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/common.js"></script>
    <script src="/js/discovery.js"></script>
    <script src="/js/webhooks.js"></script>
    <script src="/js/endpoint-filter.js"></script>
    <style>
      .endpoint-card {
        transition: all 0.2s;
      }
      .endpoint-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <header id="site-banner" class="bg-indigo-700 text-white p-4 shadow-lg"></header>
    <script src="/js/site-chrome.js"></script>

    <main class="container mx-auto flex-1 p-6">
      <div id="client-section">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-semibold flex items-center">
            <span class="bg-teal-100 text-teal-700 p-2 rounded-lg mr-3">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
                ></path>
              </svg>
            </span>
            Consumer Dependencies
          </h2>
          <div class="relative w-64">
            <input
              type="text"
              id="client-search"
              aria-label="Search consumers"
              placeholder="Search for consumers..."
              class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 focus:outline-hidden focus:ring-2 focus:ring-teal-500"
            />
            <div class="absolute left-3 top-2.5 text-slate-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </div>
          </div>
        </div>
        <div id="clients-list" class="space-y-4">
          <div class="text-center py-10 text-slate-500">Loading consumers...</div>
        </div>
      </div>
    </main>

    <script src="/js/pages/consumers.js"></script>
    <footer id="site-footer" class="text-center text-sm text-slate-500 py-6 mt-auto"></footer>
    <script src="/js/site-chrome.js"></script>
  </body>
</html>
