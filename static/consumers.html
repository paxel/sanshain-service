<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>Sanshain - Consumers</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/common.js"></script>
    <script src="/js/discovery.js"></script>
    <style>
        .endpoint-card {
            transition: all 0.2s;
        }
        .endpoint-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <div id="app-loader">
        <div class="cat-container">
            <svg class="cat-svg" viewBox="0 0 100 60">
                <path d="M20,50 Q20,20 50,20 Q80,20 80,50 L20,50 Z" />
                <path d="M80,50 C95,50 95,30 85,30" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
                <path d="M25,25 L20,10 L35,22 Z" />
                <path d="M45,22 L60,10 L55,25 Z" />
                <path d="M28,35 L36,35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
                <path d="M44,35 L52,35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
                <circle cx="40" cy="40" r="1.5" fill="#1e293b" />
            </svg>
            <div class="zzz-container">
                <span class="zzz">z</span>
                <span class="zzz">z</span>
                <span class="zzz">z</span>
            </div>
        </div>
        <div class="mt-4 text-slate-500 text-sm font-medium tracking-wide">Loading...</div>
    </div>
<header id="site-banner" class="bg-indigo-700 text-white p-4 shadow-lg">
    <div class="container mx-auto flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center justify-between gap-4 md:justify-start">
            <a href="/" class="flex items-center space-x-3">
                <img src="/images/sonne.png" alt="Sanshain Logo" width="66" height="36" class="h-9 w-auto rounded-md bg-white/10 p-0.5">
                <div class="text-2xl font-bold tracking-tight">Sanshain <span class="text-indigo-200">(サンシャイン)</span></div>
            </a>
            <span id="version-badge" class="text-indigo-200 text-sm md:hidden"></span>
        </div>
        <nav class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-sm font-medium md:flex-1">
            <a href="/producers.html" class="text-white hover:text-indigo-100 transition-colors">Producers</a>
            <a href="/consumers.html" class="text-white hover:text-indigo-100 transition-colors">Consumers</a>
            <a href="/graph.html" class="text-white hover:text-indigo-100 transition-colors">Graph</a>
            <a href="/reports.html" class="text-white hover:text-indigo-100 transition-colors">Reports</a>
            <a id="nav-audit-link" href="/audit.html" class="hidden text-white hover:text-indigo-100 transition-colors">Audit</a>
            <a href="/observability.html" class="text-white hover:text-indigo-100 transition-colors">Observability</a>
            <a href="/admin.html" class="text-white hover:text-indigo-100 transition-colors">Admin</a>
        </nav>
        <div class="flex items-center justify-end gap-4 text-sm">
            <span id="version-badge-desktop" class="hidden text-indigo-200 md:inline"></span>
            <a id="banner-username" href="/account.html" class="hidden text-indigo-200 hover:text-white transition-colors cursor-pointer"></a>
            <button id="banner-logout" type="button" onclick="sanshainLogout()" class="hidden rounded-lg bg-indigo-600 px-3 py-1 font-medium transition-colors hover:bg-indigo-500">Logout</button>
            <a id="banner-signin" href="/account.html" class="hidden text-indigo-100 transition-colors hover:text-white">Sign In</a>
        </div>
    </div>
</header>

<main class="container mx-auto flex-1 p-6">
    <div id="client-section">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold flex items-center">
                    <span class="bg-teal-100 text-teal-700 p-2 rounded-lg mr-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                    </span>
                Consumer Dependencies
            </h2>
            <div class="relative w-64">
                <input type="text" id="client-search" placeholder="Search for consumers..."
                       class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500">
                <div class="absolute left-3 top-2.5 text-slate-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>
        <div id="clients-list" class="space-y-4">
            <div class="text-center py-10 text-slate-500">Loading consumers...</div>
        </div>
    </div>
</main>


<script>
    let allClients = [];

    async function showClients() {
        showLoader();
        const list = document.getElementById('clients-list');
        list.innerHTML = '<div class="text-center py-10 text-slate-500">Loading consumers...</div>';

        try {
            await loadUserFavorites();
            const clients = await fetchJSON('/admin/consumers');
            allClients = clients || [];
            document.getElementById('client-search').value = '';
            renderClientList(allClients);
            hideLoader();
        } catch (err) {
            hideLoader();
            list.innerHTML = `<div class="text-red-500 text-center py-10">Error: ${escapeHtml(err.message)}</div>`;
        }
    }

    function goBackToClients() {
        history.pushState({}, '', window.location.pathname);
        showClients();
    }

    function renderClientList(clients) {
        const list = document.getElementById('clients-list');
        if (!clients || clients.length === 0) {
            list.innerHTML = `
                <div class="bg-white p-10 rounded-2xl border-2 border-dashed border-slate-200 text-center">
                    <div class="text-slate-500 mb-4">
                        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-medium text-slate-900">No consumers found</h3>
                    <p class="text-slate-500 mt-1">Consumers will appear here once they request endpoints via GET /require.</p>
                </div>`;
            return;
        }
        list.innerHTML = '';
        for (const name of clients) {
            const isFav = !!(userFavorites.clients && userFavorites.clients.includes(name));
            const card = document.createElement('div');
            card.className = 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm endpoint-card cursor-pointer';
            card.onclick = () => {
                history.pushState({ name }, '', `?name=${encodeURIComponent(name)}`);
                showClientDependencies(name);
            };
            // Consumer names are client-supplied and unvalidated: set as text,
            // bind handlers as listeners, never splice into markup.
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <span class="bg-teal-100 text-teal-700 p-2 rounded-lg mr-3">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </span>
                        <div class="flex items-center gap-2">
                            <h3 class="font-bold text-lg text-slate-800" data-client-name></h3>
                            <button type="button" data-toggle-favorite class="text-amber-400 hover:text-amber-500 p-1 focus:outline-none rounded transition-colors" title="${isFav ? 'Remove from favorites' : 'Mark as favorite'}">
                                ${isFav ? `
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                ` : `
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                                `}
                            </button>
                        </div>
                    </div>
                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>`;
            card.querySelector('[data-client-name]').textContent = name;
            card.querySelector('[data-toggle-favorite]')
                .addEventListener('click', (event) => toggleFavorite(event, 'client', name, isFav));
            list.appendChild(card);
        }
    }

    // A Consumer's dependencies, grouped by the Producer they pin. Each group
    // header names the Pin (version + stability); each row is one endpoint.
    async function showClientDependencies(clientName) {
        showLoader();
        const list = document.getElementById('clients-list');
        list.innerHTML = '<div class="text-center py-10 text-slate-500">Loading dependencies...</div>';

        try {
            const endpoints = await fetchJSON(`/admin/consumers/${encodeURIComponent(clientName)}/endpoints`);
            list.innerHTML = '';

            const breadcrumb = document.createElement('div');
            breadcrumb.className = 'flex items-center text-sm text-slate-500 mb-4';
            breadcrumb.innerHTML = `
                <button onclick="goBackToClients()" class="hover:text-teal-600 font-medium">Consumers</button>
                <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                <span class="text-slate-800 font-semibold" data-crumb-client></span>`;
            breadcrumb.querySelector('[data-crumb-client]').textContent = clientName;
            list.appendChild(breadcrumb);

            if (!endpoints || endpoints.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'text-center py-10 text-slate-500 italic';
                empty.textContent = 'No dependencies recorded for this Consumer.';
                list.appendChild(empty);
                hideLoader();
                return;
            }

            // Group by (producer, api_type, pinned version) — one Pin per group.
            const groups = new Map();
            for (const ep of endpoints) {
                const key = `${ep.service}␀${ep.api_type}␀${ep.version}`;
                if (!groups.has(key)) groups.set(key, { service: ep.service, api_type: ep.api_type, version: ep.version, stability: ep.stability, endpoints: [] });
                groups.get(key).endpoints.push(ep);
            }
            const sortedGroups = [...groups.values()].sort((a, b) =>
                a.service.localeCompare(b.service)
                || String(a.api_type).localeCompare(String(b.api_type))
                || compareSemver(a.version, b.version));

            for (const group of sortedGroups) {
                const section = document.createElement('div');
                section.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm';

                const header = document.createElement('div');
                header.className = 'flex items-center justify-between gap-2 flex-wrap mb-3';
                header.innerHTML = `
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="bg-indigo-100 text-indigo-700 p-1.5 rounded-lg">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                            </svg>
                        </span>
                        <h3 class="font-semibold text-slate-800" data-group-service></h3>
                        <span class="px-1.5 py-0.5 rounded-md text-[9px] font-bold uppercase tracking-wider bg-slate-100 text-slate-500 border border-slate-200">${escapeHtml(group.api_type || 'REST')}</span>
                        <span class="text-xs text-slate-500">pinned to</span>
                        <span class="font-mono text-sm text-slate-700">${escapeHtml(group.version)}</span>
                        ${stabilityBadge(group.stability)}
                    </div>
                    <button type="button" data-view-producer class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">View version →</button>`;
                header.querySelector('[data-group-service]').textContent = group.service;
                header.querySelector('[data-view-producer]').addEventListener('click', () => {
                    window.location.href = `/producers.html?service=${encodeURIComponent(group.service)}&api_type=${encodeURIComponent(group.api_type)}&version=${encodeURIComponent(group.version)}`;
                });
                section.appendChild(header);

                const rows = document.createElement('div');
                rows.className = 'space-y-2';
                for (const ep of group.endpoints) {
                    const row = document.createElement('div');
                    const resolved = !!ep.yaml_content;
                    row.className = 'bg-slate-50 p-3 rounded-lg border border-slate-100 endpoint-card' + (resolved ? ' cursor-pointer' : '');
                    if (resolved) {
                        row.onclick = () => {
                            window.location.href = `/yaml.html?service=${encodeURIComponent(ep.service)}&api_type=${encodeURIComponent(ep.api_type || 'openapi')}&version=${encodeURIComponent(ep.version)}&path=${encodeURIComponent(ep.path)}&method=${encodeURIComponent(ep.method)}`;
                        };
                    }
                    row.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <span class="px-2 py-1 rounded text-[10px] font-bold uppercase mr-3 ${getMethodColor(ep.method)}">
                                    ${escapeHtml(ep.method)}
                                </span>
                                <span class="font-mono text-sm text-slate-700">${escapeHtml(ep.path)}</span>
                                ${ep.deprecated ? '<span class="text-[10px] text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full font-bold uppercase tracking-tighter ml-2">deprecated</span>' : ''}
                                ${ep.external ? '<span class="text-[10px] text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-full font-bold uppercase tracking-tighter ml-2">external</span>' : ''}
                            </div>
                            <div class="flex items-center">
                                ${resolved
                                    ? '<span class="text-xs text-green-600 bg-green-50 px-2 py-1 rounded-full mr-2">served</span><svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>'
                                    : '<span class="text-xs text-red-600 bg-red-50 px-2 py-1 rounded-full mr-2" title="The pinned version no longer serves this endpoint — the Consumer\'s next require will fail.">not served</span>'}
                            </div>
                        </div>`;
                    rows.appendChild(row);
                }
                section.appendChild(rows);
                list.appendChild(section);
            }
            hideLoader();
        } catch (err) {
            hideLoader();
            list.innerHTML = `<div class="text-red-500 text-center py-10">Error: ${escapeHtml(err.message)}</div>`;
        }
    }

    document.getElementById('client-search').addEventListener('input', function() {
        const q = this.value.toLowerCase();
        if (!q) {
            renderClientList(allClients);
            return;
        }
        renderClientList(allClients.filter(name => name.toLowerCase().includes(q)));
    });

    async function handleDeepLink() {
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');

        if (name) {
            await showClientDependencies(name);
        } else {
            await showClients();
        }
    }

    // Initial load
    checkDiscoveryAuth(async () => {
        await handleDeepLink();
    });

    // Handle back/forward navigation
    window.addEventListener('popstate', () => {
        handleDeepLink();
    });

    window.addEventListener('sanshain-update', () => {
        console.log('Live update received, refreshing consumers...');
        handleDeepLink();
    });
</script>
    <footer class="text-center text-sm text-slate-500 py-6 mt-auto">
        <img src="/images/sonne.png" alt="Sanshain" width="59" height="32" class="mx-auto mb-2 h-8 w-auto opacity-70">
        <div>Sanshain (サンシャイン) &mdash; OpenAPI Distribution Service</div>
        <div class="mt-2 flex items-center justify-center gap-4">
            <a href="https://github.com/paxel/sanshain-service" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:text-indigo-800">GitHub</a>
            <a href="/LICENSE" class="text-indigo-600 hover:text-indigo-800">License</a>
        </div>
    </footer>
</body>
</html>
