            <a href="/services.html" class="text-white hover:text-indigo-100 transition-colors">Services</a>
            <a href="/clients.html" class="text-white hover:text-indigo-100 transition-colors">Clients</a>
            <a href="/graph.html" class="text-white hover:text-indigo-100 transition-colors">Graph</a>
            <a href="/reports.html" class="text-white hover:text-indigo-100 transition-colors">Reports</a>

</header>

<main class="container mx-auto flex-1 p-6">
    <div id="report-section">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold flex items-center">
                <span class="bg-blue-100 text-blue-700 p-2 rounded-lg mr-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 2v-6m-8-2h8a2 2 0 012 2v9a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2h8z"></path>
                    </svg>
                </span>
                System Reports
            </h2>
            <select id="report-branch-select" onchange="onReportBranchChange()" class="rounded-lg border border-slate-300 text-sm text-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">Loading branches...</option>
            </select>
        </div>

        <div id="reports-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="text-center py-10 text-slate-500 col-span-2">Select a branch to view available reports.</div>
        </div>
    </div>
</main>

<script>
    async function showReports() {
        showLoader();

        try {
            await loadAllServiceBranches();
            const branchSelect = document.getElementById('report-branch-select');
            const allBranchNames = new Set();
            for (const branches of Object.values(allServiceBranches)) {
                for (const b of branches) allBranchNames.add(typeof b === 'string' ? b : b.name);
            }

            if (allBranchNames.size === 0) {
                branchSelect.innerHTML = '<option value="">No branches found</option>';
            } else {
                const prev = branchSelect.value;
                branchSelect.innerHTML = '';
                for (const name of [...allBranchNames].sort()) {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    branchSelect.appendChild(opt);
                }
                
                const params = new URLSearchParams(window.location.search);
                const urlBranch = params.get('branch');
                
                if (urlBranch && allBranchNames.has(urlBranch)) {
                    branchSelect.value = urlBranch;
                } else if (allBranchNames.has(prev)) {
                    branchSelect.value = prev;
                } else if (allBranchNames.has('main')) {
                    branchSelect.value = 'main';
                }
            }

            const params = new URLSearchParams(window.location.search);
            if (!params.get('branch') && branchSelect.value) {
                history.replaceState({ branch: branchSelect.value }, '', `?branch=${encodeURIComponent(branchSelect.value)}`);
            }

            await loadReports();
            hideLoader();
        } catch (err) {
            console.error('Failed to show reports:', err);
            hideLoader();
            const grid = document.getElementById('reports-grid');
            if (grid) {
                grid.innerHTML = `<div class="text-red-500 text-center py-10 col-span-2">Error: ${err.message}</div>`;
            }
        }
    }

    async function loadReports() {
        const branch = document.getElementById('report-branch-select').value;
        const grid = document.getElementById('reports-grid');

        if (!branch) {
            grid.innerHTML = '<div class="text-center py-10 text-slate-500 col-span-2 italic">No branch selected.</div>';
            return;
        }

        grid.innerHTML = `
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                <div class="bg-indigo-100 text-indigo-700 w-12 h-12 rounded-xl flex items-center justify-center mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 2v-6m-8-2h8a2 2 0 012 2v9a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2h8z"></path>
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2">Service Isolation Report</h3>
                <p class="text-sm text-slate-600 mb-6">Detailed overview of service-to-service communication, identifying which services "talk" to each other.</p>
                <a href="/report-viewer.html?src=${encodeURIComponent('/report/isolation?branch=' + encodeURIComponent(branch))}&title=${encodeURIComponent('Service Isolation Report')}&branch=${encodeURIComponent(branch)}"
                   class="inline-flex items-center justify-center w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition-colors">
                    View Isolation Report
                </a>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                <div class="bg-slate-100 text-slate-700 w-12 h-12 rounded-xl flex items-center justify-center mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2">Full Dependency Report</h3>
                <p class="text-sm text-slate-600 mb-6">Complete inventory of all provided and required endpoints across all services in this branch.</p>
                <a href="/report-viewer.html?src=${encodeURIComponent('/report/markdown?branch=' + encodeURIComponent(branch))}&title=${encodeURIComponent('Full Dependency Report')}&branch=${encodeURIComponent(branch)}"
                   class="inline-flex items-center justify-center w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition-colors">
                    View Markdown Report
                </a>
            </div>
        `;
    }

    function onReportBranchChange() {
        const branchSelect = document.getElementById('report-branch-select');
        const branch = branchSelect.value;
        if (branch) {
            history.pushState({ branch }, '', `?branch=${encodeURIComponent(branch)}`);
        } else {
            history.pushState({}, '', window.location.pathname);
        }
        loadReports();
    }

    window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        const branch = params.get('branch');
        const branchSelect = document.getElementById('report-branch-select');
        if (branchSelect) {
            branchSelect.value = branch || '';
        }
        loadReports();
    });

    checkDiscoveryAuth(() => showReports());
</script>
    <footer class="text-center text-sm text-slate-500 py-6 mt-auto">

        <div>Sanshain (サンシャイン) &mdash; OpenAPI Distribution Service</div>
        <div class="mt-2 flex items-center justify-center gap-4">
            <a href="https://github.com/paxel/sanshain-service" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:text-indigo-800">GitHub</a>
            <a href="/LICENSE" class="text-indigo-600 hover:text-indigo-800">License</a>
        </div>
    </footer>
</body>
