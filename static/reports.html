<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <title>Sanshain - Reports</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/common.js"></script>
    <script src="/js/discovery.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <header id="site-banner" class="bg-indigo-700 text-white p-4 shadow-lg"></header>
    <script src="/js/site-chrome.js"></script>

    <main class="container mx-auto flex-1 p-6">
      <div id="report-section">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-semibold flex items-center">
            <span class="bg-blue-100 text-blue-700 p-2 rounded-lg mr-3">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 17v-2m3 2v-4m3 2v-6m-8-2h8a2 2 0 012 2v9a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2h8z"
                ></path>
              </svg>
            </span>
            System Reports
          </h2>
        </div>

        <div id="reports-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="text-center py-10 text-slate-500 col-span-2">Loading reports...</div>
        </div>
      </div>
    </main>

    <script src="/js/pages/reports.js"></script>
    <footer id="site-footer" class="text-center text-sm text-slate-500 py-6 mt-auto"></footer>
    <script src="/js/site-chrome.js"></script>
  </body>
</html>
