<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanshain - OpenAPI Distribution Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({startOnLoad: false});
    </script>
    <style>
        .endpoint-card {
            transition: all 0.2s;
        }

        .endpoint-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<nav class="bg-indigo-700 text-white p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <h1 class="text-2xl font-bold tracking-tight">Sanshain Service</h1>
            <a href="/" class="text-indigo-200 hover:text-white text-sm">← Back to Dashboard</a>
        </div>
        <div class="space-x-4">
            <a href="/service.html" class="hover:text-indigo-200">Services</a>
            <a href="#graph" onclick="showGraph()" class="hover:text-indigo-200">Graph</a>
            <a href="#clients" onclick="showClients()" class="hover:text-indigo-200">Clients</a>
            <a href="/account.html" class="hover:text-indigo-200">Account</a>
        </div>
    </div>
</nav>

<main class="container mx-auto p-6">
    <div id="service-section">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold flex items-center">
                <span class="bg-indigo-100 text-indigo-700 p-2 rounded-lg mr-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </span>
                Provided Services & Branches
            </h2>
            <div class="relative w-64">
                <input type="text" id="service-search" placeholder="Search services..."
                       class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div class="absolute left-3 top-2.5 text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>
        <div id="service-breadcrumb" class="flex items-center text-sm text-slate-500 mb-4 hidden"></div>
        <div id="services-list" class="space-y-4">
            <!-- Services will be loaded here -->
            <div class="animate-pulse bg-white p-6 rounded-xl border border-slate-200 h-32"></div>
            <div class="animate-pulse bg-white p-6 rounded-xl border border-slate-200 h-32"></div>
        </div>
    </div>

    <div id="graph-section" class="hidden">
        <h2 class="text-xl font-semibold mb-6 flex items-center">
                <span class="bg-purple-100 text-purple-700 p-2 rounded-lg mr-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
                    </svg>
                </span>
            Dependency Graph
        </h2>
        <div id="graph-container"
             class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex justify-center overflow-x-auto">
            <div id="mermaid-graph" class="mermaid"></div>
        </div>
    </div>

    <div id="client-section" class="hidden">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold flex items-center">
                    <span class="bg-teal-100 text-teal-700 p-2 rounded-lg mr-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                    </span>
                Client Dependencies
            </h2>
            <div class="relative w-64">
                <input type="text" id="client-search" placeholder="Search for clients..."
                       class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500">
                <div class="absolute left-3 top-2.5 text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>
        <div id="clients-list" class="space-y-4">
            <!-- Clients will be loaded here -->
            <div class="text-center py-10 text-slate-500">Select a branch to see detailed reports.</div>
        </div>
    </div>
</main>

<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h3 id="modal-title" class="text-2xl font-bold text-slate-800">Branch Details</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div id="modal-content" class="p-6 overflow-y-auto flex-grow bg-slate-50">
            <!-- Detailed branch/report info -->
        </div>
        <div class="p-4 border-t border-slate-100 flex justify-end bg-white rounded-b-2xl">
            <a id="md-report-btn" href="#" target="_blank"
               class="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition-colors flex items-center">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                Download Markdown Report
            </a>
        </div>
    </div>
</div>

<script>
    // Redirect to login if no session token
    if (!localStorage.getItem('sanshain_token')) {
        window.location.href = '/account.html';
    }

    async function fetchJSON(url) {
        const headers = {};
        const token = localStorage.getItem('sanshain_token');
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(url, {headers});
        if (!res.ok) throw new Error(`Fetch error: ${res.status}`);
        return res.json();
    }

    let allServices = [];
    let allServiceBranches = {}; // cache: serviceName -> branches[]
    const YAML_PAGE_SIZE = 80; // lines per page for YAML viewer

    async function loadServices() {
        document.getElementById('service-section').classList.remove('hidden');
        document.getElementById('client-section').classList.add('hidden');
        document.getElementById('graph-section').classList.add('hidden');
        const list = document.getElementById('services-list');
        const breadcrumb = document.getElementById('service-breadcrumb');
        breadcrumb.classList.add('hidden');
        breadcrumb.innerHTML = '';
        document.getElementById('service-search').value = '';
        list.innerHTML = '<div class="text-center py-10">Loading services...</div>';

        try {
            const services = await fetchJSON('/admin/services');
            allServices = services || [];
            allServiceBranches = {};
            // Pre-fetch branches for each service
            for (const name of allServices) {
                try {
                    allServiceBranches[name] = await fetchJSON(`/admin/services/${encodeURIComponent(name)}/branches`);
                } catch (_) {
                    allServiceBranches[name] = [];
                }
            }
            renderServiceList(allServices);
        } catch (err) {
            list.innerHTML = `<div class="text-red-500 text-center py-10">Error: ${err.message}</div>`;
        }
    }

    function renderServiceList(services) {
        const list = document.getElementById('services-list');
        const breadcrumb = document.getElementById('service-breadcrumb');
        breadcrumb.classList.add('hidden');
        breadcrumb.innerHTML = '';

        if (!services || services.length === 0) {
            list.innerHTML = `
                <div class="bg-white p-10 rounded-2xl border-2 border-dashed border-slate-200 text-center">
                    <div class="text-slate-400 mb-4">
                        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-medium text-slate-900">No services found</h3>
                    <p class="text-slate-500 mt-1">Provide an OpenAPI spec via POST /provide to see it here.</p>
                </div>`;
            return;
        }

        list.innerHTML = '';
        for (const name of services) {
            const branches = allServiceBranches[name] || [];
            const card = document.createElement('div');
            card.className = 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm endpoint-card cursor-pointer';
            card.onclick = () => showServiceBranches(name);
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <span class="bg-indigo-100 text-indigo-700 p-2 rounded-lg mr-3">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                            </svg>
                        </span>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">${name}</h3>
                            <div class="text-sm text-slate-500">
                                <span class="w-2 h-2 inline-block rounded-full bg-green-500 mr-1"></span>
                                ${branches.length} branch${branches.length !== 1 ? 'es' : ''}
                            </div>
                        </div>
                    </div>
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>`;
            list.appendChild(card);
        }
    }

    document.getElementById('service-search').addEventListener('input', function() {
        const q = this.value.toLowerCase();
        if (!q) {
            renderServiceList(allServices);
            return;
        }
        renderServiceList(allServices.filter(name => name.toLowerCase().includes(q)));
    });

    async function showServiceBranches(serviceName) {
        const list = document.getElementById('services-list');
        const breadcrumb = document.getElementById('service-breadcrumb');
        breadcrumb.classList.remove('hidden');
        breadcrumb.innerHTML = `
            <button onclick="loadServices()" class="hover:text-indigo-600 font-medium">Services</button>
            <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            <span class="text-slate-800 font-semibold">${serviceName}</span>`;

        const branches = allServiceBranches[serviceName] || [];
        list.innerHTML = '';

        if (branches.length === 0) {
            list.innerHTML = '<div class="text-center py-10 text-slate-400 italic">No branches found for this service.</div>';
            return;
        }

        for (const branch of branches) {
            const card = document.createElement('div');
            card.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm endpoint-card cursor-pointer';
            card.onclick = () => showServiceBranchEndpoints(serviceName, branch);
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <span class="bg-purple-100 text-purple-700 p-2 rounded-lg mr-3">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                        </span>
                        <h3 class="font-semibold text-slate-800">${branch}</h3>
                    </div>
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>`;
            list.appendChild(card);
        }
    }

    async function showServiceBranchEndpoints(serviceName, branchName) {
        const list = document.getElementById('services-list');
        const breadcrumb = document.getElementById('service-breadcrumb');
        breadcrumb.classList.remove('hidden');
        breadcrumb.innerHTML = `
            <button onclick="loadServices()" class="hover:text-indigo-600 font-medium">Services</button>
            <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            <button onclick="showServiceBranches('${serviceName}')" class="hover:text-indigo-600 font-medium">${serviceName}</button>
            <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            <span class="text-slate-800 font-semibold">${branchName}</span>`;

        list.innerHTML = '<div class="text-center py-10 text-slate-500">Loading endpoints...</div>';

        try {
            const report = await fetchJSON(`/report?branch=${encodeURIComponent(branchName)}`);
            const serviceEndpoints = [
                ...report.dependency_graph.filter(e => e.service === serviceName),
                ...report.unused_endpoints.filter(e => e.service === serviceName)
            ];

            // Deduplicate by path+method
            const seen = new Set();
            const uniqueEndpoints = serviceEndpoints.filter(e => {
                const key = `${e.method}:${e.path}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            // Find clients per endpoint from dependency_graph
            const clientsMap = {};
            report.dependency_graph.filter(e => e.service === serviceName).forEach(e => {
                const key = `${e.method}:${e.path}`;
                if (!clientsMap[key]) clientsMap[key] = new Set();
                clientsMap[key].add(e.client);
            });

            // Check which endpoints are unused
            const unusedSet = new Set(report.unused_endpoints.filter(e => e.service === serviceName).map(e => `${e.method}:${e.path}`));

            list.innerHTML = '';

            if (uniqueEndpoints.length === 0) {
                list.innerHTML = '<div class="text-center py-10 text-slate-400 italic">No endpoints found for this service on this branch.</div>';
                return;
            }

            // Summary bar
            const summary = document.createElement('div');
            summary.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-2 flex items-center justify-between';
            const usedCount = uniqueEndpoints.filter(e => !unusedSet.has(`${e.method}:${e.path}`)).length;
            const unusedCount = uniqueEndpoints.length - usedCount;
            summary.innerHTML = `
                <div class="text-sm text-slate-600">
                    <span class="font-semibold text-slate-800">${uniqueEndpoints.length}</span> endpoints total &middot;
                    <span class="text-green-600 font-medium">${usedCount} used</span> &middot;
                    <span class="text-amber-600 font-medium">${unusedCount} unused</span>
                </div>
                <a href="/report/markdown?branch=${encodeURIComponent(branchName)}" target="_blank" class="text-xs bg-slate-800 text-white px-3 py-1.5 rounded-lg hover:bg-slate-700">Download Report</a>`;
            list.appendChild(summary);

            for (const ep of uniqueEndpoints) {
                const key = `${ep.method}:${ep.path}`;
                const isUnused = unusedSet.has(key);
                const clients = clientsMap[key] ? [...clientsMap[key]] : [];
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm endpoint-card cursor-pointer';
                card.onclick = () => showServiceEndpointYaml(serviceName, branchName, ep);
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <span class="px-2 py-1 rounded text-[10px] font-bold uppercase mr-3 ${getMethodColor(ep.method)}">
                                ${ep.method}
                            </span>
                            <span class="font-mono text-sm text-slate-700">${ep.path}</span>
                        </div>
                        <div class="flex items-center">
                            ${isUnused
                                ? '<span class="text-xs text-amber-600 bg-amber-50 px-2 py-1 rounded-full mr-2">unused</span>'
                                : `<span class="text-xs text-green-600 bg-green-50 px-2 py-1 rounded-full mr-2">${clients.length} client${clients.length !== 1 ? 's' : ''}</span>`}
                            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </div>`;
                list.appendChild(card);
            }
        } catch (err) {
            list.innerHTML = `<div class="text-red-500 text-center py-10">Error: ${err.message}</div>`;
        }
    }

    async function showServiceEndpointYaml(serviceName, branchName, ep) {
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modal-title').innerText = `${ep.method} ${ep.path} — ${serviceName} (${branchName})`;
        document.getElementById('md-report-btn').href = `/report/markdown?branch=${encodeURIComponent(branchName)}`;
        document.getElementById('md-report-btn').style.display = '';
        const content = document.getElementById('modal-content');
        content.innerHTML = '<div class="text-center py-10 text-slate-500">Loading YAML...</div>';

        try {
            const yamlText = await (async () => {
                const headers = {};
                const token = localStorage.getItem('sanshain_token');
                if (token) headers['Authorization'] = `Bearer ${token}`;
                const res = await fetch(`/require?clientname=_viewer&servicename=${encodeURIComponent(serviceName)}&branch=${encodeURIComponent(branchName)}&path=${encodeURIComponent(ep.path)}&method=${encodeURIComponent(ep.method)}`, {headers});
                if (!res.ok) throw new Error(`${res.status}`);
                return res.text();
            })();
            renderPaginatedYaml(content, yamlText);
        } catch (err) {
            content.innerHTML = `<div class="text-slate-500 text-center py-10">YAML preview not available (${err.message})</div>`;
        }
    }

    function renderPaginatedYaml(container, yamlText) {
        const lines = yamlText.split('\n');
        const totalPages = Math.max(1, Math.ceil(lines.length / YAML_PAGE_SIZE));
        let currentPage = 1;

        function render() {
            const start = (currentPage - 1) * YAML_PAGE_SIZE;
            const end = Math.min(start + YAML_PAGE_SIZE, lines.length);
            const pageLines = lines.slice(start, end);
            const escaped = pageLines.join('\n').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            let paginationHtml = '';
            if (totalPages > 1) {
                paginationHtml = `
                    <div class="flex items-center justify-between mt-4">
                        <button id="yaml-prev" class="px-3 py-1.5 rounded-lg text-sm font-medium ${currentPage <= 1 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700'}" ${currentPage <= 1 ? 'disabled' : ''}>← Previous</button>
                        <span class="text-sm text-slate-500">Page ${currentPage} of ${totalPages} &middot; Lines ${start + 1}–${end} of ${lines.length}</span>
                        <button id="yaml-next" class="px-3 py-1.5 rounded-lg text-sm font-medium ${currentPage >= totalPages ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700'}" ${currentPage >= totalPages ? 'disabled' : ''}>Next →</button>
                    </div>`;
            }

            container.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs text-slate-400">${lines.length} lines total</span>
                </div>
                <pre class="bg-slate-800 text-green-300 p-4 rounded-xl text-sm overflow-x-auto whitespace-pre-wrap leading-relaxed">${escaped}</pre>
                ${paginationHtml}`;

            if (totalPages > 1) {
                const prev = document.getElementById('yaml-prev');
                const next = document.getElementById('yaml-next');
                if (prev && currentPage > 1) prev.onclick = () => { currentPage--; render(); };
                if (next && currentPage < totalPages) next.onclick = () => { currentPage++; render(); };
            }
        }
        render();
    }

    function getMethodColor(m) {
        const colors = {
            'GET': 'bg-blue-100 text-blue-700',
            'POST': 'bg-green-100 text-green-700',
            'PUT': 'bg-amber-100 text-amber-700',
            'DELETE': 'bg-red-100 text-red-700',
            'PATCH': 'bg-purple-100 text-purple-700'
        };
        return colors[m.toUpperCase()] || 'bg-slate-100 text-slate-700';
    }

    let allClients = [];

    async function showClients() {
        document.getElementById('service-section').classList.add('hidden');
        document.getElementById('graph-section').classList.add('hidden');
        document.getElementById('client-section').classList.remove('hidden');

        const list = document.getElementById('clients-list');
        list.innerHTML = '<div class="text-center py-10 text-slate-500">Loading clients...</div>';

        try {
            const clients = await fetchJSON('/admin/clients');
            allClients = clients || [];
            document.getElementById('client-search').value = '';
            renderClientList(allClients);
        } catch (err) {
            list.innerHTML = `<div class="text-red-500 text-center py-10">Error: ${err.message}</div>`;
        }
    }

    function renderClientList(clients) {
        const list = document.getElementById('clients-list');
        if (!clients || clients.length === 0) {
            list.innerHTML = `
                <div class="bg-white p-10 rounded-2xl border-2 border-dashed border-slate-200 text-center">
                    <div class="text-slate-400 mb-4">
                        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-medium text-slate-900">No clients found</h3>
                    <p class="text-slate-500 mt-1">Clients will appear here once they request endpoints via GET /require.</p>
                </div>`;
            return;
        }
        list.innerHTML = '';
        for (const name of clients) {
            const card = document.createElement('div');
            card.className = 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm endpoint-card cursor-pointer';
            card.onclick = () => showClientBranches(name);
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <span class="bg-teal-100 text-teal-700 p-2 rounded-lg mr-3">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </span>
                        <h3 class="font-bold text-lg text-slate-800">${name}</h3>
                    </div>
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>`;
            list.appendChild(card);
        }
    }

    async function showClientBranches(clientName) {
        const list = document.getElementById('clients-list');
        list.innerHTML = '<div class="text-center py-10 text-slate-500">Loading branches...</div>';

        try {
            const branches = await fetchJSON(`/admin/clients/${encodeURIComponent(clientName)}/branches`);
            list.innerHTML = '';

            // Breadcrumb
            const breadcrumb = document.createElement('div');
            breadcrumb.className = 'flex items-center text-sm text-slate-500 mb-4';
            breadcrumb.innerHTML = `
                <button onclick="showClients()" class="hover:text-teal-600 font-medium">Clients</button>
                <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                <span class="text-slate-800 font-semibold">${clientName}</span>`;
            list.appendChild(breadcrumb);

            if (!branches || branches.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'text-center py-10 text-slate-400 italic';
                empty.textContent = 'No branches found for this client.';
                list.appendChild(empty);
                return;
            }

            for (const branch of branches) {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm endpoint-card cursor-pointer';
                card.onclick = () => showClientEndpoints(clientName, branch);
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <span class="bg-indigo-100 text-indigo-700 p-2 rounded-lg mr-3">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                </svg>
                            </span>
                            <h3 class="font-semibold text-slate-800">${branch}</h3>
                        </div>
                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>`;
                list.appendChild(card);
            }
        } catch (err) {
            list.innerHTML = `<div class="text-red-500 text-center py-10">Error: ${err.message}</div>`;
        }
    }

    async function showClientEndpoints(clientName, branch) {
        const list = document.getElementById('clients-list');
        list.innerHTML = '<div class="text-center py-10 text-slate-500">Loading endpoints...</div>';

        try {
            const endpoints = await fetchJSON(`/admin/clients/${encodeURIComponent(clientName)}/branches/${encodeURIComponent(branch)}/endpoints`);
            list.innerHTML = '';

            // Breadcrumb
            const breadcrumb = document.createElement('div');
            breadcrumb.className = 'flex items-center text-sm text-slate-500 mb-4';
            breadcrumb.innerHTML = `
                <button onclick="showClients()" class="hover:text-teal-600 font-medium">Clients</button>
                <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                <button onclick="showClientBranches('${clientName}')" class="hover:text-teal-600 font-medium">${clientName}</button>
                <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                <span class="text-slate-800 font-semibold">${branch}</span>`;
            list.appendChild(breadcrumb);

            if (!endpoints || endpoints.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'text-center py-10 text-slate-400 italic';
                empty.textContent = 'No endpoints found for this branch.';
                list.appendChild(empty);
                return;
            }

            for (const ep of endpoints) {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm endpoint-card' + (ep.yaml_content ? ' cursor-pointer' : '');
                if (ep.yaml_content) {
                    card.onclick = () => showClientYaml(clientName, branch, ep);
                }
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <span class="px-2 py-1 rounded text-[10px] font-bold uppercase mr-3 ${getMethodColor(ep.method)}">
                                ${ep.method}
                            </span>
                            <span class="font-mono text-sm text-slate-700">${ep.path}</span>
                            <span class="ml-3 text-xs text-slate-400">${ep.service}</span>
                        </div>
                        <div class="flex items-center">
                            ${ep.yaml_content
                                ? '<span class="text-xs text-green-600 bg-green-50 px-2 py-1 rounded-full mr-2">resolved</span>'
                                : '<span class="text-xs text-amber-600 bg-amber-50 px-2 py-1 rounded-full mr-2">pending</span>'}
                            ${ep.yaml_content ? '<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>' : ''}
                        </div>
                    </div>`;
                list.appendChild(card);
            }
        } catch (err) {
            list.innerHTML = `<div class="text-red-500 text-center py-10">Error: ${err.message}</div>`;
        }
    }

    function showClientYaml(clientName, branch, ep) {
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modal-title').innerText = `${ep.method} ${ep.path} — ${ep.service} (${branch})`;
        document.getElementById('md-report-btn').href = '#';
        document.getElementById('md-report-btn').style.display = 'none';
        const content = document.getElementById('modal-content');
        renderPaginatedYaml(content, ep.yaml_content);
    }

    document.getElementById('client-search').addEventListener('input', function() {
        const q = this.value.toLowerCase();
        if (!q) {
            renderClientList(allClients);
            return;
        }
        renderClientList(allClients.filter(name => name.toLowerCase().includes(q)));
    });

    async function showGraph() {
        document.getElementById('service-section').classList.add('hidden');
        document.getElementById('client-section').classList.add('hidden');
        document.getElementById('graph-section').classList.remove('hidden');

        const graphDiv = document.getElementById('mermaid-graph');
        graphDiv.innerHTML = '<div class="py-10 text-slate-500 italic">Generating dependency graph...</div>';

        try {
            const report = await fetchJSON('/report?branch=main');
            if (report.dependency_graph.length === 0) {
                graphDiv.innerHTML = '<div class="py-10 text-slate-500 italic">No dependencies found to visualize.</div>';
                return;
            }

            let mmd = 'graph LR\n';
            mmd += '  subgraph Clients\n';
            const clients = [...new Set(report.dependency_graph.map(d => d.client))];
            clients.forEach(c => mmd += `    ${c}([${c}])\n`);
            mmd += '  end\n';

            mmd += '  subgraph Services\n';
            const services = [...new Set(report.dependency_graph.map(d => d.service))];
            services.forEach(s => mmd += `    ${s}[[${s}]]\n`);
            mmd += '  end\n';

            const edges = new Set();
            report.dependency_graph.forEach(d => {
                const edge = `  ${d.client} --> ${d.service}`;
                edges.add(edge);
            });

            mmd += Array.from(edges).join('\n');

            // Clear and render
            graphDiv.removeAttribute('data-processed');
            graphDiv.innerHTML = mmd;
            await mermaid.run({
                nodes: [graphDiv]
            });
        } catch (err) {
            graphDiv.innerHTML = `<div class="text-red-500 p-4">Error generating graph: ${err.message}</div>`;
        }
    }

    function closeModal() {
        document.getElementById('modal').classList.add('hidden');
        document.getElementById('md-report-btn').style.display = '';
    }

    loadServices();
</script>
</body>
</html>
