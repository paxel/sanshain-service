# Applied migrations: sqlx checks their checksums, so changing one breaks every database
# that already ran it. The whole-table UPDATEs are deliberate backfills.
[[IgnoredAlerts]]
tool = "SonarQube Cloud"
rule = "plsql:DeleteOrUpdateWithoutWhereCheck"
path = "src/infrastructure/migrations/postgres/20240624000000_add_semver_to_spec_versions.sql"
ignoreUntil = 2027-02-18
reason = """An applied migration: sqlx checks its checksum, so changing the file breaks every \
database that already ran it. The UPDATE without WHERE is a deliberate backfill of every row."""

