name: CodeQL

# CodeQL on every push, pull request and weekly, from paxel/gates: the Rust service, the page
# and site scripts (JavaScript) and, always, the workflows. What is kept out of the analysis
# stands in .github/codeql.yml. The alerts show under Security > Code scanning; the release
# gate and the weekly Security run fail on each one that code-scanning-ignores.toml does not
# accept. Settings > Code security > Code scanning > Default setup stays off: it cannot run
# beside this workflow.
on:
  push:
    branches: [summer]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    uses: paxel/gates/.github/workflows/codeql.yml@e5e253a7caff277f039fb31a3e6be1479682dcc4 # v1.2.0
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["rust","javascript-typescript"]'
      config-file: .github/codeql.yml
