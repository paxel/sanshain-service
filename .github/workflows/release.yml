name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-binary:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanshain-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/sanshain_service

  release:
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          cp binaries/sanshain-linux-x86_64/sanshain_service release-assets/sanshain-linux-x86_64
          cp binaries/sanshain-linux-aarch64/sanshain_service release-assets/sanshain-linux-aarch64
          chmod +x release-assets/sanshain-linux-x86_64 release-assets/sanshain-linux-aarch64

          # Prepare docker-compose.yaml from template (substitute version)
          sed 's|__VERSION__|${{ env.RELEASE_TAG }}|g' docker-compose.release.template.yaml > release-assets/docker-compose.yaml

          cp Dockerfile.release.template release-assets/Dockerfile
          cp CHANGELOG.md release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sanshain ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG.md
          files: |
            release-assets/sanshain-linux-x86_64
            release-assets/sanshain-linux-aarch64
            release-assets/Dockerfile
            release-assets/docker-compose.yaml
            release-assets/CHANGELOG.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Prepare Docker build context
        run: |
          mkdir -p docker-context
          cp Dockerfile.release.template docker-context/Dockerfile
          # Rename to Docker's TARGETARCH convention (amd64/arm64) for Dockerfile COPY
          cp binaries/sanshain-linux-x86_64/sanshain_service docker-context/sanshain-amd64
          cp binaries/sanshain-linux-aarch64/sanshain_service docker-context/sanshain-arm64
          cp -r static docker-context/static
          cp -r src/infrastructure/migrations docker-context/migrations

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
