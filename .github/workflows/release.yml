name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  build-binary:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.arch }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.arch }}-release-

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Configure cross-compilation for aarch64
        if: matrix.arch == 'aarch64'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanshain-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/sanshain_service_bin

  release:
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          cp binaries/sanshain-linux-x86_64/sanshain_service_bin release-assets/sanshain-linux-x86_64
          cp binaries/sanshain-linux-aarch64/sanshain_service_bin release-assets/sanshain-linux-aarch64
          chmod +x release-assets/sanshain-linux-x86_64 release-assets/sanshain-linux-aarch64

          # Prepare docker-compose.yaml from template (substitute version)
          sed 's|__VERSION__|${{ github.event.inputs.tag }}|g' docker-compose.release.template.yaml > release-assets/docker-compose.yaml

          cp Dockerfile.release.template release-assets/Dockerfile
          cp CHANGELOG.md release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Sanshain ${{ github.event.inputs.tag }}
          body_path: CHANGELOG.md
          files: |
            release-assets/sanshain-linux-x86_64
            release-assets/sanshain-linux-aarch64
            release-assets/Dockerfile
            release-assets/docker-compose.yaml
            release-assets/CHANGELOG.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }}
            type=raw,value=latest

      - name: Prepare Docker build context
        run: |
          mkdir -p docker-context
          cp Dockerfile.release.template docker-context/Dockerfile
          # Rename to Docker's TARGETARCH convention (amd64/arm64) for Dockerfile COPY
          cp binaries/sanshain-linux-x86_64/sanshain_service_bin docker-context/sanshain-amd64
          cp binaries/sanshain-linux-aarch64/sanshain_service_bin docker-context/sanshain-arm64
          cp -r static docker-context/static

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
