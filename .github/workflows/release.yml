name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-binary:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate PRs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanshain-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/sanshain_service

  release:
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read
      id-token: write # keyless cosign signing through GitHub's OIDC identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # sbom-action writes output-file without creating its directory.
      - name: Create the SBOM directory
        run: mkdir -p sboms

      # Runs before the binaries and the docker context land in the workspace, so the SBOM
      # covers the source tree only (Cargo.lock and package-lock.json: what the binaries contain).
      - name: Generate the source SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sboms/sanshain-service-${{ env.RELEASE_TAG }}-source.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: binaries

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          cp binaries/sanshain-linux-x86_64/sanshain_service release-assets/sanshain-linux-x86_64
          cp binaries/sanshain-linux-aarch64/sanshain_service release-assets/sanshain-linux-aarch64
          chmod +x release-assets/sanshain-linux-x86_64 release-assets/sanshain-linux-aarch64

          # Prepare docker-compose.yaml from template (substitute version)
          sed 's|__VERSION__|${{ env.RELEASE_TAG }}|g' docker-compose.release.template.yaml > release-assets/docker-compose.yaml

          cp Dockerfile.release.template release-assets/Dockerfile
          cp CHANGELOG.md release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sanshain ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG.md
          files: |
            release-assets/sanshain-linux-x86_64
            release-assets/sanshain-linux-aarch64
            release-assets/Dockerfile
            release-assets/docker-compose.yaml
            release-assets/CHANGELOG.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Prepare Docker build context
        run: |
          mkdir -p docker-context
          cp Dockerfile.release.template docker-context/Dockerfile
          # Rename to Docker's TARGETARCH convention (amd64/arm64) for Dockerfile COPY
          cp binaries/sanshain-linux-x86_64/sanshain_service docker-context/sanshain-amd64
          cp binaries/sanshain-linux-aarch64/sanshain_service docker-context/sanshain-arm64
          cp -r static docker-context/static
          cp -r src/infrastructure/migrations docker-context/migrations

      - name: Build and push multi-platform Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Everything below addresses the pushed image by digest, never by a mutable tag.
      - name: Generate the image SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: sboms/sanshain-service-${{ env.RELEASE_TAG }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attach the image SBOM as a cosign attestation
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate "sboms/sanshain-service-${RELEASE_TAG}.cdx.json" \
            "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Sign the image (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Upload the SBOMs to the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # A release without its SBOM assets is a failed release, not a quiet one.
          fail_on_unmatched_files: true
          files: |
            sboms/sanshain-service-${{ env.RELEASE_TAG }}.cdx.json
            sboms/sanshain-service-${{ env.RELEASE_TAG }}-source.cdx.json
