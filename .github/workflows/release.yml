name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary (Linux x86_64)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare release assets
        run: |
          mkdir -p release-assets/docker-context
          cp target/x86_64-unknown-linux-gnu/release/sanshain_service_bin release-assets/sanshain-linux-amd64

          # Prepare Dockerfile from template (copy binary into image)
          cp Dockerfile.release.template release-assets/docker-context/Dockerfile
          cp release-assets/sanshain-linux-amd64 release-assets/docker-context/sanshain-linux-amd64
          cp -r static release-assets/docker-context/static

          # Prepare docker-compose.yaml from template (substitute version)
          sed 's|__VERSION__|${{ github.event.inputs.tag }}|g' docker-compose.release.template.yaml > release-assets/docker-compose.yaml

          # Include Dockerfile and CHANGELOG in release assets
          cp release-assets/docker-context/Dockerfile release-assets/Dockerfile
          cp CHANGELOG.md release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Sanshain ${{ github.event.inputs.tag }}
          body_path: CHANGELOG.md
          files: |
            release-assets/sanshain-linux-amd64
            release-assets/Dockerfile
            release-assets/docker-compose.yaml
            release-assets/CHANGELOG.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: release-assets/docker-context
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
