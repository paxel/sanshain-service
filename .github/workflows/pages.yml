name: Pages

# Builds the documentation site (site/ -> site-dist/) on every push to summer,
# every pull request and every release tag; deploys it to GitHub Pages only
# for release tags, so the published docs match the released version.
#
# One-time manual steps for the repository owner:
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. Settings -> Environments -> github-pages -> Deployment branches and tags:
#      allow tags matching "v*" (the deploy job runs only on those).

on:
  push:
    branches: [summer]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install lint tooling
        run: npm ci

      - name: Lint site sources
        run: |
          npx eslint scripts/build-site.js scripts/site site/assets/site.js tests/site
          npx prettier --check scripts/build-site.js scripts/site site/assets/site.js site/assets/site.css tests/site

      - name: Build site
        run: node scripts/build-site.js --base "/${{ github.event.repository.name }}/"

      - name: Test site build
        run: npm run site:test

      - name: Check that the tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version ($expected); the site would describe the wrong release"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
