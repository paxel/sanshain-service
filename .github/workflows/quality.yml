name: Quality
on:
  # Pushes only to summer, which takes nothing but PR merges. Every other branch
  # is tested by its PR run, which tests the merge of the branch into its base:
  # with up-to-date branches required, that is the tree the merge puts on
  # summer. Summer's run after the merge feeds the Sonar job and the badges.
  push:
    branches: [summer]
  pull_request:
    branches: ["**"]
# A newer push or PR update cancels the older run of the same branch. The
# group names the bare branch: head_ref is bare on PR events, ref_name (not
# ref, which is refs/heads/…) on pushes.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
# The token only reads the code: no job writes to the repository.
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate PRs.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      # Testcontainers tests pull this image on demand; concurrent in-test pulls
      # are flaky ("bytes remaining on stream"), so fetch it once up front.
      # Tag must match the testcontainers-modules default (see Cargo.toml).
      - name: Pre-pull testcontainers images
        run: for i in 1 2 3; do docker pull postgres:11-alpine && break || sleep 5; done
      - name: Tests
        run: cargo test
      - name: Integration Tests
        run: |
          export INITIAL_ADMIN_PASSWORD=root_password
          export INITIAL_AUTH_MODE=local
          cargo build --locked
          cargo run &
          PID=$!
          trap "kill $PID || true" EXIT
          # Wait for service to be ready
          READY=0
          for i in {1..60}; do
            if curl -s http://localhost:3000/health | grep -q "OK"; then
              echo "Service is up!"
              READY=1
              break
            fi
            echo "Waiting for service... ($i)"
            sleep 2
          done
          if [ $READY -eq 0 ]; then
            echo "Service failed to start"
            exit 1
          fi
          ./scripts/itest.sh http://localhost:3000 root_password
        env:
          INITIAL_ADMIN_PASSWORD: root_password
          INITIAL_AUTH_MODE: local
      - name: Install tools
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit,cargo-tarpaulin
      - name: Security Audit
        run: cargo audit
      # Ratchet rule (see AGENTS.md): when coverage rises, raise --fail-under to
      # (new value - 2) in the same PR. Never lower it. Floor set 2026-08-13 at
      # 81.03% measured with --engine llvm.
      # The LCOV file is for the sonar job below, which downloads it.
      - name: Coverage
        run: cargo tarpaulin --out Xml --out Lcov --fail-under 79.03
      - name: Upload the coverage for SonarQube Cloud
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 7
  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24 as in the Pages workflow; the site tests' coverage flags need 22.5 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/eslint static/js/
      - run: ./node_modules/.bin/prettier --check static/js/
      # The Tailwind CSS is a committed artifact (prod serves static/ directly);
      # fail if it drifts from source.
      - run: npm run build:css && git diff --exit-code static/css/app.css
      # The site build's tests, here for their coverage of scripts/ (the sonar job
      # downloads it); the Pages workflow runs them for the deploy.
      - name: Site tests with coverage
        run: >-
          node --test --experimental-test-coverage --test-coverage-include='scripts/**'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=site-lcov.info
          tests/site/*.test.js
      - name: Upload the site coverage for SonarQube Cloud
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-site
          path: site-lcov.info
          if-no-files-found: ignore
          retention-days: 7
  ui-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate PRs.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
      - run: npm ci --ignore-scripts
      # Without --with-deps: the runner image has Chrome's system libraries already,
      # and the apt install of them failed the job whenever the Ubuntu mirrors
      # could not be reached.
      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install chromium
      - name: Build service
        run: cargo build --locked
      - name: UI Smoke Tests
        run: |
          cargo run &
          PID=$!
          trap "kill $PID || true" EXIT
          # Wait for service to be ready (mirrors rust-quality)
          READY=0
          for i in {1..60}; do
            if curl -s http://localhost:3000/health | grep -q "OK"; then
              echo "Service is up!"
              READY=1
              break
            fi
            echo "Waiting for service... ($i)"
            sleep 2
          done
          if [ $READY -eq 0 ]; then
            echo "Service failed to start"
            exit 1
          fi
          ./node_modules/.bin/playwright test tests/ui/smoke.test.js tests/ui/no_console_errors.test.js tests/ui/de_inlined.test.js tests/ui/link_crawl.test.js tests/ui/permissions.test.js tests/ui/structure.test.js tests/ui/endpoint_filter.test.js tests/ui/sign_in.test.js tests/ui/service_account.test.js tests/ui/graph_layout.test.js tests/ui/graph_timeline.test.js tests/ui/site_chrome.test.js tests/ui/observability_logs.test.js
        env:
          INITIAL_ADMIN_PASSWORD: root_password
          INITIAL_AUTH_MODE: local
          # Page-script coverage for SonarQube Cloud (tests/ui/coverage.js).
          UI_COVERAGE: "1"
      - name: Upload the page-script coverage for SonarQube Cloud
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ui
          path: build/ui-coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  # SonarQube Cloud analysis of summer; the free plan analyses the main branch
  # only. Report only: the quality gate shows on
  # https://sonarcloud.io/summary/new_code?id=paxel_sanshain-service and fails no
  # build. What is analysed is in sonar-project.properties.
  #
  # Only pushes to summer run it, so the token never meets code from a pull
  # request, and it analyses the commit this run checked out. It runs after the
  # three jobs above, also when one failed, and takes their LCOV files from this
  # run; a job that left none leaves the scan without that coverage.
  #
  # One-time setup: the project paxel_sanshain-service on SonarQube Cloud with
  # Automatic Analysis off, and the repository secret SQ_TOKEN.
  sonar:
    name: SonarQube Cloud analysis
    needs: [rust-quality, js-quality, ui-quality]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/summer' }}
    runs-on: ubuntu-latest
    steps:
      # The full history for the blame and the new-code period.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate PRs.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy report for the analyzer
        run: |
          mkdir -p build
          cargo clippy --all-targets --locked --message-format=json > build/clippy-report.json
      - name: Rust coverage from rust-quality
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: build
      - name: Page-script coverage from ui-quality
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-ui
          path: build/ui
      - name: Site-script coverage from js-quality
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-site
          path: build/site
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SQ_TOKEN }}
