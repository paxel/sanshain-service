name: Quality
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
# A push to a branch with an open PR fires both triggers and runs the whole
# 45-minute suite twice. The group must name the bare branch on both events:
# head_ref is bare on PR events, and ref_name (not ref, which is refs/heads/…)
# is bare on pushes — with `ref` the twins would land in different groups and
# nothing would be deduplicated. The loser is cancelled instead of burning a
# duplicate, and a newer push likewise supersedes a stale in-flight run.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
# The token only reads the code: no job writes to the repository.
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate PRs.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      # Testcontainers tests pull this image on demand; concurrent in-test pulls
      # are flaky ("bytes remaining on stream"), so fetch it once up front.
      # Tag must match the testcontainers-modules default (see Cargo.toml).
      - name: Pre-pull testcontainers images
        run: for i in 1 2 3; do docker pull postgres:11-alpine && break || sleep 5; done
      - name: Tests
        run: cargo test
      - name: Integration Tests
        run: |
          export INITIAL_ADMIN_PASSWORD=root_password
          export INITIAL_AUTH_MODE=local
          cargo build --locked
          cargo run &
          PID=$!
          trap "kill $PID || true" EXIT
          # Wait for service to be ready
          READY=0
          for i in {1..60}; do
            if curl -s http://localhost:3000/health | grep -q "OK"; then
              echo "Service is up!"
              READY=1
              break
            fi
            echo "Waiting for service... ($i)"
            sleep 2
          done
          if [ $READY -eq 0 ]; then
            echo "Service failed to start"
            exit 1
          fi
          ./scripts/itest.sh http://localhost:3000 root_password
        env:
          INITIAL_ADMIN_PASSWORD: root_password
          INITIAL_AUTH_MODE: local
      - name: Install tools
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit,cargo-tarpaulin
      - name: Security Audit
        run: cargo audit
      # Ratchet rule (see AGENTS.md): when coverage rises, raise --fail-under to
      # (new value - 2) in the same PR. Never lower it. Floor set 2026-08-13 at
      # 81.03% measured with --engine llvm.
      # The LCOV file is for the SonarQube Cloud workflow (sonar.yml), which downloads it.
      - name: Coverage
        run: cargo tarpaulin --out Xml --out Lcov --fail-under 79.03
      - name: Upload the coverage for SonarQube Cloud
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 7
  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24 as in the Pages workflow; the site tests' coverage flags need 22.5 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/eslint static/js/
      - run: ./node_modules/.bin/prettier --check static/js/
      # The Tailwind CSS is a committed artifact (prod serves static/ directly);
      # fail if it drifts from source.
      - run: npm run build:css && git diff --exit-code static/css/app.css
      # The site build's tests, here for their coverage of scripts/ (sonar.yml
      # downloads it); the Pages workflow runs them for the deploy.
      - name: Site tests with coverage
        run: >-
          node --test --experimental-test-coverage --test-coverage-include='scripts/**'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=site-lcov.info
          tests/site/*.test.js
      - name: Upload the site coverage for SonarQube Cloud
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-site
          path: site-lcov.info
          if-no-files-found: ignore
          retention-days: 7
  ui-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate PRs.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build service
        run: cargo build --locked
      - name: UI Smoke Tests
        run: |
          cargo run &
          PID=$!
          trap "kill $PID || true" EXIT
          # Wait for service to be ready (mirrors rust-quality)
          READY=0
          for i in {1..60}; do
            if curl -s http://localhost:3000/health | grep -q "OK"; then
              echo "Service is up!"
              READY=1
              break
            fi
            echo "Waiting for service... ($i)"
            sleep 2
          done
          if [ $READY -eq 0 ]; then
            echo "Service failed to start"
            exit 1
          fi
          ./node_modules/.bin/playwright test tests/ui/smoke.test.js tests/ui/no_console_errors.test.js tests/ui/de_inlined.test.js tests/ui/link_crawl.test.js tests/ui/permissions.test.js tests/ui/structure.test.js tests/ui/endpoint_filter.test.js tests/ui/sign_in.test.js tests/ui/service_account.test.js tests/ui/graph_layout.test.js tests/ui/graph_timeline.test.js tests/ui/site_chrome.test.js tests/ui/observability_logs.test.js
        env:
          INITIAL_ADMIN_PASSWORD: root_password
          INITIAL_AUTH_MODE: local
          # Page-script coverage for SonarQube Cloud (tests/ui/coverage.js).
          UI_COVERAGE: "1"
      - name: Upload the page-script coverage for SonarQube Cloud
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ui
          path: build/ui-coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
