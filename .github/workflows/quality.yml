name: Quality
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free up space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Tests
        run: cargo test
      - name: Integration Tests
        run: |
          export INITIAL_ADMIN_PASSWORD=root_password
          cargo build
          cargo run &
          PID=$!
          trap "kill $PID || true" EXIT
          # Wait for service to be ready
          READY=0
          for i in {1..60}; do
            if curl -s http://localhost:3000/health | grep -q "OK"; then
              echo "Service is up!"
              READY=1
              break
            fi
            echo "Waiting for service... ($i)"
            sleep 2
          done
          if [ $READY -eq 0 ]; then
            echo "Service failed to start"
            exit 1
          fi
          ./scripts/itest.sh http://localhost:3000 root_password
        env:
          INITIAL_ADMIN_PASSWORD: root_password
      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-tarpaulin
      - name: Security Audit
        run: cargo audit
      - name: Coverage
        run: cargo tarpaulin --out Xml --skip-clean
  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npx eslint static/js/
      - run: npx prettier --check static/js/
  ui-tests:
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Free up space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright and Dependencies
        run: |
          sudo apt-get purge -y needrestart
          echo "Disk space before installation:"
          df -h /
          # Using DEBUG=pw:install to get more info if it hangs
          DEBUG=pw:install npx playwright install --with-deps chromium
          echo "Disk space after installation:"
          df -h /
      - name: Run UI Tests
        run: |
          export INITIAL_ADMIN_PASSWORD=root_password
          cargo build
          cargo run &
          PID=$!
          trap "kill $PID || true" EXIT
          # Wait for service to be ready
          READY=0
          for i in {1..60}; do
            if curl -s http://localhost:3000/health | grep -q "OK"; then
              echo "Service is up!"
              READY=1
              break
            fi
            echo "Waiting for service... ($i)"
            sleep 2
          done
          if [ $READY -eq 0 ]; then
            echo "Service failed to start"
            exit 1
          fi
          npm run test:ui
        env:
          INITIAL_ADMIN_PASSWORD: root_password
