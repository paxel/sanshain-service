name: Quality
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Tests
        run: cargo test
      - name: Integration Tests
        run: |
          export INITIAL_ADMIN_PASSWORD=root_password
          cargo build
          cargo run &
          PID=$!
          trap "kill $PID || true" EXIT
          # Wait for service to be ready
          READY=0
          for i in {1..60}; do
            if curl -s http://localhost:3000/health | grep -q "OK"; then
              echo "Service is up!"
              READY=1
              break
            fi
            echo "Waiting for service... ($i)"
            sleep 2
          done
          if [ $READY -eq 0 ]; then
            echo "Service failed to start"
            exit 1
          fi
          ./scripts/itest.sh http://localhost:3000 root_password
        env:
          INITIAL_ADMIN_PASSWORD: root_password
      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-tarpaulin
      - name: Security Audit
        run: cargo audit
      - name: Coverage
        run: cargo tarpaulin --out Xml --skip-clean
  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npx eslint static/js/
      - run: npx prettier --check static/js/
  ui-tests:
    # Diagnostic variants isolate Playwright archive extraction failures caused by Node LTS or runner image drift.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: moving-target
            runner: ubuntu-latest
            node-version: lts/*
          - variant: node-24
            runner: ubuntu-latest
            node-version: 24
          - variant: ubuntu-22.04
            runner: ubuntu-22.04
            node-version: lts/*
    runs-on: ${{ matrix.runner }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install npm dependencies
        run: npm ci
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-diagnostic-v1-${{ matrix.variant }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-diagnostic-v1-${{ matrix.variant }}-
      - name: Print Playwright Install Environment
        run: |
          echo "Diagnostic variant: ${{ matrix.variant }}"
          echo "Configured runner: ${{ matrix.runner }}"
          echo "Configured Node version: ${{ matrix.node-version }}"
          echo "Node version:"
          node -v
          echo "npm version:"
          npm -v
          echo "Playwright version:"
          npx playwright --version
          echo "Runner context:"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          uname -a
          echo "Filesystem usage:"
          df -h /
          df -h /tmp || true
          df -h "${RUNNER_TEMP}" || true
          echo "Inode usage:"
          df -ih /
          df -ih /tmp || true
          df -ih "${RUNNER_TEMP}" || true
          echo "Playwright cache contents:"
          du -sh ~/.cache/ms-playwright || true
          ls -la ~/.cache/ms-playwright || true
      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          sudo apt-get purge -y needrestart
          echo "Disk space before dependency installation:"
          df -h /
          df -h /tmp || true
          df -h "${RUNNER_TEMP}" || true
          npx playwright install-deps chromium
          echo "Disk space after dependency installation:"
          df -h /
          df -h /tmp || true
          df -h "${RUNNER_TEMP}" || true
      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        env:
          DEBUG: pw:install
        run: |
          echo "Disk space before browser installation:"
          df -h /
          df -h /tmp || true
          df -h "${RUNNER_TEMP}" || true
          npx playwright install chromium
          echo "Disk space after browser installation:"
          df -h /
          df -h /tmp || true
          df -h "${RUNNER_TEMP}" || true
      - name: Install Playwright System Dependencies Only (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: |
          sudo apt-get purge -y needrestart
          echo "Disk space before dependency installation:"
          df -h /
          df -h /tmp || true
          df -h "${RUNNER_TEMP}" || true
          npx playwright install-deps chromium
          echo "Disk space after dependency installation:"
          df -h /
          df -h /tmp || true
          df -h "${RUNNER_TEMP}" || true
      - name: Run UI Tests
        run: |
          export INITIAL_ADMIN_PASSWORD=root_password
          cargo build
          cargo run &
          PID=$!
          trap "kill $PID || true" EXIT
          # Wait for service to be ready
          READY=0
          for i in {1..60}; do
            if curl -s http://localhost:3000/health | grep -q "OK"; then
              echo "Service is up!"
              READY=1
              break
            fi
            echo "Waiting for service... ($i)"
            sleep 2
          done
          if [ $READY -eq 0 ]; then
            echo "Service failed to start"
            exit 1
          fi
          npm run test:ui
        env:
          INITIAL_ADMIN_PASSWORD: root_password
