name: Fuzz

# The fuzz targets in fuzz/ (cargo-fuzz, libFuzzer), weekly and by hand, from paxel/gates: the
# parsers that read what outside systems send, which are OpenAPI, AsyncAPI and proto provides,
# catalog pushes (Backstage catalog-info) and a Product's pasted Helm Chart.yaml. Three
# minutes per parser; see fuzz/README.md. The saved crashes in fuzz/regressions/<target> are
# replayed first, so a fixed crash that comes back fails at once. A new crash fails the job
# and is kept as an artifact.
#
# cargo-fuzz needs nightly compiler flags. The shared workflow gives them to the pinned stable
# toolchain through RUSTC_BOOTSTRAP=1, so the code is fuzzed with the compiler that builds the
# release.
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: paxel/gates/.github/workflows/fuzz.yml@385f7ac316aef261a56e46bfc1e3553fa2efaccd # v1.4.0
    with:
      stack: rust
      targets: |
        openapi
        asyncapi
        proto
        backstage
        helm
      seconds: 180
      # Unoptimised: the optimised sanitizer build of the service crate needs more memory
      # than a 16 GB runner has (it was killed on a 15 GB machine); a few minutes of slower
      # fuzzing is the better trade.
      rust-dev: true
