name: Security

# Weekly, and by hand: the release gate without a version, strict. It fails on every open
# code-scanning or secret-scanning alert that code-scanning-ignores.toml does not accept, on a
# known vulnerability, on an unmaintained dependency and on a licence outside the allowlist,
# and when an accepted finding's date has passed: that is the review.
#
# The image scan beside it is the service's own (docs/adr/0012-move-to-gates.md): it fails
# when the latest released image carries a fixable high or critical CVE in its OS packages,
# which no scan of the source finds.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: paxel/gates/.github/workflows/release-gate.yml@66ed2d3a448a5f6bfa1794809b330eb9fbee01ba # v1.2.0
    permissions:
      contents: read
      security-events: read
    with:
      strict: true
    secrets:
      alerts-token: ${{ secrets.GATES_ALERTS_TOKEN }}

  image-scan:
    name: Vulnerable image packages (grype)
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve the latest release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: echo "tag=$(gh release view --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      # Scans the image users run (pulled from the registry), not a rebuild. Fails only on
      # high/critical findings that have a fix.
      - name: grype
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.latest.outputs.tag }}
          output-format: json
          severity-cutoff: high
          only-fixed: true
          fail-build: true

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-report-${{ steps.latest.outputs.tag }}
          path: ${{ steps.grype.outputs.json }}

      # Full picture for the record: every finding, unfixed ones included, never failing.
      - name: grype (all findings)
        id: grype-all
        if: always()
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.latest.outputs.tag }}
          output-format: json
          only-fixed: false
          fail-build: false

      - name: Upload the full scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-report-${{ steps.latest.outputs.tag }}-all
          path: ${{ steps.grype-all.outputs.json }}
