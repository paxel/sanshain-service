# Fails only when a dependency has a known vulnerability (RustSec and npm advisories) or the latest
# released image carries a fixable high/critical CVE in its OS packages (grype). Runs weekly and
# on demand, because new advisories appear without any change in this repo.
# The two source audits also run in CI on every push and pull request (ci.yml, same job names).
# Warnings such as unmaintained or yanked packages are reported but never fail it.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Vulnerable crates (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  npm-audit:
    name: Vulnerable npm packages (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: npm audit
        run: npm audit

  image-scan:
    name: Vulnerable image packages (grype)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the latest release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: echo "tag=$(gh release view --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      # Scans the image users run (pulled from the registry), not a rebuild. Fails only on
      # high/critical findings that have a fix, consistent with the source audits above.
      - name: grype
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.latest.outputs.tag }}
          output-format: json
          severity-cutoff: high
          only-fixed: true
          fail-build: true

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-report-${{ steps.latest.outputs.tag }}
          path: ${{ steps.grype.outputs.json }}

      # Full picture for the record: every finding, unfixed ones included, never failing.
      - name: grype (all findings)
        id: grype-all
        if: always()
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.latest.outputs.tag }}
          output-format: json
          only-fixed: false
          fail-build: false

      - name: Upload the full scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-report-${{ steps.latest.outputs.tag }}-all
          path: ${{ steps.grype-all.outputs.json }}
