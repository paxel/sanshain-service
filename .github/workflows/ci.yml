name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# A push to a branch with an open PR fires both triggers and runs everything
# twice. The group must name the bare branch on both events: head_ref is bare
# on PR events, and ref_name (not ref, which is refs/heads/…) is bare on
# pushes — with `ref` the twins would land in different groups and nothing
# would be deduplicated. The loser is cancelled instead of burning a second
# full run, and a newer push likewise supersedes a stale in-flight one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate PRs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --verbose

      # Testcontainers tests pull this image on demand; concurrent in-test pulls
      # are flaky ("bytes remaining on stream"), so fetch it once up front.
      # Tag must match the testcontainers-modules default (see Cargo.toml).
      - name: Pre-pull testcontainers images
        run: for i in 1 2 3; do docker pull postgres:11-alpine && break || sleep 5; done

      - name: Run tests
        run: cargo test --verbose
