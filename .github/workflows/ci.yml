name: CI

# The service's gates. The standard's part comes from paxel/gates: the OSV gate, the Rust gate
# (format, lint set, clippy, tests, coverage ratchet), the TypeScript gate for the JavaScript
# (prettier, eslint, tsc, the site tests, coverage ratchet) and SonarQube Cloud. The run
# against a started service, the stylesheet check and the UI tests are the service's own
# (docs/adr/0012-move-to-gates.md).
# A branch gets its run through its pull request; a run per push as well would be the same
# jobs twice, and SonarQube Cloud analyses only the default branch and pull requests.
on:
  push:
    branches: [summer]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Known vulnerabilities and licences of every dependency in Cargo.lock, fuzz/Cargo.lock and
  # package-lock.json: osv-scanner decided by gates' osv_gate.py. What is accepted stands in
  # the osv-scanner.toml beside each lockfile.
  vulns:
    uses: paxel/gates/.github/workflows/vulns.yml@385f7ac316aef261a56e46bfc1e3553fa2efaccd # v1.4.0

  rust:
    uses: paxel/gates/.github/workflows/rust.yml@385f7ac316aef261a56e46bfc1e3553fa2efaccd # v1.4.0
    with:
      # The PostgreSQL tests start their database through testcontainers; the script pulls
      # the image once before the test binaries ask for it at the same moment.
      test-wrapper: scripts/ci-test.sh
      # Every test target takes part: the unit tests in src/ and all of tests/, the
      # PostgreSQL tests included. What is measured and what is left out stands in
      # coverage-floors.toml.
      coverage: rust --workspace

  # The JavaScript is plain JavaScript, type-checked by tsc (checkJs). The part is named
  # site: the gate's tests are the site tests, which measure the site build in scripts/.
  ts:
    uses: paxel/gates/.github/workflows/ts.yml@385f7ac316aef261a56e46bfc1e3553fa2efaccd # v1.4.0
    with:
      packages: site .

  # scripts/itest.sh speaks to a started service over HTTP, as a Producer's and a Consumer's
  # build would: the one check of the binary as it runs, with its migrations and its router.
  integration:
    name: Integration tests against a started service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The debug build of the service and its dependencies takes several gigabytes; the
      # SDKs the runner image carries and this job never uses go first.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      # rust-toolchain.toml is the only source of the version; rustup installs it.
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the service
        run: cargo build --locked
      - name: Integration tests
        env:
          INITIAL_ADMIN_PASSWORD: root_password
          INITIAL_AUTH_MODE: local
        run: |
          cargo run --locked &
          PID=$!
          trap 'kill $PID || true' EXIT
          READY=0
          for i in {1..60}; do
            if curl -s http://localhost:3000/health | grep -q "OK"; then
              echo "Service is up!"
              READY=1
              break
            fi
            echo "Waiting for service... ($i)"
            sleep 2
          done
          if [ "$READY" -eq 0 ]; then
            echo "Service failed to start"
            exit 1
          fi
          ./scripts/itest.sh http://localhost:3000 root_password

  # The Tailwind CSS is a committed artifact (the service serves static/ as it is); the build
  # must not differ from what is committed.
  stylesheet:
    name: Committed stylesheet is the built one
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:css && git diff --exit-code static/css/app.css

  # The Playwright tests drive the pages of a started service in Chromium. They also measure
  # the page scripts in static/js/ (UI_COVERAGE, tests/ui/coverage.js writes coverage/ui.lcov):
  # the ui part of coverage-floors.toml, which no shared gate can measure, so the ratchet
  # runs here.
  ui:
    name: UI tests and the ui coverage floor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The debug build of the service and its dependencies takes several gigabytes; the
      # SDKs the runner image carries and this job never uses go first.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Without --with-deps: the runner image has Chrome's system libraries already,
      # and the apt install of them failed the job whenever the Ubuntu mirrors
      # could not be reached.
      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install chromium
      - name: Build the service
        run: cargo build --locked
      - name: UI tests
        env:
          INITIAL_ADMIN_PASSWORD: root_password
          INITIAL_AUTH_MODE: local
          UI_COVERAGE: "1"
        run: |
          cargo run --locked &
          PID=$!
          trap 'kill $PID || true' EXIT
          READY=0
          for i in {1..60}; do
            if curl -s http://localhost:3000/health | grep -q "OK"; then
              echo "Service is up!"
              READY=1
              break
            fi
            echo "Waiting for service... ($i)"
            sleep 2
          done
          if [ "$READY" -eq 0 ]; then
            echo "Service failed to start"
            exit 1
          fi
          ./node_modules/.bin/playwright test tests/ui/smoke.test.js tests/ui/no_console_errors.test.js tests/ui/de_inlined.test.js tests/ui/link_crawl.test.js tests/ui/permissions.test.js tests/ui/structure.test.js tests/ui/endpoint_filter.test.js tests/ui/sign_in.test.js tests/ui/service_account.test.js tests/ui/graph_layout.test.js tests/ui/graph_timeline.test.js tests/ui/site_chrome.test.js tests/ui/observability_logs.test.js tests/ui/admin_controls.test.js tests/ui/features.test.js tests/ui/products.test.js tests/ui/report_and_tokens.test.js tests/ui/site_stepper.test.js tests/ui/account_forms.test.js tests/ui/admin_more.test.js tests/ui/yaml.test.js tests/ui/landing_validator.test.js tests/ui/producer_page.test.js tests/ui/remove_dependencies.test.js tests/ui/statistics.test.js tests/ui/version_moves.test.js
      # Before the floor check, so that a run under the floor still leaves its measurement.
      - name: Keep the coverage for SonarQube Cloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ui
          path: coverage/ui.lcov
          if-no-files-found: error
      - name: The ui part holds its floor
        uses: paxel/gates/actions/ratchet@385f7ac316aef261a56e46bfc1e3553fa2efaccd # v1.4.0
        with:
          parts: ui
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # After the three jobs that measure: it reads coverage/rust.lcov, coverage/site.lcov and
  # coverage/ui.lcov from their artifacts (sonar-project.properties).
  sonar:
    needs: [rust, ts, ui]
    uses: paxel/gates/.github/workflows/sonar.yml@385f7ac316aef261a56e46bfc1e3553fa2efaccd # v1.4.0
    secrets:
      sonar-token: ${{ secrets.SQ_TOKEN }}
