name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# A push to a branch with an open PR fires both triggers and runs everything
# twice. The group must name the bare branch on both events: head_ref is bare
# on PR events, and ref_name (not ref, which is refs/heads/…) is bare on
# pushes — with `ref` the twins would land in different groups and nothing
# would be deduplicated. The loser is cancelled instead of burning a second
# full run, and a newer push likewise supersedes a stale in-flight one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# The token only reads the code: no job writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate PRs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked --verbose

      # Testcontainers tests pull this image on demand; concurrent in-test pulls
      # are flaky ("bytes remaining on stream"), so fetch it once up front.
      # Tag must match the testcontainers-modules default (see Cargo.toml).
      - name: Pre-pull testcontainers images
        run: for i in 1 2 3; do docker pull postgres:11-alpine && break || sleep 5; done

      - name: Run tests
        run: cargo test --verbose

  # The same audits as the weekly Security workflow, with the same job names, so
  # a pull request that brings in a vulnerable dependency is stopped before the
  # merge. Ignores live in .cargo/audit.toml. The image scan stays weekly only:
  # it scans the released image, which a pull request does not change.
  cargo-audit:
    name: Vulnerable crates (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  npm-audit:
    name: Vulnerable npm packages (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: npm audit
        run: npm audit
