# SonarQube Cloud analysis of summer after each Quality run there; the free plan
# analyses the main branch only. Report only: the quality gate shows on
# https://sonarcloud.io/summary/new_code?id=paxel_sanshain-service and fails no
# build. What is analysed is in sonar-project.properties.
#
# Coverage is not measured again here: Quality's tarpaulin run uploads its LCOV
# file, and this workflow downloads it from that run. A Quality run without it
# (a failing test) leaves the scan without coverage.
#
# One-time setup: the project paxel_sanshain-service on SonarQube Cloud with
# Automatic Analysis off, and the repository secret SQ_TOKEN.
name: SonarQube Cloud

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [summer]

permissions:
  contents: read
  actions: read

jobs:
  sonar:
    name: SonarQube Cloud analysis
    # Only this repository's own pushes: code from a fork never runs here with the
    # token. A cancelled Quality run was superseded by a newer push, which brings its own.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      # The commit Quality tested, with the full history for the blame and the
      # new-code period.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      # Keep in sync with rust-toolchain.toml; toolchain bumps are deliberate, separate PRs.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy report for the analyzer
        run: |
          mkdir -p build
          cargo clippy --all-targets --locked --message-format=json > build/clippy-report.json
      - name: Coverage from the Quality run
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SQ_TOKEN }}
