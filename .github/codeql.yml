# What CodeQL leaves out (paxel/gates codeql.yml, input config-file).
#
# static/vendor holds minified third-party libraries served as they are (dagre, diff2html,
# echarts, mermaid): upstream's code. node_modules and site-dist are installed and built
# output, absent in a fresh checkout and named for a local run.
#
# tests and benches are test code: the passwords, tokens and keys there are fixtures of
# throwaway instances, which CodeQL reports as hard-coded credentials one by one. The unit
# tests inside src/ cannot be left out by path; their findings are accepted per file in
# code-scanning-ignores.toml.
paths-ignore:
  - static/vendor
  - node_modules
  - site-dist
  - tests
  - benches
